<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FBFAF4">
<title>Admin · Dialed By H</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-fpj-32.png?v=4">

<style>
/*
 * Admin console, built in the Boston Watch Club admin's design language:
 * cream ground, Departure Mono chrome, TikTok Sans display, black tab pills.
 * Deliberately self-contained — it does NOT load /dist/styles.css, because the
 * site's global sheet uppercases the whole body and would fight every label
 * here. Tokens below are lifted from the BWC theme.
 */
@font-face {
    font-family: 'tronica-mono';
    src: url('/fonts/DepartureMono-Regular.otf') format('opentype');
    font-weight: 400; font-display: block;
}
@font-face {
    font-family: 'tiktok';
    src: url('/fonts/TikTokSans.ttf') format('truetype');
    font-weight: 100 900; font-display: block;
}

:root {
    --label: 0,0,0;
    --label-d: 54,54,48;
    --bg-deep: 251,250,244;
    --l1: rgba(var(--label),1);
    --l2: rgba(var(--label-d),.6);
    --l3: rgba(var(--label-d),.32);
    --line: rgba(var(--label-d),.1);
    --b1: rgb(var(--bg-deep));
    --be: #efede7;
    --mono: 'tronica-mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sans: 'tiktok', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--b1); }
body { color: var(--l1); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
::selection { background: #fff; color: #000; }
a { color: inherit; text-decoration: none; }

.mono { font-family: var(--mono); }
.hidden { display: none !important; }

/* ── header ─────────────────────────────────────────────── */
header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px; font-family: var(--mono); font-size: 15px;
    background: rgba(var(--bg-deep),.8); backdrop-filter: blur(6px);
}
@media (min-width: 1024px) { header { padding: 28px 56px; } }
header img { height: 16px; width: auto; display: block; }
@media (min-width: 1024px) { header img { height: 18px; } }
.hbtn {
    font-family: var(--mono); font-size: 15px; text-transform: uppercase;
    background: none; border: 0; padding: 8px; cursor: pointer; color: var(--l1);
    position: relative;
}
.hbtn::before {
    content: ''; position: absolute; inset: 0;
    border: 2px dotted transparent; transition: border-color .2s; pointer-events: none;
}
.hbtn:hover::before { border-color: var(--l1); }

/* ── layout ─────────────────────────────────────────────── */
main { margin: 0 auto; padding: 96px 24px; width: 100%; max-width: 1100px; }
@media (min-width: 1024px) { main { padding: 128px 24px; } }

.eyebrow { font-family: var(--mono); font-size: 14px; text-transform: uppercase; color: var(--l2); }
h1.title {
    margin-top: 8px; font-weight: 700; font-size: 40px; line-height: 1;
    letter-spacing: -.02em; text-transform: uppercase;
    font-variation-settings: 'wdth' 120;
}
@media (min-width: 1024px) { h1.title { font-size: 60px; } }

/* ── tabs ───────────────────────────────────────────────── */
nav.tabs {
    margin-top: 32px; display: flex; flex-wrap: wrap; gap: 8px;
    font-family: var(--mono); font-size: 14px; text-transform: uppercase;
    border-bottom: 1px solid var(--line);
}
nav.tabs button {
    padding: 12px 16px; cursor: pointer; background: none; border: 0;
    font: inherit; color: var(--l1); transition: background .15s, color .15s;
}
nav.tabs button:hover { color: var(--l1); background: rgba(var(--label-d),.05); }
nav.tabs button[aria-selected="true"] { background: #000; color: var(--b1); }

section.body { margin-top: 40px; min-height: 40vh; }

/* ── controls ───────────────────────────────────────────── */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; }
input.ctl, select.ctl, textarea.ctl {
    font-family: var(--mono); font-size: 13px; color: var(--l1);
    background: transparent; border: 1px solid var(--line);
    padding: 9px 11px; outline: none; border-radius: 0;
}
input.ctl:focus, select.ctl:focus, textarea.ctl:focus { border-color: var(--l1); }
input.ctl::placeholder { color: var(--l3); }
.grow { flex: 1; min-width: 200px; }

.btn {
    font-family: var(--mono); font-size: 13px; text-transform: uppercase;
    padding: 10px 16px; cursor: pointer; border: 1px solid #000;
    background: #000; color: var(--b1); transition: opacity .15s;
}
.btn:hover { opacity: .82; }
.btn.ghost { background: transparent; color: var(--l1); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--l1); opacity: 1; }
.btn.danger { background: transparent; color: #b3261e; border-color: rgba(179,38,30,.35); }
.btn.danger:hover { border-color: #b3261e; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.count { font-family: var(--mono); font-size: 13px; text-transform: uppercase; color: var(--l2); margin-bottom: 12px; }

/* ── rows ───────────────────────────────────────────────── */
.row {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 4px; border-bottom: 1px solid var(--line);
    cursor: pointer; transition: background .12s;
}
.row:hover { background: rgba(var(--label-d),.04); }
.row .thumb {
    width: 46px; height: 46px; flex: none; background: var(--be);
    object-fit: cover; display: block;
}
.row .ph {
    width: 46px; height: 46px; flex: none; background: var(--be);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 8px; color: var(--l3);
}
.row .rname { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.row .rmeta {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase;
    color: var(--l2); margin-top: 3px; word-break: break-word;
}
.row .rgrow { flex: 1; min-width: 0; }
.pill {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    border: 1px solid var(--line); padding: 3px 7px; white-space: nowrap;
}
.pill.on { background: #000; color: var(--b1); border-color: #000; }

/* ── editor ─────────────────────────────────────────────── */
.sheet {
    position: fixed; inset: 0; z-index: 100; background: rgba(var(--bg-deep),.97);
    overflow-y: auto; padding: 24px;
}
.sheet-inner { max-width: 900px; margin: 0 auto; padding-bottom: 80px; }
.sheet h2 {
    font-weight: 700; font-size: 30px; text-transform: uppercase;
    letter-spacing: -.02em; font-variation-settings: 'wdth' 120; margin-bottom: 4px;
}
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-top: 28px; }
.field label {
    display: block; font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: .06em; color: var(--l2); margin-bottom: 6px;
}
.field input, .field textarea {
    width: 100%; font-family: var(--mono); font-size: 13px; color: var(--l1);
    background: transparent; border: 0; border-bottom: 1px solid var(--line);
    padding: 8px 2px; outline: none;
}
.field input:focus, .field textarea:focus { border-bottom-color: var(--l1); }
.field.wide { grid-column: 1 / -1; }

.imgs { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
.imgcard { position: relative; width: 110px; }
.imgcard img { width: 110px; height: 110px; object-fit: cover; background: var(--be); display: block; }
.imgcard .tools { display: flex; gap: 4px; margin-top: 5px; }
.imgcard .tools button {
    flex: 1; font-family: var(--mono); font-size: 10px; padding: 3px;
    border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--l1);
}
.imgcard .tools button:hover { border-color: var(--l1); }
.imgcard .primary {
    position: absolute; top: 4px; left: 4px; background: #000; color: var(--b1);
    font-family: var(--mono); font-size: 9px; padding: 2px 5px; text-transform: uppercase;
}

.note { font-family: var(--mono); font-size: 12px; color: var(--l2); margin-top: 8px; }
.err { font-family: var(--mono); font-size: 13px; color: #b3261e; text-transform: uppercase; margin-top: 12px; }

/* ── login ──────────────────────────────────────────────── */
#gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
#gate .box { width: 100%; max-width: 400px; }
#gate input {
    width: 100%; font-family: var(--mono); font-size: 14px; color: var(--l1);
    background: transparent; border: 0; border-bottom: 1px solid var(--l3);
    padding: 12px 2px; outline: none; margin-bottom: 20px;
}
#gate input:focus { border-bottom-color: var(--l1); }
</style>
</head>
<body>

<!-- LOGIN -->
<section id="gate">
    <div class="box">
        <img src="/images/logo.png" alt="Dialed By H" style="height:18px;width:auto;display:block;margin-bottom:28px">
        <p class="eyebrow">Control Room</p>
        <h1 class="title" style="font-size:40px;margin-bottom:28px">Admin</h1>
        <form id="gate-form">
            <input id="gate-pw" type="password" autocomplete="current-password" placeholder="ADMIN PASSWORD">
            <button class="btn" type="submit" style="width:100%">Sign In</button>
            <p id="gate-err" class="err hidden">Wrong password</p>
        </form>
    </div>
</section>

<!-- CONSOLE -->
<div id="app" class="hidden">
    <header>
        <a href="/"><img src="/images/logo.png" alt="Dialed By H"></a>
        <button id="signout" class="hbtn">Sign Out</button>
    </header>

    <main>
        <p class="eyebrow">Control Room</p>
        <h1 class="title">Admin</h1>

        <nav class="tabs" id="tabs">
            <button data-tab="pieces"  aria-selected="true">Pieces</button>
            <button data-tab="journal" aria-selected="false">Journal</button>
            <button data-tab="leads"   aria-selected="false">Leads</button>
        </nav>

        <section class="body" id="view"></section>
    </main>
</div>

<!-- EDITOR SHEET -->
<div id="sheet" class="sheet hidden"><div class="sheet-inner" id="sheet-inner"></div></div>

<script src="/scripts/admin-auth.js"></script>
<script>
(function () {
    'use strict';

    var A = window.dialedAdmin;
    var gate = document.getElementById('gate');
    var app = document.getElementById('app');
    var view = document.getElementById('view');
    var sheet = document.getElementById('sheet');
    var sheetInner = document.getElementById('sheet-inner');

    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ── auth ────────────────────────────────────────────────
    function boot() {
        gate.classList.add('hidden');
        app.classList.remove('hidden');
        // Honour a deep link like /admin/#journal (the standalone article
        // editor links back this way).
        var want = (location.hash || '').replace('#', '');
        show(TABS[want] ? want : 'pieces');
    }

    document.getElementById('gate-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var err = document.getElementById('gate-err');
        err.classList.add('hidden');
        // Probe the pieces endpoint: it is the tab that opens first, so a pass
        // here means the console is actually usable.
        var ok = await A.tryLoginWith(document.getElementById('gate-pw').value, '/api/get-inventory', 'list');
        if (ok) boot(); else err.classList.remove('hidden');
    });

    document.getElementById('signout').addEventListener('click', function () {
        A.clearToken();
        location.reload();
    });

    // ── tabs ────────────────────────────────────────────────
    var TABS = { pieces: renderPieces, journal: renderJournal, leads: renderLeads };

    document.getElementById('tabs').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-tab]');
        if (b) show(b.dataset.tab);
    });

    function show(tab) {
        [].forEach.call(document.querySelectorAll('#tabs button'), function (b) {
            b.setAttribute('aria-selected', String(b.dataset.tab === tab));
        });
        try { history.replaceState(null, '', '#' + tab); } catch (e) {}
        view.innerHTML = '<p class="count">Loading…</p>';
        TABS[tab]().catch(function (err) {
            view.innerHTML = '<p class="err">' + esc(err.message || 'Failed to load') + '</p>';
        });
    }

    // ══════════════════════════════════════════════════════════
    // PIECES
    // ══════════════════════════════════════════════════════════
    var PIECES = [];
    var PAGE = 60;
    var shown = PAGE;
    var query = '';

    async function renderPieces(force) {
        var r = await A.adminFetchTo('/api/get-inventory', 'list', { force: !!force });
        PIECES = r.pieces || [];
        shown = PAGE;
        paintPieces();
    }

    function filtered() {
        if (!query) return PIECES;
        var q = query.toLowerCase();
        return PIECES.filter(function (p) {
            return (p.name + ' ' + p.brand + ' ' + p.model + ' ' + p.ref + ' ' +
                    (p.nickname || '') + ' ' + (p.collections || []).join(' ')).toLowerCase().indexOf(q) >= 0;
        });
    }

    function paintPieces() {
        var list = filtered();
        var slice = list.slice(0, shown);

        var html =
            '<div class="bar">' +
              '<input id="p-q" class="ctl grow" type="search" placeholder="SEARCH BRAND, MODEL, REF…" value="' + esc(query) + '">' +
              '<button class="btn ghost" id="p-refresh">Refresh</button>' +
              '<button class="btn" id="p-new">New Piece</button>' +
            '</div>' +
            '<p class="count">' + list.length + ' piece' + (list.length === 1 ? '' : 's') +
              (query ? ' matching “' + esc(query) + '”' : '') + '</p>' +
            slice.map(pieceRow).join('') +
            (slice.length < list.length
                ? '<div style="margin-top:20px"><button class="btn ghost" id="p-more">Load ' +
                  Math.min(PAGE, list.length - slice.length) + ' more</button></div>'
                : '');

        view.innerHTML = html;

        var q = document.getElementById('p-q');
        q.addEventListener('input', function () {
            query = this.value; shown = PAGE;
            var pos = this.selectionStart;
            paintPieces();
            var n = document.getElementById('p-q');
            n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {}
        });
        document.getElementById('p-refresh').addEventListener('click', function () {
            view.innerHTML = '<p class="count">Refreshing…</p>';
            renderPieces(true);
        });
        document.getElementById('p-new').addEventListener('click', function () { editPiece(null); });
        var more = document.getElementById('p-more');
        if (more) more.addEventListener('click', function () { shown += PAGE; paintPieces(); });

        [].forEach.call(view.querySelectorAll('.row[data-id]'), function (el) {
            el.addEventListener('click', function () {
                editPiece(PIECES.find(function (p) { return p.id === el.dataset.id; }));
            });
        });
    }

    function pieceRow(p) {
        var thumb = p.image
            ? '<img class="thumb" src="' + esc(p.image) + '" alt="" loading="lazy">'
            : '<div class="ph">NO IMG</div>';
        var meta = [p.ref, p.caseSize, p.dialColor, p.condition].filter(Boolean).join(' · ');
        return '<div class="row" data-id="' + esc(p.id) + '">' +
            thumb +
            '<div class="rgrow">' +
                '<div class="rname">' + esc(p.brand + ' ' + (p.nickname || p.model || p.name)) + '</div>' +
                '<div class="rmeta">' + esc(meta || '—') + '</div>' +
            '</div>' +
            (p.collections && p.collections.length
                ? '<span class="pill">' + esc(p.collections[0]) + '</span>' : '') +
        '</div>';
    }

    // ── piece editor ────────────────────────────────────────
    var F = [
        ['piece', 'Piece', 'wide'], ['brand', 'Brand'], ['model', 'Model'],
        ['nickname', 'Nickname'], ['ref', 'Reference Number'],
        ['case_material', 'Case Material'], ['case_size_mm', 'Case Size (mm)'],
        ['dial_color', 'Dial Color'], ['bracelet', 'Bracelet/Strap'],
        ['condition', 'Condition'], ['set_included', 'Set'], ['year', 'Year'],
        ['collections', 'Collections (comma separated)', 'wide'],
        ['celebs', 'Celebrities (comma separated)', 'wide'],
        ['tags', 'SEO Tags', 'wide'],
    ];

    // site shape -> form values (the API writes snake_case columns)
    function toForm(p) {
        if (!p) return {};
        return {
            piece: p.name, brand: p.brand, model: p.model, nickname: p.nickname, ref: p.ref,
            case_material: p.caseMaterial, case_size_mm: (p.caseSize || '').replace('mm', ''),
            dial_color: p.dialColor, bracelet: p.bracelet, condition: p.condition,
            set_included: p.set, year: p.year,
            collections: (p.collections || []).join(', '),
            celebs: (p.celebs || []).join(', '),
            tags: p.tags || '',
        };
    }

    function editPiece(p) {
        var v = toForm(p);
        var isNew = !p;

        sheetInner.innerHTML =
            '<div class="bar" style="justify-content:space-between">' +
              '<button class="btn ghost" id="s-close">← Back</button>' +
              '<div style="display:flex;gap:8px">' +
                (isNew ? '' : '<button class="btn danger" id="s-del">Delete</button>') +
                '<button class="btn" id="s-save">Save</button>' +
              '</div>' +
            '</div>' +
            '<h2>' + (isNew ? 'New Piece' : esc(p.brand + ' ' + (p.model || ''))) + '</h2>' +
            (isNew ? '' : '<p class="note">/watch/' + esc(p.slug) + '</p>') +
            '<div class="fields">' +
              F.map(function (f) {
                  return '<div class="field ' + (f[2] || '') + '">' +
                      '<label for="f-' + f[0] + '">' + esc(f[1]) + '</label>' +
                      (f[0] === 'tags'
                          ? '<textarea id="f-' + f[0] + '" rows="3">' + esc(v[f[0]] || '') + '</textarea>'
                          : '<input id="f-' + f[0] + '" value="' + esc(v[f[0]] || '') + '">') +
                  '</div>';
              }).join('') +
            '</div>' +
            (isNew
                ? '<p class="note" style="margin-top:28px">Save the piece first, then add photos.</p>'
                : '<div style="margin-top:36px">' +
                    '<label class="eyebrow" style="font-size:11px">Photos</label>' +
                    '<div class="imgs" id="s-imgs"></div>' +
                    '<div style="margin-top:14px">' +
                      '<input type="file" id="s-file" accept="image/*" class="hidden">' +
                      '<button class="btn ghost" id="s-add">Add Photo</button>' +
                      '<span class="note" id="s-upstat"></span>' +
                    '</div>' +
                    '<p class="note">First photo is the one the site uses. Images are processed the same way the catalog always has been.</p>' +
                  '</div>') +
            '<p class="err hidden" id="s-err"></p>';

        sheet.classList.remove('hidden');
        document.body.style.overflow = 'hidden';

        document.getElementById('s-close').addEventListener('click', closeSheet);
        document.getElementById('s-save').addEventListener('click', function () { savePiece(p); });
        var del = document.getElementById('s-del');
        if (del) del.addEventListener('click', function () { deletePiece(p); });

        if (!isNew) {
            paintImages(p);
            document.getElementById('s-add').addEventListener('click', function () {
                document.getElementById('s-file').click();
            });
            document.getElementById('s-file').addEventListener('change', function () {
                if (this.files && this.files[0]) uploadPhoto(p, this.files[0]);
            });
        }
    }

    function closeSheet() {
        sheet.classList.add('hidden');
        document.body.style.overflow = '';
    }

    function sheetErr(msg) {
        var e = document.getElementById('s-err');
        e.textContent = msg;
        e.classList.remove('hidden');
    }

    function paintImages(p) {
        var box = document.getElementById('s-imgs');
        if (!box) return;
        var imgs = p.images || [];
        box.innerHTML = imgs.length
            ? imgs.map(function (u, i) {
                return '<div class="imgcard">' +
                    (i === 0 ? '<span class="primary">Main</span>' : '') +
                    '<img src="' + esc(u) + '" alt="" loading="lazy">' +
                    '<div class="tools">' +
                        (i > 0 ? '<button data-up="' + i + '">←</button>' : '') +
                        '<button data-rm="' + i + '">Remove</button>' +
                    '</div>' +
                '</div>';
            }).join('')
            : '<p class="note">No photos yet.</p>';

        [].forEach.call(box.querySelectorAll('[data-up]'), function (b) {
            b.addEventListener('click', function () {
                var i = +b.dataset.up;
                var order = p.images.map(function (_, n) { return n; });
                order.splice(i - 1, 0, order.splice(i, 1)[0]);
                setImages(p, order);
            });
        });
        [].forEach.call(box.querySelectorAll('[data-rm]'), function (b) {
            b.addEventListener('click', function () {
                var i = +b.dataset.rm;
                if (!confirm('Remove this photo?')) return;
                var order = p.images.map(function (_, n) { return n; }).filter(function (n) { return n !== i; });
                setImages(p, order);
            });
        });
    }

    async function setImages(p, order) {
        try {
            var r = await A.adminFetchTo('/api/get-inventory', 'set-images', { id: p.id, order: order });
            Object.assign(p, r.piece);
            replaceLocal(r.piece);
            paintImages(p);
        } catch (e) { sheetErr(e.message); }
    }

    // Downscale before upload: Vercel caps a request body at ~4.5MB, and a raw
    // phone photo blows past that. PNG keeps the alpha channel that the
    // background-removed pieces depend on.
    function downscale(file, max) {
        return new Promise(function (resolve, reject) {
            var img = new Image();
            var url = URL.createObjectURL(file);
            img.onload = function () {
                URL.revokeObjectURL(url);
                var w = img.width, h = img.height;
                var s = Math.min(1, max / Math.max(w, h));
                var c = document.createElement('canvas');
                c.width = Math.round(w * s); c.height = Math.round(h * s);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                resolve(c.toDataURL('image/png'));
            };
            img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Could not read that image')); };
            img.src = url;
        });
    }

    async function uploadPhoto(p, file) {
        var stat = document.getElementById('s-upstat');
        stat.textContent = ' Processing…';
        try {
            var data = await downscale(file, 1800);
            stat.textContent = ' Uploading…';
            var r = await A.adminFetchTo('/api/get-inventory', 'upload-image', { id: p.id, data: data });
            Object.assign(p, r.piece);
            replaceLocal(r.piece);
            paintImages(p);
            stat.textContent = ' Done';
            setTimeout(function () { stat.textContent = ''; }, 1500);
        } catch (e) {
            stat.textContent = '';
            sheetErr(e.message);
        }
    }

    function replaceLocal(piece) {
        var i = PIECES.findIndex(function (x) { return x.id === piece.id; });
        if (i >= 0) PIECES[i] = piece; else PIECES.unshift(piece);
    }

    async function savePiece(p) {
        var fields = {};
        F.forEach(function (f) {
            var el = document.getElementById('f-' + f[0]);
            if (!el) return;
            var val = el.value.trim();
            if (f[0] === 'collections' || f[0] === 'celebs') {
                fields[f[0]] = val ? val.split(',').map(function (s) { return s.trim(); }).filter(Boolean) : [];
            } else {
                fields[f[0]] = val;
            }
        });
        var btn = document.getElementById('s-save');
        btn.disabled = true; btn.textContent = 'Saving…';
        try {
            var r = await A.adminFetchTo('/api/get-inventory', 'save', { id: p ? p.id : null, fields: fields });
            replaceLocal(r.piece);
            closeSheet();
            paintPieces();
        } catch (e) {
            sheetErr(e.message);
            btn.disabled = false; btn.textContent = 'Save';
        }
    }

    async function deletePiece(p) {
        if (!confirm('Delete "' + (p.name || p.brand) + '" and all its photos? This cannot be undone.')) return;
        try {
            await A.adminFetchTo('/api/get-inventory', 'delete', { id: p.id });
            PIECES = PIECES.filter(function (x) { return x.id !== p.id; });
            closeSheet();
            paintPieces();
        } catch (e) { sheetErr(e.message); }
    }

    // ══════════════════════════════════════════════════════════
    // JOURNAL
    // ══════════════════════════════════════════════════════════
    async function renderJournal() {
        var r = await A.adminFetchTo('/api/journal-admin', 'list-all');
        var arts = r.articles || [];
        view.innerHTML =
            '<div class="bar">' +
              '<a class="btn" href="/admin/journal/edit.html">New Article</a>' +
              '<a class="btn ghost" href="/journal/">View Journal</a>' +
            '</div>' +
            '<p class="count">' + arts.length + ' article' + (arts.length === 1 ? '' : 's') + '</p>' +
            (arts.length ? arts.map(function (a) {
                var when = a.published_at || a.updated_at || a.created_at;
                return '<a class="row" href="/admin/journal/edit.html?id=' + encodeURIComponent(a.id) + '">' +
                    (a.hero_image_url
                        ? '<img class="thumb" src="' + esc(a.hero_image_url) + '" alt="" loading="lazy">'
                        : '<div class="ph">NO IMG</div>') +
                    '<div class="rgrow">' +
                        '<div class="rname">' + esc(a.title || 'Untitled') + '</div>' +
                        '<div class="rmeta">' + esc([
                            a.category,
                            when ? new Date(when).toLocaleDateString() : '',
                            (a.view_count != null ? a.view_count + ' views' : '')
                        ].filter(Boolean).join(' · ')) + '</div>' +
                    '</div>' +
                    '<span class="pill' + (a.status === 'published' ? ' on' : '') + '">' + esc(a.status || 'draft') + '</span>' +
                '</a>';
            }).join('') : '<p class="note">No articles yet.</p>');
    }

    // ══════════════════════════════════════════════════════════
    // LEADS
    // ══════════════════════════════════════════════════════════
    var LEADS = [];
    var lq = '';

    async function renderLeads() {
        var r = await A.adminFetchTo('/api/leads-admin', 'list');
        LEADS = r.leads || [];
        paintLeads();
    }

    function paintLeads() {
        var q = lq.toLowerCase();
        var list = q ? LEADS.filter(function (l) {
            return JSON.stringify(l).toLowerCase().indexOf(q) >= 0;
        }) : LEADS;

        view.innerHTML =
            '<div class="bar">' +
              '<input id="l-q" class="ctl grow" type="search" placeholder="SEARCH LEADS…" value="' + esc(lq) + '">' +
              '<button class="btn ghost" id="l-refresh">Refresh</button>' +
            '</div>' +
            '<p class="count">' + list.length + ' lead' + (list.length === 1 ? '' : 's') + '</p>' +
            (list.length ? list.slice(0, 200).map(function (l) {
                var meta = [
                    l.email, l.phone,
                    l.created_at ? new Date(l.created_at).toLocaleDateString() : '',
                    l.submission_type,
                ].filter(Boolean).join(' · ');
                var cls = l.lead_class || '';
                return '<div class="row" style="cursor:default">' +
                    '<div class="rgrow">' +
                        '<div class="rname">' + esc(l.full_name || l.email || 'Unknown') + '</div>' +
                        '<div class="rmeta">' + esc(meta) + '</div>' +
                        (l.watch_details ? '<div class="rmeta">' + esc(l.watch_details) + '</div>' : '') +
                    '</div>' +
                    (l.lead_quality ? '<span class="pill">' + esc(l.lead_quality) + '</span>' : '') +
                    (cls ? '<span class="pill' + (cls === 'REAL' ? ' on' : '') + '">' + esc(cls) + '</span>' : '') +
                '</div>';
            }).join('') : '<p class="note">No leads yet.</p>') +
            (list.length > 200 ? '<p class="note">Showing the first 200. Use search to narrow.</p>' : '');

        var qi = document.getElementById('l-q');
        qi.addEventListener('input', function () {
            lq = this.value;
            var pos = this.selectionStart;
            paintLeads();
            var n = document.getElementById('l-q');
            n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {}
        });
        document.getElementById('l-refresh').addEventListener('click', function () {
            view.innerHTML = '<p class="count">Refreshing…</p>';
            renderLeads();
        });
    }

    // ── go ──────────────────────────────────────────────────
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !sheet.classList.contains('hidden')) closeSheet();
    });

    if (A.isAuthed()) boot();
})();
</script>
