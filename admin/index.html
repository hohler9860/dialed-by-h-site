                          '<td><span class="tmono">' + esc(money(a.price_usd)) + '</span></td>' +
                          '<td><span class="tmono">' + esc(money(a.baseline_usd)) + '</span></td>' +
                          '<td><span class="tag hot">' + Math.round(a.discount_pct || 0) + '%</span></td>' +
                          '<td><span class="tmono">' + esc(money(a.profit_at_8)) + '</span></td>' +
                          '<td>' + (a.sellable === false ? '<span class="tag spam">no room</span>' : '<span class="tmono">ok</span>') + '</td>' +
                        '</tr>';
                    }).join('') : '<tr><td colspan="6" style="padding:28px 0"><span class="tmono">No alerts yet.</span></td></tr>') +
                    '</tbody></table></div>';
        }

        view.innerHTML = html;
        wireMatches();
    }

    // A card, not a row: this is the thing Henry acts on, and it needs both
    // phone numbers and the money in one glance.
    function mxCard(m) {
        var w = m.want || {};
        var piece = [w.brand, w.model, m.reference || w.reference].filter(Boolean).join(' ') || 'Watch';
        var days = w.opened_at ? Math.floor((Date.now() - new Date(w.opened_at).getTime()) / 864e5) : 0;
        var cp = String(w.client_phone || '').replace(/\D/g, '');
        var dp = String(m.dealer_phone || '').replace(/\D/g, '');
        // A target price only exists when retail was matched like for like.
        var verified = (m.quote_confidence === 'HIGH' || m.quote_confidence === 'MEDIUM')
                       && m.quote_high != null;

        var spec = [
            m.listing && m.listing.year,
            m.listing && m.listing.condition && m.listing.condition !== 'UNKNOWN'
                ? m.listing.condition.replace(/_/g, ' ') : null,
            m.listing && m.listing.set_completeness && m.listing.set_completeness !== 'UNKNOWN'
                ? m.listing.set_completeness.replace(/_/g, ' ') : null,
            m.listing && m.listing.case_material ? m.listing.case_material.replace(/_/g, ' ') : null,
            m.listing && m.listing.dial_material && m.listing.dial_material !== 'STANDARD'
                ? m.listing.dial_material : null,
            m.listing && m.listing.has_diamonds ? 'diamonds' : null,
            m.listing && m.listing.nickname ? '"' + m.listing.nickname + '"' : null,
        ].filter(Boolean).join(' · ');

        return '<div class="scard" style="margin-bottom:10px">' +
          '<div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px">' +
            // The dealer's own photo: how condition actually gets judged.
            (m.image_url
              ? '<img class="wthumb" style="width:64px;height:64px;flex:0 0 64px" ' +
                'src="' + esc(m.image_url) + '" alt="" loading="lazy" decoding="async">'
              : '') +
            '<div style="flex:1">' +
              '<div class="tname">' + esc(w.client_name || 'Client') +
                (w.lead_quality ? ' <span class="tag ' + w.lead_quality.toLowerCase() + '">' + esc(w.lead_quality) + '</span>' : '') +
                (w.ok_to_text === false ? ' <span class="tag spam">no texts</span>' : '') + '</div>' +
              '<div class="tsub">' + esc(piece) + ' · asked ' + (days === 0 ? 'today' : days + 'd ago') + '</div>' +
              (spec ? '<div class="tsub">' + esc(spec) + '</div>' : '') +
            '</div>' +
            // Only show a range when retail was matched like for like. Otherwise
            // the floor is the only number the system can stand behind.
            '<div style="text-align:right">' +
              '<div class="tname">' + (verified
                  ? esc(money(m.profit_low)) + ' to ' + esc(money(m.profit_high))
                  : esc(money(m.profit_low)) + '+') + '</div>' +
              '<div class="tsub">' + (verified ? 'your margin' : 'floor margin, retail unverified') + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="dgrid" style="margin-top:10px">' +
            '<div><div class="dk">Dealer asks</div><div class="dv">' + esc(money(m.dealer_price)) + '</div></div>' +
            '<div><div class="dk">You quote</div><div class="dv">' + (verified
                ? esc(money(m.quote_low)) + ' to ' + esc(money(m.quote_high))
                : esc(money(m.quote_low)) + ' floor') + '</div></div>' +
            '<div><div class="dk">Retail</div><div class="dv">' + (m.retail_median
                ? esc(money(m.retail_median)) + (m.retail_source ? ' (' + esc(m.retail_source) + ')' : '')
                : 'not comparable yet') + '</div></div>' +
            '<div><div class="dk">Confidence</div><div class="dv">' +
                esc(m.quote_confidence || 'NONE') + (m.match_tier ? ' · ' + esc(m.match_tier) : '') + '</div></div>' +
            '<div><div class="dk">Dealer</div><div class="dv">' + esc(m.dealer_name || 'unknown') + '</div></div>' +
          '</div>' +
          '<div class="row" style="gap:8px;margin-top:10px">' +
            (cp ? '<a class="btn ghost" href="https://wa.me/' + esc(cp) + '" target="_blank" rel="noopener">Message client</a>' : '') +
            (dp ? '<a class="btn ghost" href="https://wa.me/' + esc(dp) + '" target="_blank" rel="noopener">Open dealer chat</a>' : '') +
            (dp ? '<button class="btn ghost js-ask" data-listing="' + esc(m.listing_id) + '">Ask if available</button>' : '') +
            ((m.reference || w.reference)
              ? '<button class="btn ghost js-source" data-ref="' + esc(m.reference || w.reference) + '">Source it</button>'
              : '') +
            (m.listing ? '<button class="btn ghost js-piece" data-piece="' + esc(m.listing_id) + '">View the piece</button>' : '') +
          '</div>' +
          '<div class="piece-panel" data-piecefor="' + esc(m.listing_id || '') + '"></div>' +
          '<div class="src-panel" data-srcfor="' + esc(m.reference || w.reference || '') + '"></div>' +
        '</div>';
    }

    // The dealer's own photo, full size, next to every attribute that was read
    // off the post. Condition on a used watch is judged by eye, so the picture
    // is the point, not a decoration.
    function piecePanel(m) {
        var l = m.listing || {};
        var rows = [
            ['Reference',     l.reference],
            ['Asking',        l.price_usd ? money(l.price_usd) : null],
            ['Year',          l.year],
            ['Condition',     l.condition && l.condition !== 'UNKNOWN' ? l.condition.replace(/_/g, ' ') : null],
            ['Contents',      l.set_completeness && l.set_completeness !== 'UNKNOWN' ? l.set_completeness.replace(/_/g, ' ') : null],
            ['Dial',          [l.dial_color, l.dial_material && l.dial_material !== 'STANDARD' ? l.dial_material : null].filter(Boolean).join(' ')],
            ['Case',          [l.case_material, l.case_size_mm ? l.case_size_mm + 'mm' : null].filter(Boolean).join(' ').replace(/_/g, ' ')],
            ['Bezel',         l.bezel],
            ['Bracelet',      l.bracelet],
            ['Complications', (l.complications || []).join(', ').replace(/_/g, ' ')],
            ['Diamonds',      l.has_diamonds ? (l.diamonds_factory === true ? 'factory' : l.diamonds_factory === false ? 'aftermarket' : 'yes, source unstated') : null],
            ['Nickname',      l.nickname],
            ['Dealer',        l.seller_name || m.dealer_name],
            ['Posted',        l.message_ts ? fmtAgo(l.message_ts) : null],
        ].filter(function (r) { return r[1]; })
         .map(function (r) { return '<div><div class="dk">' + r[0] + '</div><div class="dv">' + esc(r[1]) + '</div></div>'; })
         .join('');

        var tcls = l.trust_score >= 85 ? 'hot' : l.trust_score >= 70 ? 'warm' : 'spam';

        return '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">' +
          '<div class="row" style="gap:16px;align-items:flex-start;flex-wrap:wrap">' +
            (m.image_url
              ? '<a href="' + esc(m.image_url) + '" target="_blank" rel="noopener">' +
                '<img src="' + esc(m.image_url) + '" alt="" loading="lazy" decoding="async" ' +
                'style="width:280px;max-width:100%;border-radius:6px;display:block"></a>'
              : '<div class="wthumb wthumb--none" style="width:280px;height:200px"></div>') +
            '<div style="flex:1;min-width:240px">' +
              '<div class="dgrid">' + rows + '</div>' +
              '<p class="count" style="margin-top:10px">Read with ' +
                '<span class="tag ' + tcls + '">' + esc(l.trust_score == null ? '—' : l.trust_score) + '</span> confidence' +
                (l.trust_why && l.trust_why.length ? ' · ' + esc(l.trust_why.join(', ')) : ' · nothing against it') +
              '</p>' +
            '</div>' +
          '</div>' +
          (m.image_url ? '<p class="count" style="margin-top:8px">Click the photo to open it full size</p>' : '') +
        '</div>';
    }

    // Every place this reference can be had right now. Group chats are the real
    // wholesale channel, but a store holding one in stock is still an option:
    // he DMs them and asks for a trade price. Their window price is shown as
    // written, because what they would actually sell it to him for is a
    // conversation, not a number this can work out.
    function srcRow(o) {
        var retail = o.o_channel === 'RETAIL';
        var where  = retail
            ? (o.o_url ? '<a href="' + esc(o.o_url) + '" target="_blank" rel="noopener">' + esc(o.o_source) + '</a>'
                       : esc(o.o_source))
            : esc(o.o_source);
        var reach = '';
        if (!retail) {
            var ph = String(o.o_contact || '').replace(/\D/g, '');
            reach = ph ? '<a class="btn ghost" style="padding:3px 8px;font-size:10px" href="https://wa.me/' +
                         esc(ph) + '" target="_blank" rel="noopener">WhatsApp</a>' : esc(o.o_contact || '');
        } else if (o.o_contact) {
            reach = '<a class="btn ghost" style="padding:3px 8px;font-size:10px" href="' +
                    esc(o.o_contact.indexOf('http') === 0 ? o.o_contact : 'https://instagram.com/' + o.o_contact.replace(/^@/, '')) +
                    '" target="_blank" rel="noopener">DM store</a>';
        }
        var spec = [o.o_year,
                    o.o_condition && o.o_condition !== 'UNKNOWN' ? o.o_condition.replace(/_/g, ' ') : null,
                    o.o_set && o.o_set !== 'UNKNOWN' ? o.o_set.replace(/_/g, ' ') : null]
                   .filter(Boolean).join(' · ');
        // How old the row is matters more on the retail side: a store listing is
        // only refreshed when the catalogue syncs, so a piece that sold weeks ago
        // can still read as in stock. Say so rather than implying it is live.
        var ageMs = o.o_seen_at ? (Date.now() - new Date(o.o_seen_at).getTime()) : null;
        var days  = ageMs == null ? null : Math.floor(ageMs / 864e5);
        var stale = retail && days != null && days >= 3;
        var seen  = o.o_seen_at
            ? '<div class="count"' + (stale ? ' style="color:' + WARN_AMBER + '"' : '') + '>' +
              (retail ? 'seen ' : 'posted ') + esc(fmtAgo(o.o_seen_at)) +
              (stale ? ' · confirm it is still there' : '') + '</div>'
            : '';

        return '<tr>' +
            '<td><span class="tag ' + (retail ? 'warm' : 'hot') + '">' + (retail ? 'RETAIL' : 'WHOLESALE') + '</span></td>' +
            '<td>' + where + seen + '</td>' +
            '<td>' + esc(o.o_title || '—') + (spec ? '<div class="count">' + esc(spec) + '</div>' : '') + '</td>' +
            '<td style="text-align:right">' + esc(money(o.o_price_usd)) +
                '<div class="count">' + (retail ? 'window price' : 'dealer ask') + '</div></td>' +
            '<td>' + reach + '</td>' +
        '</tr>';
    }

    function paintSourcing(ref, box) {
        box.innerHTML = '<p class="count" style="margin-top:10px">Looking…</p>';
        A.adminFetchTo('/api/leads-admin', 'sourcing', { reference: ref }).then(function (d) {
            var list = d.options || [];
            if (!list.length) {
                box.innerHTML = '<p class="count" style="margin-top:10px">Nothing in the groups or in stock anywhere right now.</p>';
                return;
            }
            box.innerHTML =
              '<p class="count" style="margin-top:12px">' + d.wholesale_n + ' in the group chats · ' +
              d.retail_n + ' sitting in stock at a store. Store prices are their window price, ' +
              'so ask for a trade price before you quote off them.</p>' +
              '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
                '<th style="width:96px">Channel</th><th style="width:150px">Where</th><th>Piece</th>' +
                '<th style="width:120px;text-align:right">Asking</th><th style="width:110px">Reach</th>' +
              '</tr></thead><tbody>' + list.map(srcRow).join('') + '</tbody></table></div>';
        }).catch(function (e) {
            box.innerHTML = '<p class="count" style="margin-top:10px">Could not load options: ' + esc(e.message || e) + '</p>';
        });
    }

    function wireMatches() {
        [].forEach.call(document.querySelectorAll('[data-mx]'), function (b) {
            b.addEventListener('click', function () { mxView = this.dataset.mx; paintMatches(); });
        });
        var q = document.getElementById('mx-q');
        if (q) q.addEventListener('input', function () {
            mxq = this.value; var p = this.selectionStart; paintMatches();
            var n = document.getElementById('mx-q');
            if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} }
        });
        var r = document.getElementById('mx-refresh');
        if (r) r.addEventListener('click', function () {
            view.innerHTML = '<p class="count">Loading…</p>';
            renderMatches().catch(function (e) { view.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
        });

        // Save a manual benchmark. It is stored against the spec this reference
        // actually trades in, so it is a like-for-like number rather than a
        // headline figure.
        [].forEach.call(document.querySelectorAll('.js-bm-save'), function (b) {
            b.addEventListener('click', async function () {
                var ref = this.dataset.ref;
                var input = document.querySelector('.js-bm-in[data-ref="' + ref + '"]');
                var val = input && input.value.trim();
                if (!val) { if (input) input.focus(); return; }
                var btn = this;
                btn.disabled = true; btn.textContent = '…';
                try {
                    await A.adminFetchTo('/api/leads-admin', 'set-benchmark', {
                        reference: ref,
                        retail_price: val,
                        condition: this.dataset.cond || null,
                        set_completeness: this.dataset.set || null,
                    });
                    btn.textContent = 'Saved';
                    // Re-read so the row flips out of INDICATIVE immediately.
                    renderMatches().catch(function () {});
                } catch (e) {
                    btn.disabled = false; btn.textContent = 'Set';
                    alert('Could not save: ' + e.message);
                }
            });
        });

        // Sends from Henry's own WhatsApp, so confirm first. Deliberately one
        // dealer at a time: an automated blast to people he trades with is the
        // quickest way to get the number flagged.
        [].forEach.call(document.querySelectorAll('.js-ask'), function (b) {
            b.addEventListener('click', async function () {
                var id = this.dataset.listing;
                if (!confirm('Send "is this still available?" to this dealer from your WhatsApp?')) return;
                var btn = this;
                btn.disabled = true; btn.textContent = 'Sending…';
                try {
                    var r = await A.adminFetchTo('/api/leads-admin', 'ask-dealer', { listing_id: Number(id) });
                    btn.textContent = 'Asked ✓';
                } catch (e) {
                    btn.disabled = false; btn.textContent = 'Ask if available';
                    alert('Could not send: ' + e.message);
                }
            });
        });

        var srcGo = document.getElementById('mx-src-go');
        var srcIn = document.getElementById('mx-src');
        var srcOut = document.getElementById('mx-src-out');
        function runLookup() {
            var ref = (srcIn.value || '').trim();
            if (!ref) { srcOut.innerHTML = ''; return; }
            paintSourcing(ref, srcOut);
        }
        if (srcGo) srcGo.addEventListener('click', runLookup);
        if (srcIn) srcIn.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); runLookup(); }
        });

        [].forEach.call(document.querySelectorAll('.js-piece'), function (b) {
            b.addEventListener('click', function () {
                var box = this.closest('.bcard').querySelector('.piece-panel');
                if (!box) return;
                if (box.innerHTML) { box.innerHTML = ''; this.textContent = 'View the piece'; return; }
                var id = String(this.dataset.piece);
                var m = (MX.best || []).filter(function (r) { return String(r.listing_id) === id; })[0];
                if (!m) return;
                box.innerHTML = piecePanel(m);
                this.textContent = 'Hide the piece';
            });
        });

        [].forEach.call(document.querySelectorAll('.js-source'), function (b) {
            b.addEventListener('click', function () {
                var ref = this.dataset.ref;
                var box = this.closest('.bcard').querySelector('.src-panel');
                if (!box) return;
                // second click closes it again
                if (box.innerHTML) { box.innerHTML = ''; this.textContent = 'Source it'; return; }
                this.textContent = 'Hide options';
                paintSourcing(ref, box);
            });
        });
    }

    // ══════════════════════════════════════════════════════════
    // DEALERS  — who posts what, and their real number
    // ══════════════════════════════════════════════════════════
    var DL = { rows: [], counters: {} };
    var dlq = '';

    async function renderDealers() {
        var r = await A.adminFetchTo('/api/leads-admin', 'dealers');
        DL.rows = r.dealers || []; DL.counters = r.counters || {};
        paintDealers();
    }

    function paintDealers() {
        var q = dlq.trim().toLowerCase();
        var rows = DL.rows.filter(function (d) {
            if (!q) return true;
            return [d.wa_name, d.push_name, d.phone].filter(Boolean).join(' ').toLowerCase().indexOf(q) >= 0;
        });
        var c = DL.counters;

        view.innerHTML =
          '<div class="tiles">' +
            '<div class="tile"><span class="tk">Posting dealers</span><span class="tv">' + (c.total || 0) + '</span></div>' +
            '<div class="tile"><span class="tk">With number</span><span class="tv">' + (c.with_phone || 0) + '</span></div>' +
            '<div class="tile"><span class="tk">Active 7d</span><span class="tv">' + (c.active_7d || 0) + '</span></div>' +
          '</div>' +
          '<div class="bar"><input id="dl-q" class="ctl grow" type="search" placeholder="SEARCH NAME OR NUMBER…" value="' + esc(dlq) + '">' +
            '<button class="btn ghost" id="dl-refresh">Refresh</button></div>' +
          '<p class="count">' + rows.length + ' of ' + DL.rows.length + ' · ranked by listings posted</p>' +
          '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
            '<th>Dealer</th><th style="width:130px">Number</th><th style="width:90px">Listings</th>' +
            '<th style="width:100px">Last post</th><th style="width:110px"></th>' +
          '</tr></thead><tbody>' +
          (rows.length ? rows.map(function (d) {
              var name = d.wa_name || (/^\d+$/.test(String(d.push_name || '')) ? null : d.push_name);
              var ph = String(d.phone || '').replace(/\D/g, '');
              return '<tr>' +
                '<td><div class="tname">' + esc(name || 'unnamed') + '</div>' +
                    '<div class="tsub">' + ((d.groups || []).length || 1) + ' group' + (((d.groups || []).length || 1) === 1 ? '' : 's') + '</div></td>' +
                '<td><span class="tmono">' + (ph ? esc('+' + ph) : '—') + '</span></td>' +
                '<td><span class="tmono">' + (d.listings_count || 0) + '</span></td>' +
                '<td><span class="tmono">' + esc(fmtDate(d.last_seen)) + '</span></td>' +
                '<td>' + (ph ? '<a class="btn ghost" href="https://wa.me/' + esc(ph) + '" target="_blank" rel="noopener">Message</a>' : '') + '</td>' +
              '</tr>';
          }).join('') : '<tr><td colspan="5" style="padding:28px 0"><span class="tmono">No dealers yet.</span></td></tr>') +
          '</tbody></table></div>';

        var q2 = document.getElementById('dl-q');
        if (q2) q2.addEventListener('input', function () {
            dlq = this.value; var p = this.selectionStart; paintDealers();
            var n = document.getElementById('dl-q');
            if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} }
        });
        var r = document.getElementById('dl-refresh');
        if (r) r.addEventListener('click', function () {
            view.innerHTML = '<p class="count">Loading…</p>';
            renderDealers().catch(function (e) { view.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
        });
    }

    // ══════════════════════════════════════════════════════════
    // NTQ  — dealer copy-paste lines built from client requests
    // ══════════════════════════════════════════════════════════
    // Rows come from the local scrape (scripts/ntq/) of iMessage, WhatsApp,
    // email and site submissions. The point of this tab is one gesture:
    // read the line, hit Copy, paste it into the dealer group.
    var NQ = { rows: [], counters: {} };
    var nqq = '', nqFilter = 'open';

    async function renderNTQ() {
        var d = await A.adminFetchTo('/api/leads-admin', 'ntq');
        NQ.rows = d.rows || []; NQ.counters = d.counters || {};
        paintNTQ();
    }

    function nqRows() {
        var needle = nqq.trim().toLowerCase();
        return NQ.rows.filter(function (r) {
            if (nqFilter !== 'all' && r.status !== nqFilter) return false;
            if (needle) {
                var hay = [r.ntq_text, r.contact, r.brand, r.model, r.reference, r.contact_handle]
                    .filter(Boolean).join(' ').toLowerCase();
                if (hay.indexOf(needle) < 0) return false;
            }
            return true;
        });
    }

    function paintNTQ() {
        var c = NQ.counters;
        var rows = nqRows();
        var FILTERS = ['open', 'quoted', 'sourced', 'dead', 'all'];

        view.innerHTML =
          '<div class="tiles">' +
            '<div class="tile"><span class="tk">Open</span><span class="tv">' + (c.open || 0) + '</span></div>' +
            '<div class="tile"><span class="tk">Needs a detail</span><span class="tv">' + (c.needs_detail || 0) + '</span></div>' +
            '<div class="tile"><span class="tk">Quoted</span><span class="tv">' + (c.quoted || 0) + '</span></div>' +
            '<div class="tile"><span class="tk">Sourced</span><span class="tv">' + (c.sourced || 0) + '</span></div>' +
          '</div>' +
          '<div class="bar">' +
            FILTERS.map(function (f) {
                return '<button class="btn ' + (nqFilter === f ? '' : 'ghost') + '" data-nqf="' + f + '">' +
                    f.charAt(0).toUpperCase() + f.slice(1) + '</button>';
            }).join('') +
            '<input id="nq-q" class="ctl grow" type="search" placeholder="SEARCH REF, CLIENT, TEXT…" value="' + esc(nqq) + '">' +
            '<button class="btn ghost" id="nq-refresh">Refresh</button>' +
          '</div>' +
          '<p class="count">' + rows.length + ' shown · scrape runs locally, re-run it in Claude Code to pull new requests</p>' +
          '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
            '<th>NTQ</th><th style="width:170px">Client</th><th style="width:90px">Source</th>' +
            '<th style="width:95px">Asked</th><th style="width:230px"></th>' +
          '</tr></thead><tbody>' +
          (rows.length ? rows.map(function (r, i) {
              var flag = r.confidence === 'needs-detail'
                  ? ' <span class="tag" style="background:#8a6d1a;color:#fff">needs detail</span>' : '';
              return '<tr>' +
                '<td><div class="tmono" style="white-space:pre-wrap" id="nq-t-' + i + '">' + esc(r.ntq_text) + '</div>' +
                    '<div class="tsub">' + esc(r.details || '') + flag + '</div></td>' +
                '<td><div class="tname">' + esc(r.contact || '—') + '</div>' +
                    '<div class="tsub tmono">' + esc(r.contact_handle || '') + '</div></td>' +
                '<td><span class="tmono">' + esc(r.source) + '</span></td>' +
                '<td><span class="tmono">' + esc(fmtDate(r.requested_at)) + '</span></td>' +
                '<td>' +
                    '<button class="btn" data-nq-copy="' + i + '">Copy</button> ' +
                    '<button class="btn ghost" data-nq-edit="' + i + '">Edit</button> ' +
                    (r.status === 'open'
                        ? '<button class="btn ghost" data-nq-status="quoted" data-nq-i="' + i + '">Quoted</button>'
                        : '<button class="btn ghost" data-nq-status="open" data-nq-i="' + i + '">Reopen</button>') + ' ' +
                    '<button class="btn ghost" data-nq-status="dead" data-nq-i="' + i + '">Dead</button>' +
                '</td>' +
              '</tr>';
          }).join('') : '<tr><td colspan="5" style="padding:28px 0"><span class="tmono">Nothing here. Re-run the scrape.</span></td></tr>') +
          '</tbody></table></div>';

        [].forEach.call(view.querySelectorAll('[data-nqf]'), function (b) {
            b.addEventListener('click', function () { nqFilter = this.dataset.nqf; paintNTQ(); });
        });
        var q2 = document.getElementById('nq-q');
        if (q2) q2.addEventListener('input', function () {
            nqq = this.value; var p = this.selectionStart; paintNTQ();
            var n = document.getElementById('nq-q');
            if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} }
        });
        var rf = document.getElementById('nq-refresh');
        if (rf) rf.addEventListener('click', function () {
            view.innerHTML = '<p class="count">Loading…</p>';
            renderNTQ().catch(function (e) { view.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
        });
        [].forEach.call(view.querySelectorAll('[data-nq-copy]'), function (b) {
            b.addEventListener('click', function () {
                var r = rows[Number(this.dataset.nqCopy)];
                var self = this;
                navigator.clipboard.writeText(r.ntq_text).then(function () {
                    self.textContent = 'Copied';
                    setTimeout(function () { self.textContent = 'Copy'; }, 1200);
                });
            });
        });
        [].forEach.call(view.querySelectorAll('[data-nq-edit]'), function (b) {
            b.addEventListener('click', function () {
                var r = rows[Number(this.dataset.nqEdit)];
                var next = prompt('NTQ text', r.ntq_text);
                if (next == null || !next.trim() || next === r.ntq_text) return;
                A.adminFetchTo('/api/leads-admin', 'ntq-save-text', { id: r.id, ntq_text: next.trim() })
                    .then(function () { r.ntq_text = next.trim(); r.confidence = 'exact'; paintNTQ(); })
                    .catch(function (e) { alert(e.message); });
            });
        });
        [].forEach.call(view.querySelectorAll('[data-nq-status]'), function (b) {
            b.addEventListener('click', function () {
                var r = rows[Number(this.dataset.nqI)];
                var status = this.dataset.nqStatus;
                A.adminFetchTo('/api/leads-admin', 'ntq-set-status', { id: r.id, status: status })
                    .then(function () {
                        r.status = status;
                        NQ.counters = null;
                        // Recount locally rather than refetching 5000 rows for a tap.
                        var by = function (s) { return NQ.rows.filter(function (x) { return x.status === s; }).length; };
                        NQ.counters = { open: by('open'), quoted: by('quoted'), sourced: by('sourced'), dead: by('dead'),
                            needs_detail: NQ.rows.filter(function (x) { return x.confidence === 'needs-detail' && x.status === 'open'; }).length };
                        paintNTQ();
                    })
                    .catch(function (e) { alert(e.message); });
            });
        });
    }

    // ══════════════════════════════════════════════════════════
    // RETAIL  — what the public is asked to pay
    // ══════════════════════════════════════════════════════════
    var rtq = '';
    var rtSource = '';

    // ══════════════════════════════════════════════════════════
    // BUYERS  — who is hunting what, and can Henry get one
    // ══════════════════════════════════════════════════════════
    var BY = { rows: [], counters: {} };
    var byq = '', byFilter = 'sourceable';

    async function renderBuyers() {
        var d = await A.adminFetchTo('/api/leads-admin', 'buyers');
        BY.rows = d.rows || []; BY.counters = d.counters || {};
        paintBuyers();
    }

    function byAfter(f, q) {
        var needle = (q || '').toLowerCase();
        return BY.rows.filter(function (r) {
            if (f === 'sourceable' && !r.can_source) return false;
            if (f === 'store' && !r.store_beats_group) return false;
            if (f === 'nosupply' && r.can_source) return false;
            if (needle) {
                var hay = [r.reference, r.brand, r.model, r.nickname].filter(Boolean).join(' ').toLowerCase();
                if (hay.indexOf(needle) < 0) return false;
            }
            return true;
        });
    }

    function byRow(r) {
        var piece = [r.brand, r.model].filter(Boolean).join(' ') || '—';
        var who = (r.wanters || []).map(function (w) {
            var ph = String(w.phone || '').replace(/\D/g, '');
            return '<div class="count" style="margin-top:3px">' +
                   (ph ? '<a href="https://wa.me/' + esc(ph) + '" target="_blank" rel="noopener">' +
                         esc(w.dealer || ph) + '</a>' : esc(w.dealer || 'unknown')) +
                   ' · ' + esc(w.kind) + ' · ' + esc(fmtAgo(w.at)) + '</div>';
        }).join('');

        // Where the cheapest one he can actually reach is sitting.
        var best = r.best_price == null ? '<span class="count">nobody selling</span>'
            : '<span class="tag ' + (r.best_source === 'STORE' ? 'warm' : 'hot') + '">' +
              esc(r.best_source === 'STORE' ? 'STORE' : 'GROUP') + '</span> ' + esc(money(r.best_price));

        return '<tr>' +
          '<td><div class="tname">' + esc(r.reference) + '</div>' +
              '<div class="count">' + esc(piece) + (r.nickname ? ' "' + esc(r.nickname) + '"' : '') + '</div></td>' +
          '<td><div class="tname">' + r.buyers + '</div>' +
              '<div class="count">' + r.posts + ' post' + (r.posts === 1 ? '' : 's') + '</div>' + who + '</td>' +
          '<td>' + best +
              (r.store_beats_group
                ? '<div class="count">store undercuts the groups, check it is the same watch</div>' : '') + '</td>' +
          '<td style="text-align:right">' + esc(money(r.market_median)) +
              '<div class="count">' + r.supply_n + ' in groups · ' + r.retail_n + ' in stores</div></td>' +
          '<td>' + esc(fmtAgo(r.last_want_at)) + '</td>' +
        '</tr>';
    }

    function paintBuyers() {
        var c = BY.counters;
        var TILES = [
            { k: 'sourceable', l: 'Can source' },
            { k: '',           l: 'All wanted' },
            { k: 'store',      l: 'Store cheaper' },
            { k: 'nosupply',   l: 'No supply yet' },
        ];
        var rows = byAfter(byFilter, byq);

        view.innerHTML =
          '<div class="tiles">' + TILES.map(function (t) {
              return '<button class="tile" data-by="' + t.k + '" aria-pressed="' + (byFilter === t.k) + '">' +
                '<span class="tk">' + esc(t.l) + '</span><span class="tv">' +
                byAfter(t.k, byq).length + '</span></button>';
          }).join('') + '</div>' +
          '<div class="bar"><input id="by-q" class="ctl grow" type="search" ' +
            'placeholder="SEARCH REFERENCE, BRAND, MODEL…" value="' + esc(byq) + '">' +
            '<button class="btn ghost" id="by-refresh">Refresh</button></div>' +
          '<p class="count">' + rows.length + ' of ' + BY.rows.length +
            ' references dealers have asked for in the last 30 days. Buyers post "please DM" ' +
            'rather than a price, so nothing here guesses what they would pay.</p>' +
          '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
            '<th style="width:170px">Wanted</th><th style="width:230px">Who wants it</th>' +
            '<th style="width:210px">Cheapest you can reach</th>' +
            '<th style="width:160px;text-align:right">Market</th><th style="width:90px">Last asked</th>' +
          '</tr></thead><tbody>' +
          (rows.length ? rows.map(byRow).join('')
            : '<tr><td colspan="5" class="count">Nothing here yet.</td></tr>') +
          '</tbody></table></div>';

        [].forEach.call(document.querySelectorAll('[data-by]'), function (b) {
            b.addEventListener('click', function () { byFilter = this.dataset.by; paintBuyers(); });
        });
        var q = document.getElementById('by-q');
        if (q) q.addEventListener('input', function () {
            byq = this.value; var p = this.selectionStart; paintBuyers();
            var n = document.getElementById('by-q');
            if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} }
        });
        var rf = document.getElementById('by-refresh');
        if (rf) rf.addEventListener('click', function () {
            view.innerHTML = '<p class="count">Refreshing…</p>';
            renderBuyers().catch(function (e) {
                view.innerHTML = '<p class="err">Could not refresh: ' + esc(e.message || e) + '</p>';
            });
        });
    }

    // ══════════════════════════════════════════════════════════
    // ACCURACY  — everything needed to tune the extractor
    // ══════════════════════════════════════════════════════════
    var AC = { flows: [], scorecard: [], coverage: [], samples: [] };
    var acOnly = '', acSort = 'recent', acOpen = null;

    async function renderAccuracy() {
        AC = await A.adminFetchTo('/api/leads-admin', 'accuracy', { only: acOnly, sort: acSort });
        paintAccuracy();
    }

    // Small inline SVG charts. No library, no external request, and they read
    // the same numbers as the tables underneath so the two cannot disagree.
    // Traffic light, used by every chart and status tag so the same colour
    // always means the same thing: green fine, amber worth a look, red bad.
    var OK_GREEN = '#1a7f37', WARN_AMBER = '#d97706', BAD_RED = '#c02626';
    function pctColor(p) {
        return p >= 85 ? OK_GREEN : p >= 60 ? WARN_AMBER : BAD_RED;
    }
    function failColor(p) {
        return p >= 50 ? BAD_RED : p >= 5 ? WARN_AMBER : OK_GREEN;
    }

    function svgBars(rows, opts) {
        opts = opts || {};
        if (!rows.length) return '<p class="count">no data</p>';
        var labW = opts.labW || 150, barW = opts.barW || 300, rh = 24;
        var H = rows.length * rh + 8, max = opts.max || Math.max.apply(null, rows.map(function (r) { return r.v; })) || 1;
        return '<svg viewBox="0 0 ' + (labW + barW + 70) + ' ' + H + '" width="100%" ' +
               'style="max-width:' + (labW + barW + 70) + 'px;overflow:visible" role="img">' +
          rows.map(function (r, i) {
              var y = i * rh + 4, w = Math.max(1, (r.v / max) * barW);
              return '<text x="0" y="' + (y + 12) + '" font-size="11" fill="var(--l2)">' +
                       esc(r.k.length > 22 ? r.k.slice(0, 21) + '…' : r.k) + '</text>' +
                     '<rect x="' + labW + '" y="' + y + '" width="' + w + '" height="14" rx="3" fill="' +
                       (r.c || OK_GREEN) + '"></rect>' +
                     '<text x="' + (labW + w + 6) + '" y="' + (y + 11) + '" font-size="11" fill="var(--l3)">' +
                       esc(r.t != null ? r.t : r.v) + '</text>';
          }).join('') + '</svg>';
    }

    // Trust spread across buckets: the shape of how good the reads are.
    function svgHistogram(samples) {
        var B = [[0, 49], [50, 69], [70, 84], [85, 99], [100, 100]];
        var LBL = ['0-49', '50-69', '70-84', '85-99', '100'];
        var COL = [BAD_RED, BAD_RED, WARN_AMBER, OK_GREEN, OK_GREEN];
        var counts = B.map(function (b) {
            return samples.filter(function (s) {
                return s.trust_score != null && s.trust_score >= b[0] && s.trust_score <= b[1];
            }).length;
        });
        var max = Math.max.apply(null, counts) || 1;
        var W = 440, H = 130, bw = W / B.length;
        return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:' + W + 'px" role="img">' +
          counts.map(function (n, i) {
              var h = Math.round((n / max) * (H - 34)), x = i * bw + 10, y = H - 22 - h;
              return '<rect x="' + x + '" y="' + y + '" width="' + (bw - 20) + '" height="' + Math.max(h, 1) +
                     '" rx="3" fill="' + COL[i] + '"></rect>' +
                     '<text x="' + (x + (bw - 20) / 2) + '" y="' + (y - 4) + '" font-size="11" ' +
                       'text-anchor="middle" fill="var(--l2)">' + n + '</text>' +
                     '<text x="' + (x + (bw - 20) / 2) + '" y="' + (H - 6) + '" font-size="10" ' +
                       'text-anchor="middle" fill="var(--l3)">' + LBL[i] + '</text>';
          }).join('') + '</svg>';
    }

    function acSample(s) {
        var out = [
            ['Reference', s.reference], ['Price', s.price_usd ? money(s.price_usd) : null],
            ['Brand', s.brand], ['Model', s.model], ['Year', s.year],
            ['Condition', s.condition], ['Contents', s.set_completeness],
            ['Dial', [s.dial_color, s.dial_material].filter(Boolean).join(' ')],
            ['Case', s.case_material], ['Bracelet', s.bracelet], ['Nickname', s.nickname],
        ].filter(function (r) { return r[1]; })
         .map(function (r) { return '<div><div class="dk">' + r[0] + '</div><div class="dv">' +
                esc(String(r[1]).replace(/_/g, ' ')) + '</div></div>'; }).join('');

        var vis = (s.vision_brand || s.vision_model || s.vision_reference)
            ? '<p class="count" style="margin-top:8px">Photo read as: ' +
              esc([s.vision_brand, s.vision_model, s.vision_reference].filter(Boolean).join(' ')) +
              (s.vision_mismatch ? ' — disagrees with the caption' : '') + '</p>' : '';

        return '<tr class="ac-detail"><td colspan="7">' +
          '<p class="count">What the dealer actually wrote</p>' +
          '<pre style="white-space:pre-wrap;font-size:12px;margin:6px 0 12px;opacity:.85">' +
            esc(s.source_text || '(no caption, photo only)') + '</pre>' +
          '<p class="count">What the model returned</p>' +
          '<div class="dgrid" style="margin-top:6px">' + (out || '<div class="count">nothing</div>') + '</div>' +
          vis +
          '<p class="count" style="margin-top:10px">' +
            'self-rated ' + esc(s.self_confidence == null ? '—' : s.self_confidence + '%') +
            ' · measured ' + esc(s.trust_score == null ? '—' : s.trust_score) +
            (s.trust_why && s.trust_why.length ? ' (' + esc(s.trust_why.join(', ')) + ')' : '') +
            ' · ' + esc(s.run_model) +
            (s.latency_ms ? ' · ' + Math.round(s.latency_ms / 100) / 10 + 's' : '') +
            (s.tokens_in ? ' · ' + s.tokens_in + ' in / ' + s.tokens_out + ' out' : '') +
            (s.corrected_fields && s.corrected_fields.length
              ? ' · you fixed: ' + esc(s.corrected_fields.join(', ')) : '') +
          '</p></td></tr>';
    }

    function paintAccuracy() {
        var FILTERS = [
            { k: '',          l: 'Recent' },
            { k: 'weak',      l: 'Weak reads' },
            { k: 'mismatch',  l: 'Photo ≠ text' },
            { k: 'noref',     l: 'No reference' },
            { k: 'noprice',   l: 'No price' },
            { k: 'corrected', l: 'You corrected' },
        ];

        // Charts first, tables underneath. Same numbers, two ways of reading.
        var flows = (AC.flows || []).filter(function (f) { return f.runs > 0; });
        // One row per field, pooled across models. Listing it per model put a
        // second copy of every field at 0% next to the real number.
        var cov = (AC.coverage || []).filter(function (c) { return c.run_model === 'ALL'; })
                    .sort(function (a, b) { return a.pct - b.pct; });
        var sc = AC.scorecard || [];

        view.innerHTML =
          '<div class="row" style="gap:26px;flex-wrap:wrap;align-items:flex-start;margin-bottom:8px">' +

            '<div style="flex:1;min-width:300px">' +
              '<p class="count">Failure rate by flow, last hour · a fault fixed earlier today ' +
              'still sits in the 24h column, so this ranks on what is happening now</p>' +
              svgBars(flows.map(function (f) {
                  var pct = f.failure_pct_1h == null ? 0 : Number(f.failure_pct_1h);
                  return { k: f.workflow_name, v: pct,
                           t: (f.runs_1h ? pct + '% of ' + Number(f.runs_1h).toLocaleString() + ' this hour'
                                         : 'idle this hour'),
                           c: failColor(pct) };
              }), { max: 100, labW: 160, barW: 200 }) +
            '</div>' +

            '<div style="flex:1;min-width:300px">' +
              '<p class="count">Field coverage, worst first · what to fix in the prompt</p>' +
              svgBars(cov.slice(0, 12).map(function (c) {
                  return { k: c.field, v: Number(c.pct), t: c.pct + '%',
                           c: pctColor(Number(c.pct)) };
              }), { max: 100, labW: 130, barW: 200 }) +
            '</div>' +

            '<div style="flex:1;min-width:280px">' +
              '<p class="count">Trust spread across the reads shown below</p>' +
              svgHistogram(AC.samples || []) +
              '<p class="count">A healthy shape leans right. Anything left of 70 could not be ' +
              'backed up against the dealer\'s own message.</p>' +
            '</div>' +

            (sc.length ? '<div style="flex:1;min-width:300px">' +
              '<p class="count">Model comparison · share of reads that came out solid</p>' +
              svgBars(sc.map(function (m) {
                  return { k: String(m.model).split('/').pop(), v: Number(m.pct_solid),
                           t: m.pct_solid + '% solid of ' + Number(m.listings).toLocaleString(),
                           c: pctColor(Number(m.pct_solid)) };
              }), { max: 100, labW: 140, barW: 190 }) +
            '</div>' : '') +

          '</div>' +

          // n8n's own numbers, collected every 15 minutes.
          '<p class="count">Flow runs, last 24 hours · collected from n8n every 15 minutes</p>' +
          '<div class="tbl-wrap" style="margin-bottom:20px"><table class="leads"><thead><tr>' +
            '<th style="width:90px">State</th><th>Flow</th>' +
            '<th style="width:150px">Last hour</th><th style="width:150px">Last 24h</th>' +
            '<th style="width:110px">Last run</th>' +
          '</tr></thead><tbody>' +
          (AC.flows || []).map(function (f) {
              // HEALED matters: a flow fixed at lunchtime still carries its
              // failures in the daily figure and would otherwise read as broken.
              var cls = (f.status === 'OK' || f.status === 'HEALED') ? 'hot'
                      : (f.status === 'IDLE' || f.status === 'FLAKY') ? 'warm' : 'spam';
              return '<tr>' +
                '<td><span class="tag ' + cls + '">' + esc(f.status) + '</span></td>' +
                '<td>' + esc(f.workflow_name) + (f.active === false
                    ? ' <span class="count">(off)</span>' : '') + '</td>' +
                '<td>' + (f.runs_1h ? Number(f.runs_1h).toLocaleString() + ' runs' +
                            '<div class="count">' + Number(f.errors_1h).toLocaleString() +
                            ' failed · ' + esc(f.failure_pct_1h) + '%</div>'
                          : '<span class="count">idle</span>') + '</td>' +
                '<td>' + Number(f.runs).toLocaleString() + ' runs' +
                    '<div class="count">' + Number(f.errors).toLocaleString() +
                    ' failed · ' + esc(f.failure_pct) + '%</div></td>' +
                '<td>' + esc(fmtAgo(f.last_run_at)) + '</td>' +
              '</tr>';
          }).join('') +
          '</tbody></table></div>' +

          '<p class="count">Model scorecard · graded against the original message, not the ' +
          'model\'s own confidence</p>' +
          '<div class="tbl-wrap" style="margin-bottom:20px"><table class="leads"><thead><tr>' +
            '<th>Model</th><th style="width:80px">Read</th><th style="width:80px">Trust</th>' +
            '<th style="width:80px">Solid</th><th style="width:80px">Weak</th>' +
            '<th style="width:80px">Ref</th><th style="width:80px">Price</th>' +
            '<th style="width:90px">Mismatch</th><th style="width:90px">Corrected</th>' +
            '<th style="width:80px">Speed</th><th style="width:110px">Tokens</th>' +
          '</tr></thead><tbody>' +
          (AC.scorecard || []).map(function (m) {
              var tcls = m.avg_trust >= 90 ? 'hot' : m.avg_trust >= 80 ? 'warm' : 'spam';
              return '<tr>' +
                '<td>' + esc(m.model) + (m.fixed_fields
                    ? '<div class="count">fixed: ' + esc(m.fixed_fields) + '</div>' : '') + '</td>' +
                '<td>' + Number(m.listings).toLocaleString() + '</td>' +
                '<td><span class="tag ' + tcls + '">' + esc(m.avg_trust) + '</span></td>' +
                '<td>' + esc(m.pct_solid) + '%</td><td>' + esc(m.pct_weak) + '%</td>' +
                '<td>' + esc(m.pct_reference) + '%</td><td>' + esc(m.pct_price) + '%</td>' +
                '<td>' + esc(m.pct_mismatch) + '%</td><td>' + esc(m.pct_corrected) + '%</td>' +
                '<td>' + (m.avg_ms ? Math.round(m.avg_ms / 1000) + 's' : '—') + '</td>' +
                '<td>' + (m.avg_tokens_in ? m.avg_tokens_in + ' / ' + m.avg_tokens_out : '—') + '</td>' +
              '</tr>';
          }).join('') +
          '</tbody></table></div>' +

          // Where the extractor is thin, worst first. This is the list that
          // tells you what to change in the prompt.
          '<p class="count">Field coverage · how often each field comes back filled, worst first</p>' +
          '<div class="tbl-wrap" style="margin-bottom:20px"><table class="leads"><thead><tr>' +
            '<th style="width:200px">Field</th>' +
            '<th style="width:140px">Filled</th><th>Rate</th>' +
          '</tr></thead><tbody>' +
          cov.map(function (c) {
              var w = Math.max(0, Math.min(100, Number(c.pct)));
              return '<tr>' +
                '<td>' + esc(c.field) + '</td>' +
                '<td>' + c.filled + ' / ' + c.listings + '</td>' +
                '<td><div style="background:var(--line);height:8px;border-radius:4px;overflow:hidden">' +
                  '<div style="width:' + w + '%;height:8px;background:' +
                  pctColor(w) + '"></div></div>' +
                  '<div class="count">' + esc(c.pct) + '%</div></td>' +
              '</tr>';
          }).join('') +
          '</tbody></table></div>' +

          // Where the two lead classifiers disagreed. This decides whether a
          // person gets answered at all, so a split is worth a look.
          ((AC.leadDisputes || []).length
            ? '<p class="count" style="margin-top:22px">Leads the two classifiers read ' +
                'differently · the safer reading was kept, but these are worth an eye</p>' +
              '<div class="tbl-wrap" style="margin-bottom:20px"><table class="leads"><thead><tr>' +
                '<th style="width:170px">Name</th><th style="width:110px">First read</th>' +
                '<th style="width:110px">Second read</th><th>What they wrote</th>' +
              '</tr></thead><tbody>' +
              AC.leadDisputes.map(function (r) {
                  return '<tr>' +
                    '<td>' + esc(r.full_name || '') + '</td>' +

          // Held back from matching: both photo models independently read the

          ((AC.disputes || []).length

                'both photo models disagree with the dealer on metal or diamonds, ' +

                '<th style="width:190px">Piece</th><th style="width:110px">Price</th>' +
                '<th style="width:150px">Dealer says</th><th style="width:150px">Photo shows</th>' +
                '<th>Why it is held</th></tr></thead><tbody>' +
              AC.disputes.map(function (d) {
                  var why = (d.photo_conflicts || []).filter(function (c) {
                      return /^(metal|diamonds)/.test(c);
