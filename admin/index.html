    }

    // Tiles double as one-click filters — the fastest way to answer
    // "who do I call next" without touching a dropdown.
    var TILES = [
        { k: '',            l: 'All' },
        { k: 'new',         l: 'New' },
        { k: 'HOT',         l: 'Hot' },
        { k: 'WARM',        l: 'Warm' },
        { k: 'COLD',        l: 'Cold' },
        { k: 'REAL',        l: 'Real' },
        { k: 'JUNK',        l: 'Spam/Test' },
    ];

    function tileCount(k) {
        return leadsAfter(k, lfilter.status, lfilter.days, lq).length;
    }

    function matchTile(l, k) {
        if (!k) return true;
        if (k === 'new') return !l.status || l.status === 'new';
        if (k === 'REAL') return l.lead_class === 'REAL';
        if (k === 'JUNK') return l.lead_class === 'SPAM' || l.lead_class === 'TEST';
        // quality tiles only mean anything on real leads
        return l.lead_class === 'REAL' && l.lead_quality === k;
    }

    // Leads means people asking us to source a watch.
    var SOURCING_TYPES = ['BUY', 'WATCH_DETAIL', 'SELL', 'TRADE'];

    function isSourcing(l) {
        var t = l.submission_type;
        // unknown/blank types are treated as sourcing so nothing goes missing
        return !t || SOURCING_TYPES.indexOf(t) >= 0;
    }

    function leadsAfter(tile, status, days, q) {
        var cutoff = days ? Date.now() - (+days * 864e5) : 0;
        var needle = (q || '').toLowerCase();
        return LEADS.filter(function (l) {
            if (lfilter.type) { if (l.submission_type !== lfilter.type) return false; }
            else if (!isSourcing(l)) return false;
            if (!matchTile(l, tile)) return false;
            if (status && (l.status || 'new') !== status) return false;
            if (cutoff && new Date(l.created_at).getTime() < cutoff) return false;
            if (needle && JSON.stringify(l).toLowerCase().indexOf(needle) < 0) return false;
            return true;
        });
    }

    var COLS = [
        { k: 'created_at',      l: 'Date',    w: '96px' },
        { k: 'full_name',       l: 'Name' },
        { k: 'submission_type', l: 'Type',    w: '110px' },
        { k: 'watch',           l: 'Watch' },
        { k: 'lead_quality',    l: 'Quality', w: '80px' },
        { k: 'lead_class',      l: 'Class',   w: '78px' },
        { k: 'status',          l: 'Status',  w: '124px' },
    ];

    function cell(l, k) {
        if (k === 'watch') return l.watch_details || l.watch_interest || '';
        if (k === 'created_at') return l.created_at || '';
        return l[k] || '';
    }

    function sortLeads(list) {
        var k = lsort;
        return list.slice().sort(function (a, b) {
            var av = cell(a, k), bv = cell(b, k);
            if (k === 'created_at') {
                return (new Date(av).getTime() - new Date(bv).getTime()) * ldir;
            }
            // quality sorts by real urgency, not alphabetically
            if (k === 'lead_quality') {
                var R = { HOT: 3, WARM: 2, COLD: 1, '': 0 };
                return ((R[av] || 0) - (R[bv] || 0)) * ldir;
            }
            return String(av).localeCompare(String(bv)) * ldir;
        });
    }

    function fmtDate(d) {
        if (!d) return '—';
        var t = new Date(d), now = new Date();
        var days = Math.floor((now - t) / 864e5);
        if (days === 0) return 'Today';
        if (days === 1) return 'Yesterday';
        if (days < 7) return days + 'd ago';
        return t.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: t.getFullYear() === now.getFullYear() ? undefined : '2-digit' });
    }

    function paintLeads() {
        var list = sortLeads(leadsAfter(lfilter.tile, lfilter.status, lfilter.days, lq));

        var html =
            '<div class="tiles">' + TILES.map(function (t) {
                var n = leadsAfter(t.k, lfilter.status, lfilter.days, lq).length;
                return '<button class="tile" data-tile="' + t.k + '" aria-pressed="' + (lfilter.tile === t.k) + '">' +
                    '<span class="tk">' + esc(t.l) + '</span><span class="tv">' + n + '</span></button>';
            }).join('') + '</div>' +

            '<div class="bar">' +
              '<input id="l-q" class="ctl grow" type="search" placeholder="SEARCH NAME, EMAIL, PHONE, WATCH…" value="' + esc(lq) + '">' +
              '<select id="l-days" class="ctl">' +
                [['', 'ALL TIME'], ['7', 'LAST 7 DAYS'], ['30', 'LAST 30 DAYS'], ['90', 'LAST 90 DAYS']].map(function (o) {
                    return '<option value="' + o[0] + '"' + (lfilter.days === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
                }).join('') +
              '</select>' +
              '<select id="l-type" class="ctl">' +
                '<option value=""' + (lfilter.type ? '' : ' selected') + '>SOURCING REQUESTS</option>' +
                '<option value="BUY"' + (lfilter.type === 'BUY' ? ' selected' : '') + '>BUY ONLY</option>' +
                '<option value="WATCH_DETAIL"' + (lfilter.type === 'WATCH_DETAIL' ? ' selected' : '') + '>WATCH ENQUIRY ONLY</option>' +
              '</select>' +
              '<select id="l-status" class="ctl">' +
                '<option value=""' + (lfilter.status ? '' : ' selected') + '>ANY STATUS</option>' +
                STATUSES.map(function (v) {
                    return '<option value="' + v + '"' + (lfilter.status === v ? ' selected' : '') + '>' + v.toUpperCase() + '</option>';
                }).join('') +
              '</select>' +
              '<button class="btn ghost" id="l-csv">Export</button>' +
              '<button class="btn ghost" id="l-refresh">Refresh</button>' +
            '</div>' +

            '<p class="count">' + list.length + ' of ' + LEADS.filter(isSourcing).length + ' lead' + (LEADS.length === 1 ? '' : 's') +
              ' · sorted by ' + esc(COLS.filter(function (c) { return c.k === lsort; })[0].l.toLowerCase()) +
              (ldir < 0 ? ' (newest first)' : ' (oldest first)') + '</p>' +

            '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
              COLS.map(function (c) {
                  var on = lsort === c.k;
                  return '<th class="s' + (on ? ' on' : '') + '" data-sort="' + c.k + '"' +
                      (c.w ? ' style="width:' + c.w + '"' : '') + '>' + esc(c.l) +
                      '<span class="ar">' + (on ? (ldir < 0 ? '↓' : '↑') : '↕') + '</span></th>';
              }).join('') +
            '</tr></thead><tbody>' +
              (list.length ? list.map(leadRow).join('')
                           : '<tr><td colspan="7" style="padding:28px 0"><span class="tmono">No leads match those filters.</span></td></tr>') +
            '</tbody></table></div>';

        view.innerHTML = html;
        wireLeads();
    }

    // Red means someone is waiting on Henry. Amber means it is his move soon.
    // Green means the client came back, which is the only good kind of waiting.
    function stageColor(stage) {
        if (stage === 'NEEDS FOLLOW UP') return BAD_RED;
        if (stage === 'NOT CONTACTED')   return BAD_RED;
        if (stage === 'THEY REPLIED')    return OK_GREEN;
        if (stage === 'IN PROGRESS')     return OK_GREEN;
        return WARN_AMBER;                              // WAITING
    }

    function leadRow(l) {
        var q = l.lead_quality || '';
        var c = l.lead_class || '';
        var watch = l.watch_details || l.watch_interest || '';
        var open = lopen === l.id;

        var main = '<tr data-id="' + esc(l.id) + '">' +
            '<td><span class="tmono">' + esc(fmtDate(l.created_at)) + '</span></td>' +
            '<td><div class="tname">' + esc(l.full_name || '—') + '</div>' +
                '<div class="tsub">' + esc(l.email || l.phone || '') + '</div></td>' +
            '<td><span class="tmono">' + esc(l.submission_type || '—') + '</span>' +
                (l.source_label ? '<div class="count">' + esc(l.source_label) + '</div>' : '') +
                (l.preferred_channel ? '<div class="count">prefers ' + esc(String(l.preferred_channel).trim()) + '</div>' : '') + '</td>' +
            '<td>' + (watch ? esc(watch.length > 60 ? watch.slice(0, 60) + '…' : watch) : '<span class="tmono">—</span>') + '</td>' +
            '<td>' + (q ? '<span class="tag ' + q.toLowerCase() + '">' + esc(q) + '</span>' : '<span class="tmono">—</span>') + '</td>' +
            '<td>' + (c ? '<span class="tag ' + c.toLowerCase() + '">' + esc(c) + '</span>' : '<span class="tmono">—</span>') +
                (l.stage ? '<div style="margin-top:4px"><span class="tag" style="background:' +
                    stageColor(l.stage) + ';color:#fff;border-color:transparent">' +
                    esc(l.stage) + '</span></div>' : '') + '</td>' +
            '<td><select class="stat" data-status-for="' + esc(l.id) + '">' +
                STATUSES.map(function (v) {
                    return '<option value="' + v + '"' + ((l.status || 'new') === v ? ' selected' : '') + '>' + v.toUpperCase() + '</option>';
                }).join('') +
            '</select></td>' +
        '</tr>';

        if (!open) return main;

        var D = [
            ['Stage', l.stage],
            ['Last reached out', l.last_sent ? fmtAgo(l.last_sent) : 'never'],
            ['They replied', l.client_replied_at ? fmtAgo(l.client_replied_at) : 'not yet'],
            ['Came in via', l.source_label], ['Email', l.email], ['Phone', l.phone],
            ['Budget', l.budget], ['Type', l.submission_type], ['Watch', watch],
            ['Confidence', l.lead_confidence], ['Reason', l.lead_reason],
            ['Message', l.message || l.notes],
            ['Submitted', l.created_at ? new Date(l.created_at).toLocaleString() : ''],
        ].filter(function (d) { return d[1]; });

        // Reply from here rather than hunting for the conversation. WhatsApp
        // leads open the actual thread; the rest open a prefilled message.
        var ph = String(l.phone || '').replace(/\D/g, '');
        var drafts = l.drafts || [];
        var sms   = drafts.filter(function (d) { return d.channel === 'SMS'; })[0];
        var email = drafts.filter(function (d) { return d.channel === 'EMAIL'; })[0];
        var subj  = 'Re: your ' + (l.watch_name || 'watch') + ' enquiry';

        // Reach them the way they asked to be reached. Ten of these leads asked
        // for iMessage, which is a different app from WhatsApp, so leading with
        // the wrong one is how a lead gets answered late or not at all.
        var pref = String(l.preferred_channel || '').trim().toUpperCase();
        var acts = [];
        function act(key, html) { acts.push({ key: key, html: html }); }

        if (ph) act('WHATSAPP', '<a class="btn ghost" href="https://wa.me/' + esc(ph) +
            (sms ? '?text=' + encodeURIComponent(sms.body) : '') +
            '" target="_blank" rel="noopener">' +
            (l.source === 'WHATSAPP' ? 'Open the WhatsApp thread' : 'WhatsApp') + '</a>');
        if (ph) act('IMESSAGE', '<a class="btn ghost" href="sms:' + esc(ph) +
            (sms ? '&body=' + encodeURIComponent(sms.body) : '') + '">iMessage / text</a>');
        // Straight to the real thread in Gmail, so "have I already replied" is
        // one click rather than a hunt.
        if (l.email) acts.push({ key: 'GMAIL',
            html: '<a class="btn ghost" href="https://mail.google.com/mail/u/0/#search/' +
                  encodeURIComponent(l.email) + '" target="_blank" rel="noopener">Find in Gmail</a>' });
        if (l.email) act('EMAIL', '<a class="btn ghost" href="mailto:' + esc(l.email) +
            '?subject=' + encodeURIComponent(subj) +
            (email ? '&body=' + encodeURIComponent(email.body) : '') + '">Email</a>');

        // Their stated preference first.
        acts.sort(function (a, b) {
            return (b.key === pref ? 1 : 0) - (a.key === pref ? 1 : 0);
        });
        acts = acts.map(function (a) {
            return a.key === pref
                ? a.html.replace('btn ghost', 'btn') + '<span class="count"> asked for this</span>'
                : a.html;
        });

        // Logging outreach that happened on his phone, so the lead stops looking
        // untouched and the follow-up clock starts from roughly the right time.
        var already = '<div class="row" style="gap:6px;margin-top:10px;align-items:center">' +
          '<span class="count">Already messaged them?</span>' +
          '<select class="ctl js-log-ch" style="font-size:11px;padding:4px 6px">' +
            ['IMESSAGE','WHATSAPP','EMAIL','CALL','INSTAGRAM'].map(function (c) {
                return '<option value="' + c + '"' + (c === (pref || 'IMESSAGE') ? ' selected' : '') + '>' +
                       (c === 'IMESSAGE' ? 'iMessage' : c.charAt(0) + c.slice(1).toLowerCase()) + '</option>';
            }).join('') + '</select>' +
          '<select class="ctl js-log-when" style="font-size:11px;padding:4px 6px">' +
            '<option value="0">just now</option><option value="6">earlier today</option>' +
            '<option value="24">yesterday</option><option value="48">2 days ago</option>' +
            '<option value="96">4+ days ago</option></select>' +
          '<button class="btn ghost js-log" data-lead="' + esc(l.id) + '">Log it</button>' +
        '</div>';

        // The written reply, ready to read before sending. Nothing auto-sends.
        var draftHtml = drafts.length
            ? '<p class="count" style="margin-top:14px">Drafted reply, nothing is sent until you send it</p>' +
              drafts.map(function (d) {
                  var sent = !!d.sent_at;
                  return '<div class="scard" style="margin-top:8px">' +
                    '<div class="count">' +
                      (d.kind && d.kind !== 'FIRST' ? 'FOLLOW-UP · ' : '') + esc(d.channel) +
                      (d.quoted_price ? ' · quoting ' + esc(money(d.quoted_price)) : '') +
                      (d.reference ? ' · ' + esc(d.reference) : '') +
                      (sent ? ' · sent ' + esc(fmtAgo(d.sent_at)) : '') + '</div>' +
                    // Editable before sending. The wording Henry actually uses is
                    // the only reliable guide to his voice, and it was being
                    // thrown away: every draft was recorded as sent verbatim, so
                    // the style examples fed back the model's own text forever.
                    (sent
                      ? '<pre style="white-space:pre-wrap;font-size:12px;margin:6px 0 0">' +
                          esc(d.sent_body || d.body || '') + '</pre>'
                      : '<textarea class="js-draft-body" data-draft="' + esc(d.id) + '" ' +
                          'style="width:100%;min-height:132px;margin:6px 0 0;font:inherit;' +
                          'font-size:12px;line-height:1.5;padding:8px;background:transparent;' +
                          'color:inherit;border:1px solid var(--line);border-radius:6px;' +
                          'white-space:pre-wrap;resize:vertical">' + esc(d.body || '') + '</textarea>') +
                    // Marking it sent is what starts the follow-up clock, so it
                    // has to be one click at the moment of sending.
                    (sent ? ''
                          : '<button class="btn ghost js-sent" data-draft="' + esc(d.id) +
                            '" style="margin-top:8px">I sent this</button>' +
                            '<span class="count js-edited" data-draft="' + esc(d.id) + '" ' +
                            'style="margin-left:10px"></span>') +
                  '</div>';
              }).join('')
            : '<p class="count" style="margin-top:14px">No reply drafted yet.</p>';

        return main + '<tr class="detail"><td colspan="7"><div class="dgrid">' +
            D.map(function (d) {
                return '<div><div class="dk">' + esc(d[0]) + '</div><div class="dv">' + esc(d[1]) + '</div></div>';
            }).join('') +
        '</div>' +
        (acts.length ? '<div class="row" style="gap:8px;margin-top:12px">' + acts.join('') + '</div>' : '') +
        already +
        draftHtml +
        '</td></tr>';
    }

    function wireLeads() {
        [].forEach.call(view.querySelectorAll('.tile'), function (b) {
            b.addEventListener('click', function () {
                lfilter.tile = b.dataset.tile; paintLeads();
            });
        });
        [].forEach.call(view.querySelectorAll('th.s'), function (th) {
            th.addEventListener('click', function () {
                var k = th.dataset.sort;
                // same column flips direction; a new column starts descending,
                // which is what you want for dates and quality
                if (lsort === k) ldir = -ldir; else { lsort = k; ldir = -1; }
                paintLeads();
            });
        });
        [].forEach.call(view.querySelectorAll('tbody tr[data-id]'), function (tr) {
            tr.addEventListener('click', function (e) {
                if (e.target.closest('select')) return;   // status control is not a row click
                lopen = lopen === tr.dataset.id ? null : tr.dataset.id;
                paintLeads();
            });
        });
        [].forEach.call(view.querySelectorAll('.js-log'), function (b) {
            b.addEventListener('click', async function (e) {
                e.stopPropagation();
                var btn = this;
                var row = btn.closest('.row');
                var ch = row.querySelector('.js-log-ch').value;
                var hrs = row.querySelector('.js-log-when').value;
                btn.disabled = true; btn.textContent = 'Saving…';
                try {
                    await A.adminFetchTo('/api/leads-admin', 'log-outreach', {
                        submission_id: btn.dataset.lead, channel: ch, hours_ago: Number(hrs),
                    });
                    renderLeads().catch(function (err) {
                        view.innerHTML = '<p class="err">' + esc(err.message || err) + '</p>';
                    });
                } catch (err) {
                    btn.disabled = false; btn.textContent = 'Log it';
                    alert('Could not save: ' + err.message);
                }
            });
        });

        [].forEach.call(view.querySelectorAll('.js-sent'), function (b) {
            b.addEventListener('click', async function (e) {
                e.stopPropagation();                       // not a row toggle
                var btn = this;
                btn.disabled = true; btn.textContent = 'Saving…';
                try {
                    // Send whatever is in the box, which may be Henry's rewrite.
                    var box = view.querySelector('.js-draft-body[data-draft="' + btn.dataset.draft + '"]');
                    await A.adminFetchTo('/api/leads-admin', 'mark-draft-sent',
                        { draft_id: Number(btn.dataset.draft),
                          sent_body: box ? box.value : undefined });
                    renderLeads().catch(function (err) {
                        view.innerHTML = '<p class="err">' + esc(err.message || err) + '</p>';
                    });
                } catch (err) {
                    btn.disabled = false; btn.textContent = 'I sent this';
                    alert('Could not save: ' + err.message);
                }
            });
        });

        [].forEach.call(view.querySelectorAll('[data-status-for]'), function (sel) {
            sel.addEventListener('change', async function () {
                var id = sel.dataset.statusFor, val = sel.value;
                sel.disabled = true;
                try {
                    await A.adminFetchTo('/api/leads-admin', 'set-status', { id: id, status: val });
                    var l = LEADS.filter(function (x) { return x.id === id; })[0];
                    if (l) l.status = val;
                } catch (err) {
                    alert('Could not update status: ' + err.message);
                }
                sel.disabled = false;
                paintLeads();
            });
        });

        var q = document.getElementById('l-q');
        q.addEventListener('input', function () {
            lq = this.value;
            var pos = this.selectionStart;
            paintLeads();
            var n = document.getElementById('l-q');
            n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {}
        });
        document.getElementById('l-days').addEventListener('change', function () {
            lfilter.days = this.value; paintLeads();
        });
        document.getElementById('l-type').addEventListener('change', function () {
            lfilter.type = this.value; paintLeads();
        });
        document.getElementById('l-status').addEventListener('change', function () {
            lfilter.status = this.value; paintLeads();
        });
        document.getElementById('l-refresh').addEventListener('click', function () {
            view.innerHTML = '<p class="count">Refreshing…</p>';
            renderLeads().catch(function (e) {
                view.innerHTML = '<p class="err">Could not refresh: ' + esc(e.message || e) + '</p>';
            });
        });
        document.getElementById('l-csv').addEventListener('click', exportLeads);
    }

    function exportLeads() {
        var list = sortLeads(leadsAfter(lfilter.tile, lfilter.status, lfilter.days, lq));
        var cols = ['created_at', 'full_name', 'email', 'phone', 'submission_type', 'watch_details', 'budget', 'lead_class', 'lead_quality', 'lead_confidence', 'status'];
        var csv = [cols.join(',')].concat(list.map(function (l) {
            return cols.map(function (k) {
                return '"' + String(l[k] == null ? '' : l[k]).replace(/"/g, '""') + '"';
            }).join(',');
        })).join('\n');
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = 'dialed-leads.csv';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    // ══════════════════════════════════════════════════════════
    // WHOLESALE  — the price index scraped out of the dealer groups
    // ══════════════════════════════════════════════════════════
    var WS = { listings: [], stats: [], variants: [], alerts: [], names: {}, counters: {}, loadedAt: null };
    // Density and view are stable preferences, not per-visit choices.
    var wDense = false, wView = 'table';
    try {
        wDense = !!localStorage.getItem('w-dense');
        wView = localStorage.getItem('w-view') === 'cards' ? 'cards' : 'table';
    } catch (e) {}
    var wq = '';
    var wfilter = { tile: '', brand: '', group: '', days: '' };
    var wsort = 'message_ts';
    var wdir = -1;
    var wopen = null;

    var wsTimer = null;

    async function renderWholesale() {
        // The window and the search now happen in the database, because the feed
        // outgrew what one response can carry: over 6,000 listings and climbing
        // by about 5,000 a day.
        var r = await A.adminFetchTo('/api/leads-admin', 'wholesale',
            { days: wfilter.days || 1, q: wq || '' });
        // An ingest outage empties the default 1-day window, which reads as
        // "everything is gone". Widen automatically until something shows,
        // and say so, rather than presenting a blank page.
        WS.fallbackDays = null;
        if (!(r.listings || []).length && !wq) {
            var tries = [7, 30, 90];
            for (var fi = 0; fi < tries.length; fi++) {
                if (Number(wfilter.days || 1) >= tries[fi]) continue;
                var rf = await A.adminFetchTo('/api/leads-admin', 'wholesale',
                    { days: tries[fi], q: '' });
                if ((rf.listings || []).length) { r = rf; WS.fallbackDays = tries[fi]; break; }
            }
        }
        WS.listings = r.listings || [];
        WS.stats    = r.stats || [];
        WS.variants = r.variants || [];
        WS.alerts   = r.alerts || [];
        WS.names    = r.nameByJid || {};
        WS.counters = r.counters || {};
        WS.held     = r.listings_held;
        WS.windowDays = r.window_days;
        WS.searched = r.searched;
        WS.capped   = r.listings_capped;
        WS.loadedAt = new Date().toISOString();
        paintWholesale();
        startWholesaleAuto();
    }

    // The groups post continuously and the ingest runs every minute, so a tab
    // left open goes stale within minutes. Poll on the same cadence, and stop
    // the moment another tab is showing so it is not fetching in the background.
    function startWholesaleAuto() {
        if (wsTimer) clearInterval(wsTimer);
        wsTimer = setInterval(function () {
            var onTab = document.querySelector('#tabs button[data-tab="wholesale"][aria-selected="true"]');
            if (!onTab) { clearInterval(wsTimer); wsTimer = null; return; }
            if (document.hidden) return;              // don't poll a background tab
            // Card mode: a repaint reloads every image and closes whatever the
            // user flipped open, so the auto-poll stands down there. Refresh is
            // one click away and switching back to table resumes it.
            if (wView === 'cards') return;
            // Respect an active empty-window fallback, or the poll would
            // overwrite the widened view with the same empty result.
            A.adminFetchTo('/api/leads-admin', 'wholesale',
                { days: WS.fallbackDays || wfilter.days || 1 }).then(function (r) {
                WS.listings = r.listings || [];
                WS.stats    = r.stats || [];
                WS.variants = r.variants || [];
                WS.alerts   = r.alerts || [];
                WS.names    = r.nameByJid || {};
                WS.counters = r.counters || {};
                WS.loadedAt = new Date().toISOString();
                paintWholesale();
            }).catch(function () { /* a failed poll must not break the view */ });
        }, 60000);
    }

    // Demand (WTB/NTQ/ISO) and parts are filtered out server-side now: demand
    // belongs to Buyers/Matches, parts to the Parts tab. This feed is supply.
    var WTILES = [
        { k: '',         l: 'For sale' },
        { k: 'deals',    l: 'Under market' },
        { k: 'priced',   l: 'Priced' },
        { k: 'diamonds', l: 'Diamonds' },
        { k: 'mismatch', l: 'Photo ≠ text' },
        { k: 'weak',     l: 'Check these' },
    ];

    function matchWTile(l, k) {
        // The buy feed shows supply. Demand (WTB/NTQ/ISO) and parts live behind
        // their own tile / tab and never mix into the default wall.
        var isDemand = l.listing_type === 'WTB' || l.listing_type === 'NTQ' || l.listing_type === 'ISO';
        var isParts = l.listing_type === 'PARTS';
        if (!k) return !isDemand && !isParts;
        if (k === 'deals')    return l.delta_pct != null && l.delta_pct >= 10 && !isDemand && !isParts;
        if (k === 'priced')   return l.price_usd != null && !isDemand && !isParts;
        if (k === 'diamonds') return !!l.has_diamonds && !isDemand && !isParts;
        if (k === 'mismatch') return !!l.vision_mismatch;
        // Anything the extractor could not back up against the original message.
        if (k === 'weak')     return l.trust_score != null && l.trust_score < 70;
        return true;
    }

    function wsAfter(tile, brand, group, days, q) {
        // A search runs against every listing held, so re-applying the window
        // here would throw away exactly the older matches the search went
        // looking for. That is why searching appeared to return nothing.
        var cutoff = (days && !WS.searched) ? Date.now() - (+days * 864e5) : 0;
        var needle = (q || '').toLowerCase();
        return WS.listings.filter(function (l) {
            if (!matchWTile(l, tile)) return false;
            if (brand && (l.brand || '') !== brand) return false;
            if (group && l.group_jid !== group) return false;
            if (cutoff && new Date(l.message_ts).getTime() < cutoff) return false;
            if (needle) {
                var hay = [l.brand, l.model, l.reference, l.nickname, l.seller_name,
                           l.dial_material, l.case_material, l.bracelet].filter(Boolean).join(' ').toLowerCase();
                if (hay.indexOf(needle) < 0) return false;
            }
            return true;
        });
    }

    var WCOLS = [
        { k: 'message_ts',   l: 'Seen',   w: '92px' },
        { k: 'brand',        l: 'Watch' },
        { k: 'spec',         l: 'Spec' },
        { k: 'price_usd',    l: 'Asking', w: '104px' },
        { k: 'delta_pct',    l: 'vs Mkt', w: '104px' },
        { k: 'seller_name',  l: 'Seller', w: '150px' },
    ];

    // The dealer feed moves every minute, so "Today" tells you nothing. Show how
    // stale a listing is, because a good price posted 3 minutes ago is a very
    // different thing from the same price posted yesterday.
    function fmtAgo(t) {
        if (!t) return '—';
        var s = Math.floor((Date.now() - new Date(t).getTime()) / 1000);
        if (s < 0) s = 0;
        if (s < 60) return s + 's ago';
        if (s < 3600) return Math.floor(s / 60) + 'm ago';
        if (s < 86400) return Math.floor(s / 3600) + 'h ago';
        return Math.floor(s / 86400) + 'd ago';
    }
    function fmtClock(t) {
        if (!t) return '';
        var d = new Date(t), now = new Date();
        var time = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        return d.toDateString() === now.toDateString()
            ? time
            : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + time;
    }

    function specOf(l) {
        return [
            l.dial_material && l.dial_material !== 'STANDARD' ? l.dial_material : null,
            l.case_material ? l.case_material.replace(/_/g, ' ') : null,
            l.bracelet,
            l.has_diamonds ? 'diamonds' : null,
            l.nickname ? '"' + l.nickname + '"' : null,
        ].filter(Boolean).join(' · ');
    }

    function money(n) {
        if (n == null) return '—';
        return '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
    }

    // Listings priced in HKD/AED/EUR/… are converted to USD at ingest (daily
    // rate). Show the dealer's original figure next to the converted one so
    // the number on screen can be checked against the message at a glance.
    var FX_SIGN = { HKD: 'HK$', AED: 'AED ', EUR: '€', GBP: '£', CHF: 'CHF ', SGD: 'S$', JPY: '¥', CNY: 'CN¥' };
    function fxOriginal(l) {
        if (!l || l.price_original == null || !l.price_currency || l.price_currency === 'USD') return '';
        return (FX_SIGN[l.price_currency] || l.price_currency + ' ') +
               Number(l.price_original).toLocaleString('en-US', { maximumFractionDigits: 0 });
    }

    // The model's own confidence sat at 97% average and never moved, so it told
    // us nothing. Trust is computed from things that can be checked against the
    // original message: was the reference actually written, was the price
    // written, is there a photo, does the photo agree with the caption.
    function trustCell(l) {
        if (l.trust_score == null) return '—';
        var t = Number(l.trust_score);
        var cls = t >= 85 ? 'hot' : t >= 70 ? 'warm' : 'spam';
        var why = (l.trust_why || []).join(' · ');
        return '<span class="tag ' + cls + '">' + t + '%</span>' +
               (why ? '<span class="count" style="margin-left:8px">' + esc(why) + '</span>' : '');
    }

    function wcell(l, k) {
        if (k === 'spec')  return specOf(l);
        if (k === 'trust_score') return l.trust_score == null ? null : Number(l.trust_score);
        if (k === 'brand') return [l.brand, l.model, l.reference].filter(Boolean).join(' ');
        return l[k];
    }

    function sortWs(list) {
        var k = wsort;
        return list.slice().sort(function (a, b) {
            var av = wcell(a, k), bv = wcell(b, k);
            if (k === 'message_ts') return (new Date(av) - new Date(bv)) * wdir;
            // numeric columns: nulls always sink, whichever way you sort
            if (k === 'price_usd' || k === 'delta_pct' || k === 'trust_score') {
                if (av == null && bv == null) return 0;
                if (av == null) return 1;
                if (bv == null) return -1;
                return (Number(av) - Number(bv)) * wdir;
            }
            return String(av == null ? '' : av).localeCompare(String(bv == null ? '' : bv)) * wdir;
        });
    }

    function paintWholesale() {
        // The feed query can take seconds. If the user has already clicked to
        // another tab by the time it resolves, painting here would clobber
        // that tab's view — the "stuck on Wholesale" glitch.
        if (!document.querySelector('#tabs button[data-tab="wholesale"][aria-selected="true"]')) return;
        var list = sortWs(wsAfter(wfilter.tile, wfilter.brand, wfilter.group, wfilter.days, wq));
        var c = WS.counters;
        var brands = Object.keys(WS.listings.reduce(function (m, l) {
            if (l.brand) m[l.brand] = 1; return m;
        }, {})).sort();

        var html =
            '<div class="tiles">' + WTILES.map(function (t) {
                var n = wsAfter(t.k, wfilter.brand, wfilter.group, wfilter.days, wq).length;
                return '<button class="tile" data-wtile="' + t.k + '" aria-pressed="' + (wfilter.tile === t.k) + '">' +
                    '<span class="tk">' + esc(t.l) + '</span><span class="tv">' + n + '</span></button>';
            }).join('') + '</div>' +

            '<div class="bar">' +
              '<input id="w-q" class="ctl grow" type="search" placeholder="SEARCH BRAND, MODEL, REF, NICKNAME, SELLER…" value="' + esc(wq) + '">' +
              '<select id="w-brand" class="ctl"><option value="">ANY BRAND</option>' +
                brands.map(function (b) {
                    return '<option value="' + esc(b) + '"' + (wfilter.brand === b ? ' selected' : '') + '>' + esc(b.toUpperCase()) + '</option>';
                }).join('') + '</select>' +
              '<select id="w-group" class="ctl"><option value="">ANY GROUP</option>' +
                Object.keys(WS.names).map(function (j) {
                    return '<option value="' + esc(j) + '"' + (wfilter.group === j ? ' selected' : '') + '>' + esc((WS.names[j] || '').toUpperCase()) + '</option>';
                }).join('') + '</select>' +
              '<select id="w-days" class="ctl">' +
                [['1', 'LAST 24H'], ['3', 'LAST 3 DAYS'], ['7', 'LAST 7 DAYS'],
                 ['30', 'LAST 30 DAYS'], ['365', 'EVERYTHING']].map(function (o) {
                    return '<option value="' + o[0] + '"' + (String(wfilter.days || '1') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
                }).join('') + '</select>' +
              '<button class="btn ghost" id="w-csv">Export</button>' +
              '<button class="btn ghost" id="w-refresh">Refresh</button>' +
              '<button class="btn ghost" id="w-dense">' + (wDense ? 'Comfortable' : 'Compact') + '</button>' +
              '<button class="btn ghost" id="w-view">' + (wView === 'cards' ? 'Table' : 'Cards') + '</button>' +
            '</div>' +

            // Newest listing age is the real health signal: the ingest runs every
            // minute, so anything older than a few minutes means it has stalled.
            '<p class="count">' +
              (WS.searched
                ? 'Searching all ' + (WS.held || 0).toLocaleString() + ' listings for "' + esc(WS.searched) + '" · ' +
                  WS.listings.length + ' found' + (WS.capped ? ', showing the first batch' : '') + ' · press Enter to search again. '
                : (WS.fallbackDays
                    ? '<span class="tag warm">No listings in the selected window</span> — nothing new has arrived recently, so showing the last ' +
                      WS.fallbackDays + ' days instead · '
                    : '') +
                  'Showing the last ' + (WS.windowDays || 1) + ' day' + ((WS.windowDays || 1) === 1 ? '' : 's') +
                  ' · ' + WS.listings.length.toLocaleString() + ' of ' + (WS.held || 0).toLocaleString() +
                  ' held' + (WS.capped ? ' · <button class="btn ghost" id="w-more" style="vertical-align:baseline">Load more</button>' : '') +
                  ' · press Enter in search to look across all of them. ') +
              (WS.listings.length
                ? 'Newest ' + esc(fmtAgo(WS.listings.reduce(function (a, b) {
                      return new Date(a.message_ts) > new Date(b.message_ts) ? a : b;
                  }).message_ts)) + ' · refreshed ' + esc(fmtAgo(WS.loadedAt)) + ' · auto every 60s'
                : '') +
            '</p>' +
            '<p class="count">' + list.length + ' of ' + WS.listings.length + ' listing' + (WS.listings.length === 1 ? '' : 's') +
              ' · ' + (c.quotable || 0) + ' reference' + (c.quotable === 1 ? '' : 's') + ' priceable' +
              ' · ' + (c.variants || 0) + ' variants tracked' +
              ((c.alerts || 0) ? ' · ' + c.alerts + ' alert' + (c.alerts === 1 ? '' : 's') + ' fired' : '') + '</p>' +

            (wView === 'cards'
              ? wsCards(list)
              : '<div class="tbl-wrap' + (wDense ? ' dense' : '') + '"><table class="leads"><thead><tr>' +
                WCOLS.map(function (col) {
                    var on = wsort === col.k;
                    return '<th class="s' + (on ? ' on' : '') + '" data-wsort="' + col.k + '"' +
                        (col.w ? ' style="width:' + col.w + '"' : '') + '>' + esc(col.l) +
                        '<span class="ar">' + (on ? (wdir < 0 ? '↓' : '↑') : '↕') + '</span></th>';
                }).join('') +
              '</tr></thead><tbody>' +
                (list.length ? list.map(wsRow).join('')
                             : '<tr><td colspan="6" style="padding:28px 0"><span class="tmono">Nothing matches those filters.</span></td></tr>') +
              '</tbody></table></div>');

        view.innerHTML = html;
        wireWholesale();
    }

    // Image-forward browse view, same shape as the public buy grid: big photo,
    // name, price. Corrections stay in the table view; a card click just flips
    // open the detail block.
    // The fields the model most often gets wrong, made editable in place.
    // A correction writes straight to the listing, so variant matching and
    // quotes pick it up immediately, and the original is kept so the
    // extractor can be measured against it. Shared by the table row expand
    // and the card view (where it is injected the first time a card opens).
    function wsFixHtml(l) {
        var EDIT = [
            ['brand',            'Brand',        l.brand,            null],
            ['model',            'Model',        l.model,            null],
            ['dial_color',       'Dial colour',  l.dial_color,       null],
            ['dial_material',    'Dial material',l.dial_material,    ['', 'STANDARD','MOP','METEORITE','STONE','LACQUER','ENAMEL']],
            ['condition',        'Condition',    l.condition,        ['', 'NEW','UNWORN','PRE_OWNED','UNKNOWN']],
            ['set_completeness', 'Contents',     l.set_completeness, ['', 'FULL_SET','WATCH_AND_CARD','WATCH_ONLY','UNKNOWN']],
            ['case_material',    'Case metal',   l.case_material,    ['', 'STEEL','YELLOW_GOLD','WHITE_GOLD','ROSE_GOLD','TWO_TONE','PLATINUM','TITANIUM','CERAMIC']],
            ['bracelet',         'Bracelet',     l.bracelet,         ['', 'OYSTER','JUBILEE','OYSTERFLEX','PRESIDENT','LEATHER','RUBBER','INTEGRATED']],
            ['reference',        'Reference',    l.reference,        null],
            ['price_usd',        'Price',        l.price_usd,        null],
        ];
        var corrected = l.corrected_fields || [];

        return '<p class="count" style="margin-top:14px">Fix anything the model got wrong. ' +
          'Corrections apply everywhere immediately and are kept as training data.</p>' +
          '<div class="dgrid">' + EDIT.map(function (e) {
              var was = corrected.indexOf(e[0]) >= 0;
              var input = e[3]
                ? '<select class="ctl js-fix" data-id="' + esc(l.id) + '" data-field="' + e[0] + '" style="font-size:11px;padding:5px 6px">' +
                    e[3].map(function (o) {
                        return '<option value="' + esc(o) + '"' + (String(e[2] || '') === o ? ' selected' : '') + '>' +
                               esc(o || '—') + '</option>';
                    }).join('') + '</select>'
                : '<input class="ctl js-fix" data-id="' + esc(l.id) + '" data-field="' + e[0] + '" ' +
                  'value="' + esc(e[2] == null ? '' : e[2]) + '" style="font-size:11px;padding:5px 6px;width:100%;max-width:160px;box-sizing:border-box">';
              return '<div><div class="dk">' + esc(e[1]) +
                     (was ? ' <span class="tag warm">fixed</span>' : '') + '</div>' +
                     '<div class="dv">' + input + '</div></div>';
          }).join('') + '</div>';
    }

    var WCARD_CAP = 400;
    function wsCards(list) {
        var shown = list.slice(0, WCARD_CAP);
        if (!shown.length) return '<p class="count" style="padding:28px 0">Nothing matches those filters.</p>';
        return '<div class="wcards">' + shown.map(function (l) {
            var name = [l.brand, l.model].filter(Boolean).join(' ') || 'Unidentified';
            var meta = [l.year, (l.condition || '').replace(/_/g, ' '),
                        (l.set_completeness || '').replace(/_/g, ' ')]
                       .filter(function (x) { return x && x !== 'UNKNOWN'; }).join(' · ');
            // Rendered hidden in every card so a click only flips a class.
            // Repainting the grid made every image re-request and the whole
            // page flash; this touches nothing but the one card.
            var detail =
                '<div class="wc-detail">' +
                    esc([l.dial_color, l.dial_material].filter(Boolean).join(' ') || '') +
                    (l.bracelet ? '<br>' + esc(l.bracelet) : '') +
                    (l.case_material ? '<br>' + esc(String(l.case_material).replace(/_/g, ' ')) +
                        (l.case_size_mm ? ' ' + esc(l.case_size_mm) + 'mm' : '') : '') +
                    '<br>' + esc(l.seller_name || 'unknown seller') +
                    '<br>' + esc(WS.names[l.group_jid] || '') +
                    '<br>' + esc(fmtAgo(l.message_ts)) + ' · ' + esc(l.listing_type || '') +
                '</div>';
            var tag = l.listing_type === 'WTB' || l.listing_type === 'NTQ' ? l.listing_type
                    : (l.delta_pct != null && l.delta_pct >= 10 ? 'DEAL' : '');
            return '<div class="wcard" data-wcard="' + esc(l.id) + '">' +
                '<div class="wc-img">' +
                    (tag ? '<span class="wc-tag">' + esc(tag) + '</span>' : '') +
                    (l.image_url
                        ? '<img src="' + esc(l.image_url) + '" alt="" loading="lazy" decoding="async">'
                        : '<span class="wc-noimg">NO PHOTO</span>') +
                '</div>' +
                '<div class="wc-row">' +
                    '<span class="wc-name">' + esc(name) + '</span>' +
                    '<span class="wc-price">' + esc(money(l.price_usd)) + '</span>' +
                '</div>' +
                '<div class="wc-ref">' + esc(l.reference || 'no ref') +
                    (l.nickname ? ' · ' + esc(l.nickname) : '') +
                    (fxOriginal(l) ? ' · ' + esc(fxOriginal(l)) : '') +
                    (meta ? ' · ' + esc(meta) : '') + '</div>' +
                detail +
            '</div>';
        }).join('') + '</div>' +
        (list.length > WCARD_CAP
            ? '<p class="count" style="margin-top:12px">Showing the first ' + WCARD_CAP +
              ' of ' + list.length + ' — narrow the filters or use the table view for the rest.</p>'
            : '');
    }

    function wsRow(l) {
        var open = wopen === l.id;
        var d = l.delta_pct;
        // Only call something a deal when there is a real baseline behind it.
        var deltaCell = (d == null)
            ? '<span class="tmono">—</span>'
            : '<span class="tag ' + (d >= 10 ? 'hot' : (d <= -10 ? 'spam' : 'warm')) + '">' +
                  (d > 0 ? '-' : '+') + Math.abs(d) + '%</span>';

        var main = '<tr data-wid="' + esc(l.id) + '">' +
            '<td><span class="tmono">' + esc(fmtAgo(l.message_ts)) + '</span>' +
                '<div class="tsub">' + esc(fmtClock(l.message_ts)) + '</div></td>' +
            '<td><div class="wcell">' +
                (l.image_url
                    ? '<img class="wthumb" src="' + esc(l.image_url) + '" alt="" loading="lazy" decoding="async">'
                    : '<span class="wthumb wthumb--none"></span>') +
                '<span><span class="tname">' + esc([l.brand, l.model].filter(Boolean).join(' ') || '—') + '</span>' +
                '<span class="tsub">' + esc(l.reference || 'no ref') + '</span></span>' +
            '</div></td>' +
            '<td>' + (specOf(l) ? esc(specOf(l)) : '<span class="tmono">—</span>') + '</td>' +
            '<td><span class="tmono">' + esc(money(l.price_usd)) + '</span>' +
                (fxOriginal(l) ? '<div class="tsub">' + esc(fxOriginal(l)) + '</div>' : '') + '</td>' +
            '<td>' + deltaCell + '</td>' +
            '<td><span class="tsub">' + esc(l.seller_name || '—') + '</span></td>' +
        '</tr>';

        if (!open) return main;

        var rows = [
            ['Reference',   l.reference || '—'],
            ['Asking',      money(l.price_usd) + (fxOriginal(l) ? ' — converted from ' + fxOriginal(l) + ' at the daily rate' : '')],
            // An exact match now means same dial colour too, which is the single
            // biggest price driver. Where there is no number, say which reason.
            ['Market',      l.baseline_usd
                              ? money(l.baseline_usd) + ' (median of ' + l.baseline_n +
                                (l.baseline_basis === 'VARIANT'
                                  ? ' exact matches, same dial)' : ' same ref)')
                              : (l.baseline_note || 'not enough quotes yet')],
            ['Condition',   (l.condition || 'UNKNOWN').replace(/_/g, ' ')],
            ['Set',         (l.set_completeness || 'UNKNOWN').replace(/_/g, ' ')],
            ['Year',        l.year || '—'],
            ['Dial',        [l.dial_color, l.dial_material].filter(Boolean).join(' ') || '—'],
            ['Case',        [l.case_material, l.case_size_mm ? l.case_size_mm + 'mm' : null].filter(Boolean).join(' ').replace(/_/g, ' ') || '—'],
            ['Bracelet',    l.bracelet || '—'],
            ['Bezel',       l.bezel || '—'],
            ['Complications', (l.complications || []).join(', ').replace(/_/g, ' ') || '—'],
            ['Diamonds',    l.has_diamonds ? (l.diamonds_factory === true ? 'factory' : l.diamonds_factory === false ? 'aftermarket' : 'yes, source unstated') : 'no'],
            ['Group',       WS.names[l.group_jid] || l.group_jid],
            ['Type',        l.listing_type],
            ['Trust',       trustCell(l)],
            ['Read by',     l.model_used || '—'],
        ];
        if (l.vision_mismatch) {
            rows.push(['Photo says', [l.vision_brand, l.vision_model, l.vision_reference].filter(Boolean).join(' ') || '—']);
        }

        var editHtml = wsFixHtml(l);

        return main +
            '<tr class="detail"><td colspan="6"><div class="dgrid">' +
              rows.map(function (r) {
                  return '<div><div class="dk">' + esc(r[0]) + '</div><div class="dv">' + esc(String(r[1])) + '</div></div>';
              }).join('') +
            '</div>' + editHtml +
            (l.image_url ? '<img class="wshot" src="' + esc(l.image_url) + '" alt="" loading="lazy" decoding="async">' : '') +
            (l.vision_mismatch ? '<p class="note">The photo does not match the reference in the caption. Worth a look before quoting.</p>' : '') +
            '</td></tr>';
    }

    // ── Watches & Wonders 2027 outreach tracker ──────────────────────────
    var WW = null;
    var wwStatus = '';
    var WW_STATUSES = ['research', 'to_contact', 'drafted', 'sent', 'replied', 'meeting_set', 'declined'];

        var r = await A.adminFetchTo('/api/leads-admin', 'ww');

        paintWW();

            (counts.replied || 0) + ' replied. Fields save when you click away.</p>' +

                }).join('') + '</div>' +

                '<th>Last touch</th><th>Follow up</th><th>Notes</th>' +
            '</tr></thead><tbody>' +
            list.map(function (b) {
                var draftRow = b.draft_body
                    ? '<tr class="ww-draft" data-draft-for="' + esc(b.id) + '" style="display:none"><td></td><td colspan="9">' +
                        '<div style="padding:10px 0 16px">' +
                        '<div class="tsub" style="margin-bottom:6px">To: ' + esc(b.contact_email || '') +
                            ' · Subject: ' + esc(b.draft_subject || '') +
                            (b.gmail_draft_url ? ' · <a href="' + esc(b.gmail_draft_url) + '" target="_blank" rel="noopener">Open in Gmail</a>' : '') + '</div>' +
                        '<pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.5;margin:0;max-width:640px">' +
                        esc(b.draft_body) + '</pre></div></td></tr>'
                    : '';
                var inp = function (field, val, w, type) {
                    return '<input class="ctl js-ww" data-id="' + esc(b.id) + '" data-field="' + field + '" ' +
                        (type ? 'type="' + type + '" ' : '') +
                        'value="' + esc(val == null ? '' : val) + '" style="font-size:11px;padding:4px 6px;width:' + w + '">';
                };
                return '<tr>' +
                    '<td>' + (b.draft_body
                        ? '<button class="btn ghost js-ww-toggle" data-toggle="' + esc(b.id) + '" style="font-size:10px;padding:3px 8px">Draft</button>'
                        : '') + '</td>' +
                    '<td><span class="tname">' + esc(b.brand) + '</span>' +
                        '<div class="tsub">' + esc((b.type || '').replace(/_/g, ' ')) + (b.ww_exhibitor ? ' · exhibits' : '') + '</div></td>' +
                    '<td><span class="tsub">' + esc(b.location || '') + '</span></td>' +
                    '<td><select class="ctl js-ww" data-id="' + esc(b.id) + '" data-field="priority" style="font-size:11px;padding:4px">' +
                        [1, 2, 3].map(function (p) { return '<option value="' + p + '"' + (b.priority === p ? ' selected' : '') + '>' + p + '</option>'; }).join('') +
                    '</select></td>' +
                    '<td><select class="ctl js-ww" data-id="' + esc(b.id) + '" data-field="status" style="font-size:11px;padding:4px">' +
                        WW_STATUSES.map(function (s) { return '<option value="' + s + '"' + (b.status === s ? ' selected' : '') + '>' + s.replace(/_/g, ' ') + '</option>'; }).join('') +
                    '</select></td>' +

        });
        [].forEach.call(view.querySelectorAll('.js-ww'), function (el) {
            var evt = el.tagName === 'SELECT' ? 'change' : 'blur';
            el.addEventListener(evt, async function () {
                var id = this.dataset.id, field = this.dataset.field, val = this.value;
                var row = WW.filter(function (x) { return x.id === id; })[0];
                if (!row || String(row[field] == null ? '' : row[field]) === String(val)) return;
                var node = this;
                node.style.opacity = '0.5';
                try {
                    var patch = {}; patch[field] = val;
                    // A status change stamps the touch date on the sensible ones.
                    if (field === 'status' && (val === 'sent' || val === 'replied' || val === 'meeting_set')) {
                        patch.last_contact_at = new Date().toISOString().slice(0, 10);
                    }
                    var r = await A.adminFetchTo('/api/leads-admin', 'ww-save', { id: id, row: patch });
                    Object.keys(r.row || {}).forEach(function (k) { row[k] = r.row[k]; });
                    node.style.opacity = '1';
                    if (field === 'status') paintWW();
                } catch (err) { node.style.opacity = '1'; alert('Could not save: ' + err.message); }
            });
        });

    // Corrections save on blur (text) or change (select) so a fix is one
    // action, not type-then-click. Clicks inside must not collapse the row
    // or card. Scoped so panels injected later (card opens) can bind too.
    function bindFixInputs(root) {
        [].forEach.call(root.querySelectorAll('.js-fix'), function (el) {
            if (el.dataset.bound) return;
            el.dataset.bound = '1';
            el.addEventListener('click', function (e) { e.stopPropagation(); });
            var evt = el.tagName === 'SELECT' ? 'change' : 'blur';
            el.addEventListener(evt, async function (e) {
                e.stopPropagation();
                var id = Number(this.dataset.id), field = this.dataset.field, val = this.value;
                var live = (WS.listings.filter(function (x) { return x.id === id; })[0] || {})[field];
                if (String(live == null ? '' : live) === String(val)) return;   // nothing changed
                var node = this;
                node.style.opacity = '0.5';
                try {
                    var r = await A.adminFetchTo('/api/leads-admin', 'correct-listing',
                                                 { listing_id: id, field: field, value: val });
                    // keep the in-memory row in step so a repaint does not revert it
                    WS.listings.forEach(function (x) { if (x.id === id) x[field] = r.now; });
                    node.style.opacity = '1';
                } catch (err) {
                    node.style.opacity = '1';
                    alert('Could not save: ' + err.message);
                }
            });
        });
    }

    function wireWholesale() {

            });
            // Typing filters the window that is loaded. Enter goes to the
            // database and searches every listing held, whatever its age.
            q.addEventListener('keydown', function (e) {
                if (e.key !== 'Enter') return;
                e.preventDefault();
                wq = this.value;
                view.innerHTML = '<p class="count">Searching every listing…</p>';

                    view.innerHTML = '<p class="err">Search failed: ' + esc(err.message || err) + '</p>';

        // Corrections save on blur (text) or change (select) so a fix is one
        // action, not type-then-click. Clicks inside must not collapse the row.
        bindFixInputs(document);

        [['w-brand', 'brand'], ['w-group', 'group']].forEach(function (pair) {
            var el = document.getElementById(pair[0]);
            if (el) el.addEventListener('change', function () { wfilter[pair[1]] = this.value; paintWholesale(); });

        var wd = document.getElementById('w-days');
        if (wd) wd.addEventListener('change', function () {
            wfilter.days = this.value;

        });

        var rf = document.getElementById('w-refresh');
        if (rf) rf.addEventListener('click', function () {

            renderWholesale().catch(function (e) { view.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
        });

        // Page through the rest of the window: same filter, next 2,000 rows,
        // appended so what is already on screen never jumps.
        var more = document.getElementById('w-more');
        if (more) more.addEventListener('click', function () {
            var self = this;
            self.disabled = true; self.textContent = 'Loading…';
            A.adminFetchTo('/api/leads-admin', 'wholesale',

                .then(function (r) {
                    var seen = {};
                    WS.listings.forEach(function (l) { seen[l.id] = 1; });
                    (r.listings || []).forEach(function (l) { if (!seen[l.id]) WS.listings.push(l); });
                    WS.capped = r.listings_capped;
                    paintWholesale();

        var dens = document.getElementById('w-dense');

        var vw = document.getElementById('w-view');

        [].forEach.call(document.querySelectorAll('[data-wcard]'), function (card) {

                if (this.classList.contains('open') && !this.querySelector('.js-fix')) {
                    var id = Number(this.dataset.wcard);
                    var l = WS.listings.filter(function (x) { return x.id === id; })[0];
                    var det = this.querySelector('.wc-detail');

    function exportWholesale() {
        var list = sortWs(wsAfter(wfilter.tile, wfilter.brand, wfilter.group, wfilter.days, wq));
        var cols = ['message_ts', 'brand', 'model', 'reference', 'price_usd', 'price_original', 'price_currency', 'baseline_usd', 'delta_pct',
                    'condition', 'set_completeness', 'year', 'dial_color', 'dial_material', 'case_material',
                    'case_size_mm', 'bracelet', 'bezel', 'has_diamonds', 'nickname', 'seller_name',
                    'listing_type', 'trust_score', 'model_used'];
        var csv = [cols.join(',')].concat(list.map(function (l) {
            return cols.map(function (k) {
                var s = l[k] == null ? '' : String(l[k]);
                // stop a dealer's text executing as a formula in Excel
                if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
                return '"' + s.replace(/"/g, '""') + '"';
            }).join(',');
        })).join('\n');
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = 'dialed-wholesale.csv';
        a.click();
        URL.revokeObjectURL(a.href);
    }

        var r = await A.adminFetchTo('/api/leads-admin', 'matches');
        MX.wants = r.wants || []; MX.best = r.best || [];
        MX.alerts = r.alerts || []; MX.counters = r.counters || {};
        // Quote book rides along: the Prices view is where the confidence gate is
        // actually visible, and the tile count comes from it.
        try {
            var qb = await A.adminFetchTo('/api/leads-admin', 'quote-book');
            QB.rows = qb.rows || []; QB.counters = qb.counters || {};
        } catch (e) { QB = { rows: [], counters: {} }; }
        try {
            var rt = await A.adminFetchTo('/api/leads-admin', 'retail');
            RT.rows = rt.rows || []; RT.bySource = rt.bySource || []; RT.counters = rt.counters || {};
        } catch (e) { RT = { rows: [], bySource: [], counters: {} }; }
        paintMatches();
    }
