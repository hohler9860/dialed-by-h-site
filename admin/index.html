                      esc(d.photo_metal || d.photo_diamonds || '—') + '</td>' +
                    '<td class="count">' + esc(why.join(' · ')) + '</td>' +
                  '</tr>';
              }).join('') +
              '</tbody></table></div>'
            : '') +

          // Whether a dealer's message actually became an identified watch.
          // A listing with no family cannot be matched to anyone, and a
          // reference the chats argue about sends the wrong piece.
          (function () {
              var h = AC.identity;
              if (!h) return '';
              var famPct = Number(h.family_pct || 0);
              var cards = [
                  { l: 'Listings for sale', v: h.for_sale, c: '' },
                  { l: 'With a reference', v: h.with_reference, c: '' },
                  { l: 'Identified to a model', v: famPct + '%', c: pctColor(famPct) },
                  { l: 'Reference stuck in model field', v: h.ref_in_model,
                    c: Number(h.ref_in_model) > 0 ? WARN_AMBER : OK_GREEN },
                  { l: 'Model families known', v: h.families_known, c: '' },
                  { l: 'Pinned down by hand', v: h.families_curated, c: '' },
                  { l: 'References in dispute', v: h.contested,
                    c: Number(h.contested) > 0 ? WARN_AMBER : OK_GREEN },
              ];
              return '<p class="count" style="margin-top:22px">Identifying the watch · ' +
                  'a listing with no model line cannot be matched to any client</p>' +
                '<div class="scard" style="margin-bottom:14px">' +
                cards.map(function (c) {
                    return '<div style="display:flex;justify-content:space-between;gap:16px;padding:6px 0">' +
                      '<span class="count">' + esc(c.l) + '</span>' +
                      '<b' + (c.c ? ' style="color:' + c.c + '"' : '') + '>' + esc(c.v) + '</b></div>';
                }).join('') +
                '</div>' +
                ((AC.contested || []).length
                  ? '<p class="count">References the chats disagree on · the majority answer is ' +
                      'being used, so a wrong one here sends the wrong watch</p>' +
                    '<div class="tbl-wrap" style="margin-bottom:20px"><table class="leads"><thead><tr>' +
                      '<th style="width:150px">Brand</th><th style="width:110px">Reference</th>' +
                      '<th style="width:150px">Currently reads as</th><th style="width:110px">Agreement</th>' +
                      '<th>Listings</th></tr></thead><tbody>' +
                    AC.contested.map(function (r) {
                        var a = Number(r.agreement_pct || 0);
                        return '<tr>' +
                          '<td>' + esc(r.brand) + '</td>' +
                          '<td>' + esc(r.ref_key) + '</td>' +
                          '<td>' + esc(r.current_answer) + '</td>' +
                          '<td><span class="tag ' + (a >= 75 ? 'warm' : 'spam') + '">' + a + '%</span></td>' +
                          '<td class="count">' + esc(r.listings) + '</td>' +
                        '</tr>';
                    }).join('') +
                    '</tbody></table></div>'
                  : '');
          })() +

          // Cheap vision models, same photos, same prompt. With no ground truth
          // the signal is agreement: what they all read the same way is probably
          // right, what they split on is where a photo alone is not enough.
          ((AC.benchModels || []).length
            ? '<p class="count" style="margin-top:22px">Cheap vision models head to head · ' +
                'same photos, same prompt, no ground truth so this measures agreement</p>' +
              '<div class="tbl-wrap" style="margin-bottom:14px"><table class="leads"><thead><tr>' +
                '<th style="width:210px">Model</th><th style="width:90px">Answered</th>' +
                '<th style="width:110px">With majority</th><th style="width:90px">Said null</th>' +
                '<th style="width:110px">Tokens</th><th>Notes</th>' +
              '</tr></thead><tbody>' +
              AC.benchModels.map(function (m) {
                  var rate = Number(m.answer_rate);
                  var cls = rate >= 95 ? 'hot' : rate >= 50 ? 'warm' : 'spam';
                  return '<tr>' +
                    '<td>' + esc(m.model) + '</td>' +
                    '<td><span class="tag ' + cls + '">' + esc(m.answer_rate) + '%</span></td>' +
                    '<td>' + (m.pct_with_majority == null ? '—' : esc(m.pct_with_majority) + '%') + '</td>' +
                    '<td>' + (m.pct_said_null == null ? '—' : esc(m.pct_said_null) + '%') + '</td>' +
                    '<td class="count">' + (m.avg_tokens_in ? esc(m.avg_tokens_in) + ' / ' + esc(m.avg_tokens_out) : '—') + '</td>' +
                    '<td class="count">' + esc(m.errors || '') + '</td>' +
                  '</tr>';
              }).join('') +
              '</tbody></table></div>' +
              '<p class="count">What the models agree on · anything low here is a ' +
                'weak spot in the pipeline whichever model reads the photo</p>' +
              '<div class="tbl-wrap" style="margin-bottom:20px">' +
              svgBars((AC.benchFields || []).map(function (f) {
                  return { k: f.field, v: Number(f.pct_agree || 0),
                           t: f.pct_agree + '% agree · split on ' + f.split_on + ' of ' + f.photos,
                           c: pctColor(Number(f.pct_agree || 0)) };
              }), { max: 100, labW: 140, barW: 260 }) +
              '</div>'
            : '') +

          '<div class="bar">' +
            FILTERS.map(function (f) {
                return '<button class="btn ghost" data-ac="' + f.k + '" ' +
                  (acOnly === f.k ? 'style="border-color:var(--l1)"' : '') + '>' + esc(f.l) + '</button>';
            }).join('') +
            '<button class="btn ghost" data-acsort="' + (acSort === 'worst' ? 'recent' : 'worst') + '">' +
              (acSort === 'worst' ? 'Sorted: worst first' : 'Sorted: newest first') + '</button>' +
          '</div>' +
          '<p class="count">' + (AC.samples || []).length + ' reads · click any row to see the ' +
          'dealer\'s original message next to what the model returned</p>' +
          '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
            '<th style="width:70px">Trust</th><th style="width:150px">Watch</th>' +
            '<th style="width:110px">Reference</th><th style="width:110px">Price</th>' +
            '<th>Why it scored that</th><th style="width:90px">Model</th>' +
            '<th style="width:80px">Seen</th>' +
          '</tr></thead><tbody>' +
          (AC.samples || []).map(function (s) {
              var tcls = s.trust_score >= 85 ? 'hot' : s.trust_score >= 70 ? 'warm' : 'spam';
              var row = '<tr data-acrow="' + esc(s.id) + '" style="cursor:pointer">' +
                '<td><span class="tag ' + tcls + '">' + esc(s.trust_score == null ? '—' : s.trust_score) + '</span></td>' +
                '<td>' + esc([s.brand, s.model].filter(Boolean).join(' ') || '—') + '</td>' +
                '<td>' + esc(s.reference || '—') + '</td>' +
                '<td>' + esc(s.price_usd ? money(s.price_usd) : '—') + '</td>' +
                '<td class="count">' + esc((s.trust_why || []).join(' · ') || 'nothing against it') + '</td>' +
                '<td class="count">' + esc(String(s.run_model).split('/').pop()) + '</td>' +
                '<td>' + esc(fmtAgo(s.message_ts)) + '</td>' +
              '</tr>';
              return row + (acOpen === s.id ? acSample(s) : '');
          }).join('') +
          '</tbody></table></div>';

        [].forEach.call(document.querySelectorAll('[data-ac]'), function (b) {
            b.addEventListener('click', function () { acOnly = this.dataset.ac; acOpen = null; renderAccuracy(); });
        });
        [].forEach.call(document.querySelectorAll('[data-acsort]'), function (b) {
            b.addEventListener('click', function () { acSort = this.dataset.acsort; acOpen = null; renderAccuracy(); });
        });
        [].forEach.call(document.querySelectorAll('[data-acrow]'), function (r) {
            r.addEventListener('click', function () {
                var id = Number(this.dataset.acrow);
                acOpen = (acOpen === id) ? null : id;
                paintAccuracy();
            });
        });
    }

    // ══════════════════════════════════════════════════════════
    // HEALTH  — is anything actually flowing
    // ══════════════════════════════════════════════════════════
    var hlTimer = null;

    function fmtAge(m) {
        if (m == null) return 'never';
        if (m < 60)    return m + 'm ago';
        if (m < 1440)  return Math.floor(m / 60) + 'h ago';
        return Math.floor(m / 1440) + 'd ago';
    }

    // ══════════════════════════════════════════════════════════
    // PARTS  — boxes, links, bezels, straps
    // ══════════════════════════════════════════════════════════
    // The parts group plus anything typed PARTS elsewhere. These are text
    // posts more than specs, so the original message is the main column.
    var PT = { rows: [] };
    var ptq = '';

    async function renderParts() {
        var d = await A.adminFetchTo('/api/leads-admin', 'parts');
        PT.rows = d.rows || [];
        paintParts();
    }

    function paintParts() {
        var needle = ptq.trim().toLowerCase();
        var rows = PT.rows.filter(function (r) {
            if (!needle) return true;
            return [r.body, r.brand, r.model, r.reference, r.seller_name]
                .filter(Boolean).join(' ').toLowerCase().indexOf(needle) >= 0;
        });

        view.innerHTML =
          '<div class="tiles">' +
            '<div class="tile"><span class="tk">Parts posts</span><span class="tv">' + PT.rows.length + '</span></div>' +
            '<div class="tile"><span class="tk">With photo</span><span class="tv">' +
                PT.rows.filter(function (r) { return r.image_url; }).length + '</span></div>' +
            '<div class="tile"><span class="tk">Priced</span><span class="tv">' +
                PT.rows.filter(function (r) { return r.price_usd != null; }).length + '</span></div>' +
          '</div>' +
          '<div class="bar"><input id="pt-q" class="ctl grow" type="search" placeholder="SEARCH PARTS, BOXES, LINKS…" value="' + esc(ptq) + '">' +
            '<button class="btn ghost" id="pt-refresh">Refresh</button></div>' +
          '<p class="count">' + rows.length + ' of ' + PT.rows.length + ' · newest first · last 500 held</p>' +
          '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
            '<th style="width:100px">Seen</th><th style="width:64px"></th><th>Post</th>' +
            '<th style="width:110px">Price</th><th style="width:150px">Seller</th>' +
          '</tr></thead><tbody>' +
          (rows.length ? rows.map(function (r) {
              var spec = [r.brand, r.model, r.reference].filter(Boolean).join(' ');
              return '<tr>' +
                '<td><span class="tmono">' + esc(fmtAgo(r.message_ts)) + '</span></td>' +
                '<td>' + (r.image_url
                    ? '<img class="wthumb" src="' + esc(r.image_url) + '" alt="" loading="lazy" decoding="async">'
                    : '<span class="wthumb wthumb--none"></span>') + '</td>' +
                '<td>' + (spec ? '<div class="tname">' + esc(spec) + '</div>' : '') +
                    '<div class="tsub" style="white-space:pre-wrap">' + esc((r.body || '').slice(0, 400)) + '</div></td>' +
                '<td><span class="tmono">' + esc(money(r.price_usd)) + '</span></td>' +
                '<td><span class="tsub">' + esc(r.seller_name || '—') + '</span></td>' +
              '</tr>';
          }).join('') : '<tr><td colspan="5" style="padding:28px 0"><span class="tmono">No parts posts yet.</span></td></tr>') +
          '</tbody></table></div>';

        var q2 = document.getElementById('pt-q');
        if (q2) q2.addEventListener('input', function () {
            ptq = this.value; var p = this.selectionStart; paintParts();
            var n = document.getElementById('pt-q');
            if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} }
        });
        var rf2 = document.getElementById('pt-refresh');
        if (rf2) rf2.addEventListener('click', function () {
            view.innerHTML = '<p class="count">Loading…</p>';
            renderParts().catch(function (e) { view.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
        });
    }

    // ══════════════════════════════════════════════════════════
    // PIPELINE  — the machine, drawn live
    // ══════════════════════════════════════════════════════════
    // The diagram is built once; a 4s poll only updates numbers and animation
    // speeds, so the motion never stutters from re-rendering. Every box is a
    // real stage in the jobs pipeline and every moving edge means work is
    // actually flowing through that link right now.
    var plTimer = null, plLast = {};

    function plNode(x, y, w, id, label, sub, work) {
        return '<g id="pl-g-' + id + '" transform="translate(' + x + ',' + y + ')">' +
            '<rect class="pnode' + (work ? ' pnode--work' : '') + '" width="' + w + '" height="76" rx="2"/>' +
            '<text class="plabel" x="12" y="20">' + label + '</text>' +
            '<text class="pnum" id="pl-' + id + '" x="12" y="48">—</text>' +
            '<text class="psub" id="pl-' + id + '-sub" x="12" y="66">' + sub + '</text>' +
        '</g>';
    }

    function plEdge(id, d) {
        return '<path class="pedge" d="' + d + '"/>' +
               '<path class="pedge pedge--flow" id="ple-' + id + '" d="' + d + '" style="display:none"/>' +
               '<circle class="pdot" id="pld-' + id + '" r="2.6" style="display:none">' +
                 '<animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#ple-' + id + '"/></animateMotion>' +
               '</circle>';
    }

    async function renderPipeline() {
        view.innerHTML =
          '<p class="count">The classification machine, live. Boxes are stages, moving lines are work ' +
          'flowing right now. Workers poll every 30 seconds and claim one listing at a time; ' +
          'failures drop to the bin below and wait in Health for a requeue.</p>' +
          '<div class="pipe-wrap"><svg class="pipe-svg" viewBox="0 0 1160 400">' +

            // Photos take the high road: fetched from WhatsApp, shrunk, stored
            // on the CDN, and rejoin the flow at the classify stage.
            plNode(330, 20, 150, 'media', 'PHOTO UPLOAD', 'to CDN/hr', true) +

            plNode(10, 150, 130, 'groups', 'GROUPS', 'watch chats') +
            plNode(180, 150, 130, 'msgs', 'MESSAGES', 'in/hr') +
            plNode(350, 150, 130, 'intake', 'INTAKE', 'waiting') +
            plNode(520, 150, 150, 'classify', 'CLASSIFY', 'reads/hr', true) +
            plNode(710, 150, 130, 'verify_q', 'VERIFY QUEUE', 'waiting') +
            plNode(880, 150, 150, 'verify', 'TWO-MODEL VERIFY', 'agreed/hr', true) +
            plNode(1020, 20, 130, 'done', 'CLASSIFIED', 'today') +

            plNode(520, 290, 150, 'noise', 'CHATTER', 'filtered out / hour') +
            plNode(880, 290, 150, 'failed', 'FAILED JOBS', 'waiting for requeue') +

            plEdge('g_m', 'M140,188 L180,188') +
            plEdge('m_i', 'M310,188 L350,188') +
            plEdge('i_c', 'M480,188 L520,188') +
            plEdge('c_q', 'M670,188 L710,188') +
            plEdge('q_v', 'M840,188 L880,188') +
            plEdge('v_d', 'M1030,150 C1030,110 1050,100 1060,96') +
            plEdge('m_media', 'M245,150 C245,60 300,58 330,58') +
            plEdge('media_c', 'M480,58 C560,58 595,100 595,150') +
            plEdge('c_n', 'M595,226 L595,290') +
            plEdge('v_f', 'M955,226 L955,290') +
          '</svg></div>' +
          '<div id="pl-failed-panel"></div>' +
          '<div class="pipe-recent"><p class="count" id="pl-tickline">Latest reads…</p>' +
          '<div class="tbl-wrap"><table class="leads"><tbody id="pl-recent"></tbody></table></div></div>';

        // The failed bin opens right here: the boss's spec is "show failed jobs
        // and choose to requeue them", and the diagram is where you're looking
        // when you notice the number.
        var fg = document.getElementById('pl-g-failed');
        if (fg) {
            fg.style.cursor = 'pointer';
            fg.addEventListener('click', togglePlFailed);
        }

        plLast = {};
        await pollPipeline();
        if (plTimer) clearInterval(plTimer);
        plTimer = setInterval(function () {
            var on = document.querySelector('#tabs button[data-tab="pipeline"][aria-selected="true"]');
            if (!on) { clearInterval(plTimer); plTimer = null; return; }
            if (document.hidden) return;
            pollPipeline();
        }, 4000);
    }

    var plFailedOpen = false;
    function togglePlFailed() {
        plFailedOpen = !plFailedOpen;
        var panel = document.getElementById('pl-failed-panel');
        if (!panel) return;
        if (!plFailedOpen) { panel.innerHTML = ''; return; }
        panel.innerHTML = '<p class="count">Loading failed jobs…</p>';
        A.adminFetchTo('/api/leads-admin', 'jobs').then(function (jb) {
            var failed = jb.failed || [];
            panel.innerHTML =
              '<p class="count" style="margin-top:14px">' +
                (failed.length ? failed.length + ' failed job' + (failed.length === 1 ? '' : 's') +
                    ' · requeue puts the listing back in front of its worker'
                 : 'Nothing stuck. Failures land here with their reason.') + '</p>' +
              (failed.length ?
                '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
                  '<th style="width:70px">Job</th><th style="width:150px">Type</th><th>Failure reason</th>' +
                  '<th style="width:110px">When</th><th style="width:100px"></th>' +
                '</tr></thead><tbody>' +
                failed.map(function (f) {
                    return '<tr><td class="tmono">#' + esc(f.id) + '</td>' +
                      '<td>' + esc(f.job_type) + '</td>' +
                      '<td class="count">' + esc(f.error || '—') + '</td>' +
                      '<td>' + esc(fmtDate(f.claimed_at)) + '</td>' +
                      '<td><button class="btn ghost" data-pl-requeue="' + esc(f.id) + '">Requeue</button></td></tr>';
                }).join('') + '</tbody></table></div>' : '');
            [].forEach.call(panel.querySelectorAll('[data-pl-requeue]'), function (b) {
                b.addEventListener('click', function (e) {
                    e.stopPropagation();
                    var self = this;
                    self.disabled = true; self.textContent = '…';
                    A.adminFetchTo('/api/leads-admin', 'job-requeue', { job_id: Number(this.dataset.plRequeue) })
                        .then(function () { plFailedOpen = false; togglePlFailed(); pollPipeline(); })
                        .catch(function (err) { alert(err.message); self.disabled = false; self.textContent = 'Requeue'; });
                });
            });
        }).catch(function (e) { panel.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
    }

    function plSet(id, val, sub) {
        var el = document.getElementById('pl-' + id);
        if (!el) return;
        var txt = val == null ? '—' : Number(val).toLocaleString();
        if (el.textContent !== txt) {
            el.textContent = txt;
            // A brief green pulse marks a number that just moved.
            if (plLast[id] != null) {
                el.classList.remove('bump'); void el.getBBox; el.classList.add('bump');
            }
        }
        plLast[id] = val;
        if (sub != null) {
            var s = document.getElementById('pl-' + id + '-sub');
            if (s) s.textContent = sub;
        }
    }

    // rate is per hour; the edge animates when there is flow, and the dash
    // speed scales with how fast that link is actually moving.
    function plFlow(id, rate) {
        var flow = document.getElementById('ple-' + id);
        var dot = document.getElementById('pld-' + id);
        if (!flow) return;
        var on = rate > 0;
        flow.style.display = on ? '' : 'none';
        if (dot) dot.style.display = on ? '' : 'none';
        if (on) {
            var dur = Math.max(0.35, Math.min(2.5, 120 / rate));
            flow.style.animationDuration = dur + 's';
        }
    }

    async function pollPipeline() {
        var d;
        try { d = await A.adminFetchTo('/api/leads-admin', 'pipeline'); }
        catch (e) { return; }
        if (!document.getElementById('pl-msgs')) return;

        // Sub captions must fit their boxes: the box is ~130px and the mono
        // face runs ~5px a character, so keep these under about 22 characters.
        plSet('groups', d.groups_active);
        plSet('msgs', d.msgs_1h, 'in/hr · ' + fmtAgo(d.last_message_at));
        plSet('media', d.media_1h, 'to CDN/hr · ' + (d.media_pending || 0) + ' queued');
        plSet('intake', d.intake, (d.running || 0) > 0 ? d.running + ' being read' : 'waiting');
        plSet('classify', d.classify_1h, 'reads/hr · ' + fmtAgo(d.last_classify_at));
        plSet('verify_q', d.awaiting_verify);
        plSet('verify', d.verify_1h, 'agreed/hr · ' + fmtAgo(d.last_verify_at));
        plSet('done', d.classified_today);
        plSet('noise', d.noise_1h);
        plSet('failed', d.failed, d.failed > 0 ? 'click to view + requeue' : 'nothing stuck');

        var msgRate = d.msgs_1h || 0, clsRate = d.classify_1h || 0, vfyRate = d.verify_1h || 0;
        plFlow('g_m', msgRate);
        plFlow('m_i', clsRate);
        plFlow('i_c', clsRate);
        plFlow('c_q', vfyRate);
        plFlow('q_v', vfyRate);
        plFlow('v_d', vfyRate);
        plFlow('m_media', d.media_1h || 0);
        plFlow('media_c', d.media_1h || 0);
        plFlow('c_n', d.noise_1h || 0);
        plFlow('v_f', 0);

        var tick = document.getElementById('pl-tickline');
        if (tick) tick.textContent = 'Latest reads · updates every 4s · ' +
            (d.classified_today || 0).toLocaleString() + ' classified today';
        var tb = document.getElementById('pl-recent');
        if (tb) tb.innerHTML = (d.recent || []).map(function (r) {
            return '<tr><td style="width:110px"><span class="tmono">' + esc(fmtAgo(r.finished_at)) + '</span></td>' +
                '<td><span class="tname">' + esc([r.brand, r.model].filter(Boolean).join(' ') || 'Unidentified') + '</span>' +
                ' <span class="tmono">' + esc(r.reference || '') + '</span></td>' +
                '<td style="width:90px"><span class="tmono">' + esc(r.listing_type || '') + '</span></td>' +
                '<td style="width:110px;text-align:right"><span class="tmono">' + esc(money(r.price_usd)) + '</span></td></tr>';
        }).join('');
    }

    async function renderHealth() {
        var pair = await Promise.all([
            A.adminFetchTo('/api/leads-admin', 'health'),
            A.adminFetchTo('/api/leads-admin', 'jobs'),
        ]);
        var d = pair[0], jb = pair[1] || {};
        var steps = d.steps || [];
        var bad = d.dead + d.stale;

        // Jobs board: the pipeline is a set of 30s workers coordinating through
        // wholesale.jobs. Failures never retry themselves — they are listed
        // here with their reason and a Requeue button.
        var jbCounts = jb.counts || {};
        var jbFailed = jb.failed || [];
        var jobsHtml =
          '<p class="count" style="margin-top:22px">Jobs pipeline · last 24h per worker · ' +
          jbFailed.length + ' failed waiting for requeue' +
          (jbFailed.length ? ' <button class="btn ghost" data-requeue-all style="margin-left:8px">Requeue all failed</button>' : '') +
          '</p>' +
          '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
            '<th style="width:200px">Job type</th><th style="width:90px">Success</th>' +
            '<th style="width:90px">Failed</th><th style="width:90px">Running</th>' +
          '</tr></thead><tbody>' +
          Object.keys(jbCounts).map(function (k) {
              var c = jbCounts[k];
              return '<tr><td>' + esc(k) + '</td>' +
                '<td>' + (c.success || 0) + '</td>' +
                '<td>' + ((c.failed || 0) > 0 ? '<span class="tag spam">' + c.failed + '</span>' : '0') + '</td>' +
                '<td>' + (c.running || 0) + '</td></tr>';
          }).join('') +
          '</tbody></table></div>' +
          (jbFailed.length ?
            '<div class="tbl-wrap" style="margin-top:10px"><table class="leads"><thead><tr>' +
              '<th style="width:70px">Job</th><th style="width:160px">Type</th><th>Failure reason</th>' +
              '<th style="width:110px">When</th><th style="width:100px"></th>' +
            '</tr></thead><tbody>' +
            jbFailed.map(function (f) {
                return '<tr><td class="tmono">#' + esc(f.id) + '</td>' +
                  '<td>' + esc(f.job_type) + '</td>' +
                  '<td class="count">' + esc(f.error || '—') + '</td>' +
                  '<td>' + esc(fmtDate(f.claimed_at)) + '</td>' +
                  '<td><button class="btn ghost" data-requeue="' + esc(f.id) + '">Requeue</button></td></tr>';
            }).join('') +
            '</tbody></table></div>' : '');

        view.innerHTML =
          '<div class="tiles">' +
            '<div class="tile"><span class="tk">Steps</span><span class="tv">' + steps.length + '</span></div>' +
            '<div class="tile"><span class="tk">Stale</span><span class="tv">' + d.stale + '</span></div>' +
            '<div class="tile"><span class="tk">Dead</span><span class="tv">' + d.dead + '</span></div>' +
          '</div>' +
          '<p class="count">' + (bad === 0
            ? 'Everything has produced something recently.'
            : bad + ' step' + (bad === 1 ? '' : 's') + ' not producing. A flow can be broken for weeks ' +
              'and the only symptom is silence here.') +
          ' Checked ' + esc(new Date(d.checked_at).toLocaleTimeString()) + '.</p>' +
          '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
            '<th style="width:90px">State</th><th style="width:190px">Step</th><th>What it does</th>' +
            '<th style="width:110px">Last</th><th style="width:110px;text-align:right">Recent</th>' +
          '</tr></thead><tbody>' +
          steps.map(function (s) {
              var cls = s.status === 'OK' ? 'hot' : s.status === 'STALE' ? 'warm' : 'spam';
              return '<tr>' +
                '<td><span class="tag ' + cls + '">' + esc(s.status) + '</span></td>' +
                '<td>' + esc(s.step) + '</td>' +
                '<td class="count">' + esc(s.detail) + '</td>' +
                '<td>' + esc(fmtAge(s.age_mins)) + '</td>' +
                '<td style="text-align:right">' + esc(s.volume == null ? '—' : Number(s.volume).toLocaleString()) + '</td>' +
              '</tr>';
          }).join('') +
          '</tbody></table></div>' +

          // How good the extractor actually is. Not its own confidence, which
          // sat at 94 and never moved, but the score computed against the
          // original message plus how often a human had to step in.
          '<p class="count" style="margin-top:22px">Extraction accuracy · graded against the ' +
          'original WhatsApp message, not the model\'s opinion of itself</p>' +
          '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
            '<th style="width:180px">Model</th><th style="width:80px">Read</th>' +
            '<th style="width:80px">Trust</th><th style="width:90px">Solid</th>' +
            '<th style="width:90px">Weak</th><th style="width:80px">Ref</th>' +
            '<th style="width:80px">Price</th><th style="width:90px">Corrected</th>' +
            '<th style="width:80px">Speed</th>' +
          '</tr></thead><tbody>' +
          (d.scorecard || []).map(function (m) {
              var tcls = m.avg_trust >= 90 ? 'hot' : m.avg_trust >= 80 ? 'warm' : 'spam';
              return '<tr>' +
                '<td>' + esc(m.model) + (m.fixed_fields
                    ? '<div class="count">fixed: ' + esc(m.fixed_fields) + '</div>' : '') + '</td>' +
                '<td>' + Number(m.listings).toLocaleString() + '</td>' +
                '<td><span class="tag ' + tcls + '">' + esc(m.avg_trust) + '</span></td>' +
                '<td>' + esc(m.pct_solid) + '%</td>' +
                '<td>' + esc(m.pct_weak) + '%</td>' +
                '<td>' + esc(m.pct_reference) + '%</td>' +
                '<td>' + esc(m.pct_price) + '%</td>' +
                '<td>' + esc(m.pct_corrected) + '%</td>' +
                '<td>' + (m.avg_ms ? Math.round(m.avg_ms / 1000) + 's' : '—') + '</td>' +
              '</tr>';
          }).join('') +
          '</tbody></table></div>' +
          '<p class="count">Solid is 85+, weak is under 70. Corrected is the only real ground ' +
          'truth there is, so the more you fix in Wholesale the sharper this gets.</p>' +
          jobsHtml;

        var reqAll = view.querySelector('[data-requeue-all]');
        if (reqAll) reqAll.addEventListener('click', function () {
            if (!confirm('Requeue every failed job? Workers will re-run them all.')) return;
            var self = this;
            self.disabled = true; self.textContent = '…';
            A.adminFetchTo('/api/leads-admin', 'job-requeue-all', {})
                .then(function (r) { alert((r.requeued || 0) + ' jobs requeued'); renderHealth(); })
                .catch(function (e) { alert(e.message); self.disabled = false; self.textContent = 'Requeue all failed'; });
        });

        [].forEach.call(view.querySelectorAll('[data-requeue]'), function (b) {
            b.addEventListener('click', function () {
                var self = this;
                self.disabled = true; self.textContent = '…';
                A.adminFetchTo('/api/leads-admin', 'job-requeue', { job_id: Number(this.dataset.requeue) })
                    .then(function () { renderHealth(); })
                    .catch(function (e) { alert(e.message); self.disabled = false; self.textContent = 'Requeue'; });
            });
        });

        // Keep it live while he is looking at it, and stop the moment he is not.
        if (hlTimer) clearInterval(hlTimer);
        hlTimer = setInterval(function () {
            var on = document.querySelector('#tabs button[data-tab="health"][aria-selected="true"]');
            if (!on || document.hidden) { clearInterval(hlTimer); hlTimer = null; return; }
            renderHealth();
        }, 60000);
    }

    async function renderRetail() {
        var r = await A.adminFetchTo('/api/leads-admin', 'retail');
        RT.rows = r.rows || []; RT.bySource = r.bySource || []; RT.counters = r.counters || {};
        paintRetail();
    }

    var RTILES = [
        { k: '',        l: 'All products' },
        { k: 'ref',     l: 'With reference' },
        { k: 'compare', l: 'Comparable' },
        { k: 'under',   l: 'Under wholesale' },
        { k: 'over',    l: 'Room to quote' },
    ];
    var rtTile = '';

    // Comparable means the same watch can be found on both sides, which is the
    // only case where the margin means anything.
    function rtAfter(tile, q) {
        var needle = (q || '').trim().toLowerCase();
        return RT.rows.filter(function (r) {
            if (rtSource && r.source_slug !== rtSource) return false;
            if (tile === 'ref'     && !r.reference) return false;
            if (tile === 'compare' && r.margin_pct === undefined) return false;
            if (tile === 'under'   && !(r.margin_pct < 0)) return false;
            if (tile === 'over'    && !(r.margin_pct > 0)) return false;
            if (!needle) return true;
            return [r.title, r.reference, r.brand, r.source_slug].filter(Boolean)
                   .join(' ').toLowerCase().indexOf(needle) >= 0;
        });
    }

    function paintRetail() {
        var q = rtq.trim().toLowerCase();
        var rows = rtAfter(rtTile, q);
        var c = RT.counters;
        var shown = rows.slice(0, 400);

        view.innerHTML =
          // These were static numbers pretending to be buttons. They filter now.
          '<div class="tiles">' + RTILES.map(function (t) {
              return '<button class="tile" data-rtile="' + t.k + '" aria-pressed="' +
                (rtTile === t.k) + '"><span class="tk">' + esc(t.l) + '</span>' +
                '<span class="tv">' + rtAfter(t.k, '').length + '</span></button>';
          }).join('') +
            '<div class="tile"><span class="tk">Sources</span><span class="tv">' + (c.sources || 0) + '</span></div>' +
          '</div>' +

          // Source quality first: this is the honest answer to "can I trust this
          // price". A site that never states condition or contents can only ever
          // support a reference-only comparison, which is not quotable.
          '<p class="count">Coverage by source · a price is only usable for quoting when the ' +
          'reference, condition and contents are all stated</p>' +
          '<div class="tbl-wrap" style="margin-bottom:18px"><table class="leads"><thead><tr>' +
            '<th>Source</th><th style="width:90px">Products</th><th style="width:80px">Ref</th>' +
            '<th style="width:70px">Year</th><th style="width:100px">Condition</th>' +
            '<th style="width:100px">Contents</th><th style="width:90px"></th>' +
          '</tr></thead><tbody>' +
          RT.bySource.map(function (s) {
              var pct = function (n) { return s.products ? Math.round(100 * n / s.products) + '%' : '—'; };
              var usable = s.products ? Math.round(100 * s.with_set / s.products) : 0;
              return '<tr>' +
                '<td><div class="tname">' + esc(s.name) + '</div></td>' +
                '<td><span class="tmono">' + s.products + '</span></td>' +
                '<td><span class="tmono">' + pct(s.with_ref) + '</span></td>' +
                '<td><span class="tmono">' + pct(s.with_year) + '</span></td>' +
                '<td><span class="tmono">' + pct(s.with_condition) + '</span></td>' +
                '<td><span class="tmono">' + pct(s.with_set) + '</span></td>' +
                '<td>' + (usable > 0 ? '<span class="tag warm">usable</span>'
                                     : '<span class="tag spam">ref only</span>') + '</td>' +
              '</tr>';
          }).join('') +
          '</tbody></table></div>' +

          '<div class="bar">' +
            '<input id="rt-q" class="ctl grow" type="search" placeholder="SEARCH WATCH, REFERENCE, BRAND…" value="' + esc(rtq) + '">' +
            '<select id="rt-src" class="ctl"><option value="">ALL SOURCES</option>' +
              RT.bySource.map(function (s) {
                  return '<option value="' + esc(s.slug) + '"' + (rtSource === s.slug ? ' selected' : '') + '>' +
                         esc(s.name.toUpperCase()) + '</option>';
              }).join('') + '</select>' +
            '<button class="btn ghost" id="rt-refresh">Refresh</button>' +
          '</div>' +
          '<p class="count">' + rows.length + ' of ' + RT.rows.length +
            (rows.length > 400 ? ' · showing first 400' : '') + '</p>' +

          '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
            '<th style="width:56px"></th><th>Watch</th><th style="width:130px">Source</th>' +
            '<th style="width:110px">Retail</th><th style="width:150px">Spec</th>' +
            '<th style="width:130px">Wholesale</th><th style="width:110px">Spread</th>' +
            '<th style="width:70px"></th>' +
          '</tr></thead><tbody>' +
          (shown.length ? shown.map(function (r) {
              var sp = [r.year, r.condition ? r.condition.replace(/_/g,' ') : null,
                        r.set_completeness ? r.set_completeness.replace(/_/g,' ') : null]
                       .filter(Boolean).join(' · ');
              return '<tr>' +
                '<td>' + (r.image_url
                    ? '<img class="wthumb" src="' + esc(r.image_url) + '" alt="" loading="lazy" decoding="async">'
                    : '<span class="wthumb wthumb--none"></span>') + '</td>' +
                '<td><div class="tname">' + esc((r.title || '').slice(0, 72) || '—') + '</div>' +
                    '<div class="tsub">' + esc(r.reference || 'no reference') + '</div></td>' +
                '<td><span class="tsub">' + esc(r.source_slug) + '</span></td>' +
                '<td><span class="tmono">' + esc(money(r.price_usd)) + '</span>' +
                    (r.available === false ? '<div class="tsub">sold</div>' : '') + '</td>' +
                '<td>' + (sp ? '<span class="tsub">' + esc(sp) + '</span>'
                             : '<span class="tmono">not stated</span>') + '</td>' +
                // The whole point of holding retail data: what the same watch
                // costs from the groups, and therefore whether there is a trade.
                '<td>' + (r.margin_pct !== undefined
                    ? '<span class="tmono">' + esc(money(r.wholesale_median)) + '</span>' +
                      '<div class="count">' + esc(r.wholesale_basis) +
                        ' · ' + (r.wholesale_quotes || 0) + ' quotes</div>'
                    : (r.wholesale_median
                        ? '<span class="count">' + esc(r.not_comparable_why || 'not comparable') + '</span>'
                        : '<span class="tmono">no wholesale data</span>')) + '</td>' +
                '<td>' + (r.margin_pct !== undefined
                    ? '<span class="tag ' + (r.margin_pct >= 8 ? 'hot' : r.margin_pct > 0 ? 'warm' : 'spam') + '">' +
                        (r.margin_pct > 0 ? '+' : '') + esc(r.margin_pct) + '%</span>' +
                      '<div class="count">' + (r.margin_usd > 0 ? '+' : '') + esc(money(r.margin_usd)) + '</div>'
                    : '<span class="tmono">—</span>') + '</td>' +
                '<td>' + (r.url
                    ? '<a class="btn ghost" style="padding:3px 8px;font-size:10px" href="' + esc(r.url) +
                      '" target="_blank" rel="noopener">Open</a>' : '') + '</td>' +
              '</tr>';
          }).join('') : '<tr><td colspan="8" style="padding:28px 0"><span class="tmono">Nothing matches.</span></td></tr>') +
          '</tbody></table></div>';

        [].forEach.call(view.querySelectorAll('[data-rtile]'), function (b) {
            b.addEventListener('click', function () { rtTile = this.dataset.rtile; paintRetail(); });
        });

        var qi = document.getElementById('rt-q');
        if (qi) qi.addEventListener('input', function () {
            rtq = this.value; var p = this.selectionStart; paintRetail();
            var n = document.getElementById('rt-q');
            if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} }
        });
        var sel = document.getElementById('rt-src');
        if (sel) sel.addEventListener('change', function () { rtSource = this.value; paintRetail(); });
        var rf = document.getElementById('rt-refresh');
        if (rf) rf.addEventListener('click', function () {
            view.innerHTML = '<p class="count">Loading…</p>';
            renderRetail().catch(function (e) { view.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
        });
    }

    if (A.isAuthed()) boot();
})();
</script>
</body>
</html>
