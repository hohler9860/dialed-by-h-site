        document.getElementById('bk-exp-new').addEventListener('click', function () { editExpense(null); });
        document.getElementById('bk-csv').addEventListener('click', importBank);
        document.getElementById('bk-xlsx').addEventListener('click', bkExport);
        document.getElementById('bk-tax-toggle').addEventListener('click', function () {
            bkTaxOpen = !bkTaxOpen;
            try { localStorage.setItem('bk-tax-open', bkTaxOpen ? '1' : '0'); } catch (e) {}
            paintBooks();
        });
        document.getElementById('bk-reg-toggle').addEventListener('click', function () {
            bkRegOpen = !bkRegOpen;
            try { localStorage.setItem('bk-reg-open', bkRegOpen ? '1' : '0'); } catch (e) {}
            paintBooks();
        });

        bkCashChart(inRange);
        bkExpChart(inRange);
        bkDealChart(sold);
        bkSubs();
        bkCategories(inRange);
        bkRegister(inRange);
        bkTaxCalendar();
    }

    // Deadlines come from the API (lib/tax-calendar.js) so the tab and the
    // reminder email are reading one list. Cached for the tab visit.
    var BK_TAX = null;
    async function bkTaxCalendar() {
        var top = document.getElementById('bk-tax-top'), host = document.getElementById('bk-tax');
        if (!top) return;
        if (!BK_TAX) {
            try { BK_TAX = (await A.adminFetchTo('/api/leads-admin', 'tax-calendar')).items; }
            catch (e) { top.innerHTML = '<div class="t"><div class="w">Tax calendar</div><div class="n">Could not load: ' + esc(e.message) + '</div></div>'; return; }
        }
        var items = BK_TAX.filter(function (o) { return !o.chore; });
        var chores = BK_TAX.filter(function (o) { return o.chore; });
        var fmt = function (d) { return new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
        var fmtY = function (d) { return new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
        var tone = function (days) { return days <= 7 ? 'soon' : days <= 30 ? 'near' : 'far'; };
        var when = function (days) { return days === 0 ? 'Today' : days === 1 ? 'Tomorrow' : days + ' days'; };

        // Same-day items (federal + MA estimates) collapse into one tile so the
        // strip shows three different dates, not the same one twice.
        var byDate = {};
        items.forEach(function (o) { (byDate[o.date] = byDate[o.date] || []).push(o); });
        var dates = Object.keys(byDate).sort().slice(0, 3);
        var chore = chores[0];
        top.innerHTML = dates.map(function (d) {
            var g = byDate[d];
            return '<div class="t">' +
                '<div class="w">' + esc(fmtY(d)) + (g[0].placeholder ? ' · unconfirmed' : '') + '</div>' +
                '<div class="d ' + tone(g[0].days) + '">' + esc(when(g[0].days)) + '</div>' +
                '<div class="n">' + g.map(function (o) { return esc(o.title) + (o.label ? ' · ' + esc(o.label) : ''); }).join('<br>') + '</div>' +
                '<div class="w">' + esc(g[0].who) + (g.length > 1 ? ' + ' + (g.length - 1) + ' more' : '') + '</div>' +
            '</div>';
        }).join('') + (chore ? '<div class="t"><div class="w">Monthly chore · ' + esc(fmtY(chore.date)) + '</div>' +
            '<div class="d ' + tone(chore.days) + '">' + esc(when(chore.days)) + '</div>' +
            '<div class="n">' + esc(chore.title) + '</div><div class="w">keeps the register true</div></div>' : '');
        if (dates.length + (chore ? 1 : 0) === 4) top.style.gridTemplateColumns = 'repeat(4, 1fr)';

        if (!host) return;
        host.innerHTML = items.map(function (o) {
            return '<div class="bk-taxrow"><div class="l">' +
                '<div><b>' + esc(o.title) + '</b>' + (o.label ? ' <span class="tmono">' + esc(o.label) + '</span>' : '') +
                (o.placeholder ? ' <span class="tmono" style="color:#f59e0b">date unconfirmed</span>' : '') + '</div>' +
                '<div class="tmono">' + esc(o.who) + '</div>' +
                '<div class="bk-note">' + esc(o.note) + '</div></div>' +
                '<div class="rt"><b>' + esc(fmt(o.date)) + '</b><span style="color:var(--' + (o.days <= 7 ? 'r' : o.days <= 30 ? 'bkm' : 'g') + ')">' + esc(when(o.days).toLowerCase()) + '</span></div>' +
            '</div>';
        }).join('');
    }

    // Bank money grouped by the category column, biggest first. Clicking a
    // spend row scopes the register below to that category; clicking it again
    // clears the filter.
    function bkCategories(inRange) {
        var out = {}, inn = {};
        BOOKS.bank.forEach(function (t) {
            if (!inRange(t.posted_on)) return;
            var c = t.category || 'Uncategorized';
            if (bkNum(t.money_out)) { out[c] = out[c] || [0, 0]; out[c][0] += bkNum(t.money_out); out[c][1]++; }
            if (bkNum(t.money_in))  { inn[c] = inn[c] || [0, 0]; inn[c][0] += bkNum(t.money_in);  inn[c][1]++; }
        });
        var row = function (c, v, clickable, dir) {
            return '<div class="bk-cat-row' + (clickable && bkCat === c ? ' on' : '') + '"' +
                (clickable ? ' data-cat="' + esc(c) + '" style="cursor:pointer"' : '') + '>' +
                '<span class="bk-cat-n">' + esc(c) + '</span>' +
                '<span class="bk-cat-c">' + v[1] + '</span>' +
                '<span class="bk-cat-v ' + dir + '">' + bkMoney(v[0]) + '</span></div>';
        };
        var paint = function (host, data, clickable, dir) {
            var keys = Object.keys(data).sort(function (a, b) { return data[b][0] - data[a][0]; });
            var total = keys.reduce(function (s, k) { return s + data[k][0]; }, 0);
            host.innerHTML = keys.map(function (k) { return row(k, data[k], clickable, dir); }).join('') +
                '<div class="bk-cat-row" style="border-top:1px solid var(--line);font-weight:600">' +
                '<span class="bk-cat-n">Total</span><span class="bk-cat-c"></span>' +
                '<span class="bk-cat-v ' + dir + '">' + bkMoney(total) + '</span></div>';
        };
        paint(document.getElementById('bk-cats'), out, true, 'out');
        paint(document.getElementById('bk-cats-in'), inn, false, 'in');
        [].forEach.call(document.querySelectorAll('#bk-cats [data-cat]'), function (el) {
            el.addEventListener('click', function () {
                bkCat = (bkCat === this.dataset.cat) ? '' : this.dataset.cat;
                if (bkCat) bkRegOpen = true;
                paintBooks();
            });
        });
    }

    function bkRegister(inRange) {
        var rows = BOOKS.bank.filter(function (t) {
            if (!inRange(t.posted_on)) return false;
            if (bkCat && (t.category || 'Uncategorized') !== bkCat) return false;
            return true;
        }).sort(function (a, b) { return a.posted_on < b.posted_on ? 1 : -1; });
        var CAP = 500;
        document.getElementById('bk-reg-cap').textContent =
            rows.length + ' transaction' + (rows.length === 1 ? '' : 's') +
            (bkCat ? ' in ' + bkCat + ' — click the category again to clear' : '') +
            (rows.length > CAP ? ' · showing the newest ' + CAP : '');
        document.getElementById('bk-register').innerHTML =
            '<table class="leads"><thead><tr><th>Date</th><th>Description</th><th>Category</th>' +
            '<th style="text-align:right">In</th><th style="text-align:right">Out</th></tr></thead><tbody>' +
            rows.slice(0, CAP).map(function (t) {
                return '<tr><td class="tmono">' + esc(t.posted_on) + '</td>' +
                    '<td>' + esc(t.description || '') +
                        (t.logged_as ? '<div class="tsub">' + esc(t.logged_as) + '</div>' : '') + '</td>' +
                    '<td class="tmono">' + esc(t.category || '—') + '</td>' +
                    '<td class="tmono in" style="text-align:right">' + (bkNum(t.money_in) ? bkMoney(t.money_in) : '') + '</td>' +
                    '<td class="tmono out" style="text-align:right">' + (bkNum(t.money_out) ? bkMoney(t.money_out) : '') + '</td></tr>';
            }).join('') + '</tbody></table>';
    }

    // Hover is an enhancement only — every value here is also readable from the
    // deals table below, so nothing is gated behind a tooltip.
    function bkTip(host, tip, nodes, html, w) {
        [].forEach.call(nodes, function (h) {
            h.addEventListener('mousemove', function (e) {
                var b = host.getBoundingClientRect();
                tip.innerHTML = html(+h.dataset.i);
                tip.style.opacity = 1;
                tip.style.left = Math.min(e.clientX - b.left + 14, Math.max(b.width - w, 0)) + 'px';
                tip.style.top = (e.clientY - b.top - 10) + 'px';
            });
            h.addEventListener('mouseleave', function () { tip.style.opacity = 0; });
        });
    }

    // A bar is a rounded data-end anchored to the baseline, not a rounded box.
    function bkBar(x, y, w, h, r) {
        if (h <= 0.5) return '';
        r = Math.min(r, w / 2, h);
        return 'M' + x + ' ' + (y + h) + ' V' + (y + r) + ' a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + (-r) +
               ' h' + (w - 2 * r) + ' a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r + ' V' + (y + h) + ' Z';
    }

    function bkCashChart(inRange) {
        var host = document.getElementById('bk-cash'), tip = document.getElementById('bk-cash-t');
        var by = {};
        BOOKS.bank.forEach(function (t) {
            if (!inRange(t.posted_on)) return;
            var m = t.posted_on.slice(0, 7);
            if (!by[m]) by[m] = [0, 0];
            by[m][0] += bkNum(t.money_in);
            by[m][1] += bkNum(t.money_out);
        });
        var rows = Object.keys(by).sort().map(function (m) { return [m, by[m][0], by[m][1]]; });
        if (!rows.length) {
            host.innerHTML = '<p class="bk-empty">No movement in this period</p>';
            host.appendChild(tip); return;
        }
        var W = 560, H = 210, padL = 46, padB = 26, padT = 8;
        var max = Math.max.apply(null, rows.map(function (r) { return Math.max(r[1], r[2]); })) || 1;
        // Round the axis to a step a human would pick, so the ticks read
        // $15K/$30K/$45K rather than $13K/$25K/$38K.
        var raw = max / 4;
        var mag = Math.pow(10, Math.floor(Math.log10(raw)));
        var mult = [1, 1.5, 2, 2.5, 3, 4, 5, 7.5, 10].filter(function (m) { return m * mag >= raw; })[0];
        var nice = mult * mag * 4;
        var pw = W - padL, ph = H - padB - padT;
        var step = pw / rows.length, bw = Math.min(20, (step - 14) / 2);
        var y = function (v) { return padT + ph - (v / nice) * ph; };

        var g = '';
        for (var i = 0; i <= 4; i++) {
            var v = nice * i / 4;
            g += '<line class="bk-gl" x1="' + padL + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
                 '<text class="bk-tick" x="' + (padL - 9) + '" y="' + (y(v) + 3.5) + '" text-anchor="end">' +
                 (i ? bkCompact(v) : '$0') + '</text>';
        }
        var bars = '', hits = '';
        rows.forEach(function (r, i) {
            var cx = padL + step * i + step / 2;
            bars += '<path d="' + bkBar(cx - bw - 1, y(r[1]), bw, padT + ph - y(r[1]), 4) + '" fill="var(--s1)"/>' +
                    '<path d="' + bkBar(cx + 1, y(r[2]), bw, padT + ph - y(r[2]), 4) + '" fill="var(--s2)"/>' +
                    '<text class="bk-tick" x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' +
                    BK_MON[+r[0].slice(5, 7) - 1] + '</text>';
            hits += '<rect class="bk-hit" x="' + (padL + step * i) + '" y="' + padT + '" width="' + step +
                    '" height="' + ph + '" data-i="' + i + '"/>';
        });
        host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
            'aria-label="Cash in and cash out by month">' + g +
            '<line class="bk-base" x1="' + padL + '" x2="' + W + '" y1="' + (padT + ph) + '" y2="' + (padT + ph) + '"/>' +
            bars + hits + '</svg>';
        host.appendChild(tip);
        bkTip(host, tip, host.querySelectorAll('.bk-hit'), function (i) {
            var r = rows[i];
            return '<b>' + BK_MON[+r[0].slice(5, 7) - 1] + ' ' + r[0].slice(0, 4) + '</b><br>' +
                'In &nbsp;' + bkMoney(r[1], 2) + '<br>Out ' + bkMoney(r[2], 2) +
                '<br>Net ' + bkMoney(r[1] - r[2], 2);
        }, 150);
    }

    function bkExpChart(inRange) {
        var host = document.getElementById('bk-exp'), tip = document.getElementById('bk-exp-t');
        var agg = {};
        BOOKS.expenses.forEach(function (e) {
            if (!inRange(e.spent_on)) return;
            var c = e.category || 'Other';
            agg[c] = (agg[c] || 0) + bkNum(e.amount);
        });
        var rows = Object.keys(agg).map(function (k) { return [k, agg[k]]; })
            .sort(function (a, b) { return b[1] - a[1]; });
        if (!rows.length) {
            host.innerHTML = '<p class="bk-empty">No overhead in this period</p>';
            host.appendChild(tip); return;
        }
        var total = rows.reduce(function (s, r) { return s + r[1]; }, 0);
        // One hue for every bar: these categories have no natural order, so
        // shading them by size would double-encode length as colour.
        var W = 420, rh = 27, H = rows.length * rh + 6, labW = 150, barW = W - labW - 66;
        var max = rows[0][1];
        var out = '', hits = '';
        rows.forEach(function (r, i) {
            var w = Math.max((r[1] / max) * barW, 2), y0 = i * rh + 4;
            out += '<text class="bk-dlab" x="0" y="' + (y0 + 13) + '">' +
                        esc(r[0].length > 19 ? r[0].slice(0, 18) + '…' : r[0]) + '</text>' +
                   '<rect x="' + labW + '" y="' + (y0 + 3) + '" width="' + w + '" height="13" rx="4" fill="var(--s2)"/>' +
                   '<text class="bk-dsub" x="' + (labW + w + 9) + '" y="' + (y0 + 13.5) + '">' + bkMoney(r[1]) + '</text>';
            hits += '<rect class="bk-hit" x="0" y="' + y0 + '" width="' + W + '" height="' + rh + '" data-i="' + i + '"/>';
        });
        host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Expenses by category">' +
            out + hits + '</svg>';
        host.appendChild(tip);
        bkTip(host, tip, host.querySelectorAll('.bk-hit'), function (i) {
            var r = rows[i];
            return '<b>' + esc(r[0]) + '</b><br>' + bkMoney(r[1], 2) + ' &middot; ' +
                bkPct(r[1] / total) + ' of overhead<br>click to open';
        }, 190);
        [].forEach.call(host.querySelectorAll('.bk-hit'), function (h) {
            h.style.cursor = 'pointer';
            h.addEventListener('click', function () { openCategory(rows[+h.dataset.i][0], inRange); });
        });
    }

    // Drilling into a bar is the only way to reach an existing expense for editing,
    // so the chart is a navigation surface here, not just a picture.
    function openCategory(cat, inRange) {
        var rows = BOOKS.expenses.filter(function (e) {
            return (e.category || 'Other') === cat && inRange(e.spent_on);
        }).sort(function (a, b) { return String(b.spent_on).localeCompare(String(a.spent_on)); });

        sheetInner.innerHTML =
            '<div class="bar" style="justify-content:space-between">' +
              '<button class="btn ghost" id="s-close">← Back</button>' +
              '<button class="btn" id="s-new">Log Expense</button>' +
            '</div>' +
            '<h2>' + esc(cat) + '</h2>' +
            '<p class="note">' + rows.length + ' item' + (rows.length === 1 ? '' : 's') + ' &middot; ' +
                bkMoney(rows.reduce(function (s, e) { return s + bkNum(e.amount); }, 0), 2) +
                ' &middot; tap one to edit</p>' +
            '<div class="tbl-wrap" style="margin-top:20px"><table class="bk-tbl"><tbody>' +
            rows.map(function (e) {
                return '<tr data-id="' + esc(e.id) + '" style="cursor:pointer">' +
                    '<td>' + esc(e.spent_on) + '</td>' +
                    '<td class="nm">' + esc(e.description || e.vendor || '') + '</td>' +
                    '<td class="bk-mute">' + esc(e.vendor || '') + '</td>' +
                    '<td class="n">' + bkMoney(bkNum(e.amount), 2) + '</td></tr>';
            }).join('') + '</tbody></table></div>' +
            '<p class="err hidden" id="s-err"></p>';

        sheet.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        document.getElementById('s-close').addEventListener('click', closeSheet);
        document.getElementById('s-new').addEventListener('click', function () { editExpense(null); });
        [].forEach.call(sheetInner.querySelectorAll('tbody tr'), function (tr) {
            tr.addEventListener('click', function () {
                var e = BOOKS.expenses.filter(function (x) { return x.id === tr.dataset.id; })[0];
                if (e) editExpense(e);
            });
        });
    }

    function bkDealChart(sold) {
        var host = document.getElementById('bk-deal'), tip = document.getElementById('bk-deal-t');
        var rows = sold.slice().sort(function (a, b) { return bkProfit(b) - bkProfit(a); });
        if (!rows.length) {
            host.innerHTML = '<p class="bk-empty">No sales in this period</p>';
            host.appendChild(tip); return;
        }
        var W = 520, rh = 44, H = rows.length * rh + 4, labW = 190, barW = W - labW - 84;
        var max = Math.max.apply(null, rows.map(function (d) { return Math.abs(bkProfit(d)); })) || 1;
        var out = '', hits = '';
        rows.forEach(function (d, i) {
            var p = bkProfit(d), w = Math.max((Math.abs(p) / max) * barW, 2), y0 = i * rh + 6;
            var model = (d.brand ? d.brand + ' ' : '') + (d.model || d.ref);
            out += '<text class="bk-dlab" x="0" y="' + (y0 + 13) + '">' +
                        esc(model.length > 25 ? model.slice(0, 24) + '…' : model) + '</text>' +
                   '<text class="bk-dsub" x="0" y="' + (y0 + 27) + '">' + esc(d.reference || '') +
                        ' &middot; ' + bkDays(d.date_bought, d.date_sold) + 'd held</text>' +
                   '<rect x="' + labW + '" y="' + (y0 + 7) + '" width="' + w + '" height="14" rx="4" fill="' +
                        (p < 0 ? 'var(--bad)' : 'var(--ok)') + '"/>' +
                   '<text class="bk-dlab" x="' + (labW + w + 10) + '" y="' + (y0 + 18) + '">' + bkMoney(p, 2) + '</text>' +
                   '<text class="bk-dsub" x="' + (labW + w + 10) + '" y="' + (y0 + 31) + '">' +
                        bkPct(bkMargin(d)) + ' margin</text>';
            hits += '<rect class="bk-hit" x="0" y="' + (i * rh) + '" width="' + W + '" height="' + rh + '" data-i="' + i + '"/>';
        });
        host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Profit per deal">' +
            out + hits + '</svg>';
        host.appendChild(tip);
        bkTip(host, tip, host.querySelectorAll('.bk-hit'), function (i) {
            var d = rows[i];
            return '<b>' + esc(d.ref) + '</b><br>' +
                'Bought ' + bkMoney(bkNum(d.buy_total), 2) +
                    (bkNum(d.other_costs) ? ' &middot; costs ' + bkMoney(bkNum(d.other_costs), 2) : '') + '<br>' +
                'Sold &nbsp;&nbsp;' + bkMoney(bkNum(d.sell_total), 2) +
                    (d.buyer ? ' to ' + esc(d.buyer) : '') + '<br>' +
                'Profit ' + bkMoney(bkProfit(d), 2) + ' (' + bkPct(bkMargin(d)) + ')';
        }, 240);
    }

    var BK_DISP = {
        Keep: ['var(--ok)', 'Keep'],
        Review: ['var(--warn)', 'Review'],
        Kill: ['var(--bad)', 'Kill']
    };
    function bkSubs() {
        var rows = BOOKS.subscriptions.slice()
            .sort(function (a, b) { return bkNum(b.monthly_cost) - bkNum(a.monthly_cost); });
        var live = rows.filter(function (s) { return s.status !== 'Cancel'; });
        var active = live.reduce(function (s, r) { return s + bkNum(r.monthly_cost); }, 0);
        var atRisk = live.filter(function (s) { return s.disposition === 'Review'; })
            .reduce(function (s, r) { return s + bkNum(r.monthly_cost); }, 0);
        document.getElementById('bk-subs').innerHTML =
            rows.map(function (s) {
                var d = BK_DISP[s.disposition] || BK_DISP.Review;
                var dead = s.status === 'Cancel';
                var now = dead ? 'Cancelled' : d[1];
                return '<div class="bk-sub' + (dead ? ' dead' : '') + '">' +
                    '<span class="nm">' + esc(s.name) + '</span>' +
                    '<i class="bk-dot" style="width:7px;height:7px;display:block;background:' +
                        (dead ? 'var(--l3)' : d[0]) + '"></i>' +
                    '<select class="stat" data-id="' + esc(s.id) + '" style="color:' +
                        (dead ? 'var(--l3)' : d[0]) + '">' +
                        ['Keep', 'Review', 'Kill', 'Cancelled'].map(function (o) {
                            return '<option' + (o === now ? ' selected' : '') + '>' + o + '</option>';
                        }).join('') +
                    '</select>' +
                    '<span class="amt">' + bkMoney(bkNum(s.monthly_cost), 2) + '</span></div>';
            }).join('') +
            '<div class="bk-foot"><span>Active / month</span>' +
                '<span class="bk-burn">' + bkMoney(active, 2) + '</span></div>' +
            (atRisk ? '<div class="bk-foot" style="padding-top:6px"><span>Flagged for review</span>' +
                '<span style="color:var(--warn)">' + bkMoney(atRisk, 2) + '/mo</span></div>' : '');

        // Cancelling here is what moves a tool out of the active burn total, so
        // the number at the bottom stays honest without a second place to edit.
        [].forEach.call(document.querySelectorAll('#bk-subs select'), function (sel) {
            sel.addEventListener('change', async function () {
                var v = sel.value;
                sel.disabled = true;
                try {
                    await A.adminFetchTo('/api/leads-admin', 'books-set-sub', {
                        id: sel.dataset.id,
                        sub: v === 'Cancelled'
                            ? { status: 'Cancel', disposition: 'Kill' }
                            : { status: 'Active', disposition: v }
                    });
                    BOOKS = await A.adminFetchTo('/api/leads-admin', 'books');
                    paintBooks();
                } catch (e) {
                    sel.disabled = false;
                    alert(e.message || 'Could not save');
                }
            });
        });
    }

    // ══════════════════════════════════════════════════════════
    // DEALS
    // ══════════════════════════════════════════════════════════
    // The ledger itself, split out of Books so the dashboard stays a dashboard.
    // Shares the same fetched payload — switching tabs does not re-hit the API.
    var dealFilter = 'all';
    var dealQuery = '';

    async function renderDeals() {
        if (!BOOKS) BOOKS = await A.adminFetchTo('/api/leads-admin', 'books');
        paintDeals();
    }

    function paintDeals() {
        var q = dealQuery.trim().toLowerCase();
        var rows = BOOKS.deals.filter(function (d) {
            if (dealFilter === 'stock' && d.sell_total != null) return false;
            if (dealFilter === 'sold' && d.sell_total == null) return false;
            if (!q) return true;
            return [d.ref, d.brand, d.model, d.reference, d.serial, d.buyer, d.source_seller, d.notes]
                .join(' ').toLowerCase().indexOf(q) !== -1;
        }).sort(function (a, b) {
            return String(b.date_bought || '').localeCompare(String(a.date_bought || ''));
        });

        var sold = rows.filter(function (d) { return d.sell_total != null; });
        var rev = sold.reduce(function (s, d) { return s + bkNum(d.sell_total); }, 0);
        var gp = sold.reduce(function (s, d) { return s + bkProfit(d); }, 0);
        var tied = rows.filter(function (d) { return d.sell_total == null; })
            .reduce(function (s, d) { return s + bkNum(d.buy_total) + bkNum(d.other_costs); }, 0);

        view.innerHTML =
            '<div class="bar">' +
                '<input class="ctl grow" id="deal-q" placeholder="SEARCH REF, MODEL, SERIAL, BUYER" value="' +
                    esc(dealQuery) + '">' +
                ['all', 'stock', 'sold'].map(function (f) {
                    var label = f === 'all' ? 'All' : f === 'stock' ? 'In stock' : 'Sold';
                    return '<button class="bk-seg" data-f="' + f + '" aria-pressed="' +
                        (dealFilter === f) + '">' + label + '</button>';
                }).join('') +
                '<button class="btn" id="deal-new">+ New Deal</button>' +
            '</div>' +
            '<p class="count">' + rows.length + ' deal' + (rows.length === 1 ? '' : 's') +
                ' &middot; ' + sold.length + ' sold ' + bkMoney(rev) +
                ' &middot; profit ' + bkMoney(gp, 2) +
                (tied ? ' &middot; ' + bkMoney(tied) + ' tied up in stock' : '') + '</p>' +
            '<div class="tbl-wrap"><table class="bk-tbl" id="bk-deals"></table></div>';

        var input = document.getElementById('deal-q');
        input.addEventListener('input', function () {
            dealQuery = input.value;
            var pos = input.selectionStart;
            paintDeals();
            var next = document.getElementById('deal-q');
            next.focus();
            try { next.setSelectionRange(pos, pos); } catch (e) {}
        });
        [].forEach.call(view.querySelectorAll('.bk-seg'), function (b) {
            b.addEventListener('click', function () { dealFilter = b.dataset.f; paintDeals(); });
        });
        document.getElementById('deal-new').addEventListener('click', function () { editDeal(null); });

        bkDealTable(rows);
    }

    function bkDealTable(rows) {
        var head = ['Ref', 'Piece', 'Reference', 'Serial', 'Bought', 'Sold', 'Held',
                    'Cost', 'Sell', 'Profit', 'Margin', 'Buyer'];
        var nums = { 7: 1, 8: 1, 9: 1, 10: 1 };
        var dash = '<span class="bk-mute">—</span>';
        document.getElementById('bk-deals').innerHTML =
            '<thead><tr>' + head.map(function (h, i) {
                return '<th class="' + (nums[i] ? 'n' : '') + '">' + h + '</th>';
            }).join('') + '</tr></thead><tbody>' +
            rows.map(function (d) {
                var p = bkProfit(d);
                var ndocs = (BOOKS.docs || []).filter(function (x) { return x.deal_id === d.id; }).length;
                return '<tr data-id="' + esc(d.id) + '"><td>' + esc(d.ref) +
                    (ndocs ? ' <span class="bk-mute" title="' + ndocs + ' attached">&#128206;' + ndocs + '</span>' : '') + '</td>' +
                    '<td class="nm">' + esc((d.brand ? d.brand + ' ' : '') + (d.model || '')) + '</td>' +
                    '<td class="bk-mute">' + esc(d.reference || '') + '</td>' +
                    '<td class="bk-mute">' + esc(d.serial || '') + '</td>' +
                    '<td>' + esc(d.date_bought || '') + '</td>' +
                    '<td>' + (d.date_sold ? esc(d.date_sold) : dash) + '</td>' +
                    '<td>' + (d.date_sold ? bkDays(d.date_bought, d.date_sold) + 'd' : dash) + '</td>' +
                    '<td class="n">' + bkMoney(bkNum(d.buy_total) + bkNum(d.other_costs), 2) + '</td>' +
                    '<td class="n">' + (d.sell_total != null ? bkMoney(bkNum(d.sell_total), 2) : dash) + '</td>' +
                    '<td class="n"' + (p !== null && p < 0 ? ' style="color:var(--bad)"' : '') + '>' +
                        (p !== null ? bkMoney(p, 2) : dash) + '</td>' +
                    '<td class="n">' + (bkMargin(d) !== null ? bkPct(bkMargin(d)) : dash) + '</td>' +
                    '<td class="who" title="' + esc(d.buyer || '') + '">' + esc(d.buyer || '') + '</td></tr>';
            }).join('') + '</tbody>';

        [].forEach.call(document.querySelectorAll('#bk-deals tbody tr'), function (tr) {
            tr.style.cursor = 'pointer';
            tr.addEventListener('click', function () {
                var d = BOOKS.deals.filter(function (x) { return x.id === tr.dataset.id; })[0];
                if (d) editDeal(d);
            });
        });
    }

    // ══════════════════════════════════════════════════════════
    // BOOKS / DEALS — writes
    // ══════════════════════════════════════════════════════════
    // Everything here posts through the same auth'd endpoint and then refetches,
    // so what you see after a save is what the database actually holds rather
    // than an optimistic guess at it.
    function bkToday() { return new Date().toISOString().slice(0, 10); }

    function bkFields(defs, v) {
        return '<div class="fields">' + defs.map(function (f) {
            var val = v[f[0]] == null ? '' : v[f[0]];
            return '<div class="field ' + (f[2] || '') + '">' +
                '<label for="f-' + f[0] + '">' + esc(f[1]) + '</label>' +
                (f[3] === 'area'
                    ? '<textarea id="f-' + f[0] + '" rows="3">' + esc(val) + '</textarea>'
                    : '<input id="f-' + f[0] + '" value="' + esc(val) + '"' +
                      (f[3] ? ' placeholder="' + esc(f[3]) + '"' : '') + '>') +
            '</div>';
        }).join('') + '</div>';
    }
    function bkRead(defs) {
        var out = {};
        defs.forEach(function (f) { out[f[0]] = document.getElementById('f-' + f[0]).value; });
        return out;
    }

    var DEAL_FORM = [
        ['ref', 'Ref #', '', 'leave blank to auto-number'], ['status', 'Status', '', 'In Stock / Sold'],
        ['brand', 'Brand'], ['model', 'Model'],
        ['reference', 'Reference'], ['serial', 'Serial'],
        ['year', 'Year'], ['condition', 'Condition'],
        ['box', 'Box', '', 'Yes / No'], ['papers', 'Papers', '', 'Yes / No'],
        ['date_bought', 'Date bought', '', 'YYYY-MM-DD'],
        ['date_sold', 'Date sold', '', 'YYYY-MM-DD'],
        ['buy_total', 'Buy total'], ['other_costs', 'Other costs'],
        ['sell_total', 'Sell total'],
        ['source_seller', 'Source (seller)', 'wide'], ['buyer', 'Buyer', 'wide'],
        ['payment_in', 'Payment in', 'wide'], ['payment_out', 'Payment out', 'wide'],
        ['docs', 'Docs?', '', 'Yes / No'],
        ['notes', 'Notes', 'wide', 'area']
    ];

    function editDeal(d) {
        var isNew = !d;
        var v = d || { status: 'In Stock', brand: 'Rolex', date_bought: bkToday(), other_costs: 0 };
        // Booleans come back from Postgres as true/false; the form speaks Yes/No.
        var form = {};
        DEAL_FORM.forEach(function (f) {
            var val = v[f[0]];
            form[f[0]] = typeof val === 'boolean' ? (val ? 'Yes' : 'No') : val;
        });

        sheetInner.innerHTML =
            '<div class="bar" style="justify-content:space-between">' +
              '<button class="btn ghost" id="s-close">← Back</button>' +
              '<div style="display:flex;gap:8px">' +
                (isNew ? '' : '<button class="btn danger" id="s-del">Delete</button>') +
                (isNew || v.sell_total != null ? '' : '<button class="btn ghost" id="s-sold">Mark sold today</button>') +
                '<button class="btn" id="s-save">Save</button>' +
              '</div>' +
            '</div>' +
            '<h2>' + (isNew ? 'New Deal' : esc(v.ref)) + '</h2>' +
            '<p class="note">Profit and margin are worked out from these numbers, not typed in.' +
                (isNew ? ' The ref number is minted when you save.' : '') + '</p>' +
            bkFields(DEAL_FORM, form) +
            (isNew
                ? '<p class="note" style="margin-top:24px">Save the deal first, then contracts and invoices can be attached here.</p>'
                : '<div id="deal-docs" style="margin-top:28px"></div>') +
            '<p class="err hidden" id="s-err"></p>';

        sheet.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        if (!isNew) paintDealDocs(d);
        document.getElementById('s-close').addEventListener('click', closeSheet);
        document.getElementById('s-save').addEventListener('click', function () { saveDeal(d); });
        var del = document.getElementById('s-del');
        if (del) del.addEventListener('click', function () { deleteBook('deal', d); });
        var ms = document.getElementById('s-sold');
        if (ms) ms.addEventListener('click', function () {
            document.getElementById('f-status').value = 'Sold';
            if (!document.getElementById('f-date_sold').value) {
                document.getElementById('f-date_sold').value = bkToday();
            }
            document.getElementById('f-sell_total').focus();
        });
    }

    // ── deal attachments: contracts, invoices ───────────────────
    // Files go straight from the browser to Supabase storage on a one-shot
    // signed URL the API hands out, so a 10MB contract never squeezes
    // through the Vercel function.
    function paintDealDocs(d) {
        var box = document.getElementById('deal-docs');
        if (!box) return;
        var docs = (BOOKS.docs || []).filter(function (x) { return x.deal_id === d.id; });
        box.innerHTML =
            '<label style="display:block;margin-bottom:10px">Attachments</label>' +
            (docs.length
                ? '<table class="bk-tbl" style="margin-bottom:14px"><tbody>' + docs.map(function (x) {
                    return '<tr><td style="width:90px"><span class="tag">' + esc(x.kind.toUpperCase()) + '</span></td>' +
                        '<td><a href="#" class="js-doc-open" data-path="' + esc(x.path) + '">' + esc(x.filename) + '</a></td>' +
                        '<td class="bk-mute" style="width:110px">' + esc((x.uploaded_at || '').slice(0, 10)) + '</td>' +
                        '<td style="width:34px;text-align:right"><a href="#" class="js-doc-del" data-id="' + esc(x.id) + '" data-path="' + esc(x.path) + '" title="Delete">&#10005;</a></td></tr>';
                }).join('') + '</tbody></table>'
                : '<p class="note">Nothing attached yet.</p>') +
            '<div class="bar">' +
                '<select id="doc-kind" class="ctl"><option value="contract">CONTRACT</option>' +
                    '<option value="invoice">INVOICE</option><option value="other">OTHER</option></select>' +
                '<button class="btn ghost" id="doc-add">Attach file&hellip;</button>' +
                '<input id="doc-file" type="file" multiple style="display:none" ' +
                    'accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.doc,.docx,.csv">' +
                '<span class="note" id="doc-status"></span>' +
            '</div>';

        [].forEach.call(box.querySelectorAll('.js-doc-open'), function (a) {
            a.addEventListener('click', async function (e) {
                e.preventDefault();
                try {
                    var r = await A.adminFetchTo('/api/leads-admin', 'books-doc-url', { path: a.dataset.path });
                    window.open(r.url, '_blank', 'noopener');
                } catch (err) { alert(err.message || 'Could not open file'); }
            });
        });
        [].forEach.call(box.querySelectorAll('.js-doc-del'), function (a) {
            a.addEventListener('click', async function (e) {
                e.preventDefault();
                if (!confirm('Delete this file? This cannot be undone.')) return;
                try {
                    await A.adminFetchTo('/api/leads-admin', 'books-doc-delete',
                        { id: a.dataset.id, path: a.dataset.path });
                    BOOKS.docs = (BOOKS.docs || []).filter(function (x) { return x.id !== a.dataset.id; });
                    paintDealDocs(d);
                } catch (err) { alert(err.message || 'Delete failed'); }
            });
        });

        var file = document.getElementById('doc-file');
        document.getElementById('doc-add').addEventListener('click', function () { file.click(); });
        file.addEventListener('change', async function () {
            var kind = document.getElementById('doc-kind').value;
            var status = document.getElementById('doc-status');
            var files = [].slice.call(file.files);
            for (var i = 0; i < files.length; i++) {
                var f = files[i];
                status.textContent = 'Uploading ' + f.name + '…';
                try {
                    var sign = await A.adminFetchTo('/api/leads-admin', 'books-doc-sign-upload',
                        { deal_id: d.id, filename: f.name });
                    var put = await fetch(sign.uploadUrl, {
                        method: 'PUT',
                        headers: { 'Content-Type': f.type || 'application/octet-stream' },
                        body: f
                    });
                    if (!put.ok) throw new Error('Upload failed (' + put.status + ')');
                    var rec = await A.adminFetchTo('/api/leads-admin', 'books-doc-record', {
                        doc: { deal_id: d.id, kind: kind, filename: f.name, path: sign.path,
                               mime: f.type || null, size_bytes: f.size }
                    });
                    BOOKS.docs = [rec.doc].concat(BOOKS.docs || []);
                } catch (err) {
                    alert(f.name + ': ' + (err.message || 'upload failed'));
                }
            }
            paintDealDocs(d);
        });
    }

    async function saveDeal(d) {
        var btn = document.getElementById('s-save');
        btn.disabled = true;
        try {
            await A.adminFetchTo('/api/leads-admin', 'books-save-deal',
                { id: d ? d.id : null, deal: bkRead(DEAL_FORM) });
            await bkRefresh('deals');
        } catch (e) {
            sheetErr(e.message || 'Save failed');
            btn.disabled = false;
        }
    }

    // ── Export for investors ────────────────────────────────────
    // One .xlsx with the same numbers the dashboard shows, scoped to the
    // selected period, laid out the way someone outside the business reads
    // them: summary first, then the ledgers that back it. Built in the browser
    // from BOOKS so it can never disagree with the tiles. SheetJS is fetched on
    // first click so the admin page does not carry it for everyone else.
    function bkLoadXlsx() {
        if (window.XLSX && window.XLSX.__styled) return Promise.resolve(window.XLSX);
        return new Promise(function (ok, bad) {
            var el = document.createElement('script');
            // xlsx-js-style = SheetJS community build plus cell styling (fonts,
            // fills, borders), which the plain build silently drops.
            el.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
            el.onload = function () { window.XLSX.__styled = true; ok(window.XLSX); };
            el.onerror = function () { bad(new Error('Could not load the spreadsheet library')); };
            document.head.appendChild(el);
        });
    }

    // One visual system for every sheet: dark header band, light rules, money

    var BK_XS = {

        label:   { font: { name: 'Arial', sz: 10, color: { rgb: '444444' } } },

        bigNeg:  { font: { name: 'Arial', sz: 14, bold: true, color: { rgb: 'B00020' } },

    BK_XS.headR = Object.assign({}, BK_XS.head, { alignment: { horizontal: 'right', vertical: 'center' } });

    function bkBuildWorkbook(XLSX, B, period) {
        var cut = bkCutoff();

        var label = period === 'all' ? 'All time' : period === '90' ? 'Last 90 days' : 'This month';
        var today = new Date().toISOString().slice(0, 10);

        var M = function (v) { return { v: n(v), t: 'n', s: BK_XS.money }; };
        var P = function (v) { return v == null ? { v: '', s: BK_XS.cell } : { v: v, t: 'n', s: BK_XS.pct }; };
        var T = function (v) { return { v: v == null ? '' : v, s: BK_XS.cell }; };
        var H = function (v, right) { return { v: v, s: right ? BK_XS.headR : BK_XS.head }; };

            if (kind === 'pct') { st.numFmt = '0.0%'; st.alignment = { horizontal: 'right' }; return v == null ? { v: '', s: st } : { v: v, t: 'n', s: st }; }
            return { v: v == null ? '' : v, s: st };
        };
        var blank = [];

        var deals = B.deals.slice();
        var sold = deals.filter(function (d) { return d.sell_total != null && inRange(d.date_sold); })

        var bank = B.bank.filter(function (t) { return inRange(t.posted_on); })
            .sort(function (a, b) { return a.posted_on < b.posted_on ? -1 : 1; });

        var rev = sold.reduce(function (s, d) { return s + n(d.sell_total); }, 0);
        var cogs = sold.reduce(function (s, d) { return s + n(d.buy_total) + n(d.other_costs); }, 0);
        var gp = rev - cogs;
        var opex = exp.reduce(function (s, e) { return s + n(e.amount); }, 0);

        var liveSubs = B.subscriptions.filter(function (x) { return x.status !== 'Cancel'; });

        var byCat = {};
        exp.forEach(function (e) { var c = e.category || 'Uncategorized'; byCat[c] = (byCat[c] || 0) + n(e.amount); });
        var cats = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; });

        // ── Summary ──
        var big = function (v) { return { v: v, t: 'n', s: v < 0 ? BK_XS.bigNeg : BK_XS.big }; };
        var S = [

            [{ v: 'Cash on hand', s: BK_XS.label }, big(n(B.cash)), { v: 'bank balance today, all time', s: BK_XS.sub }],
            [{ v: 'Inventory at cost', s: BK_XS.label }, big(stock), { v: held.length + ' piece' + (held.length === 1 ? '' : 's') + ' held', s: BK_XS.sub }],
            [{ v: 'Capital contributed', s: BK_XS.label }, big(capIn), { v: 'owner and trust money in, net', s: BK_XS.sub }],
            [{ v: 'Recurring tools / month', s: BK_XS.label }, big(burn), { v: liveSubs.length + ' active subscriptions', s: BK_XS.sub }],
            [{ v: 'Average days to sell', s: BK_XS.label }, { v: avgDays == null ? '—' : avgDays, s: Object.assign({}, BK_XS.big, { numFmt: '0' }) }, { v: 'bought to sold', s: BK_XS.sub }],
            blank,
            [{ v: 'Profit & loss', s: BK_XS.section }, { v: '', s: BK_XS.section }, { v: '', s: BK_XS.section }],
            [T('Watch sales'), M(rev)],
            [T('Cost of watches sold'), M(-cogs)],
            [TOT('Gross profit'), TOT(gp, 'money'), TOT(rev ? gp / rev : null, 'pct')],
        ];
        cats.forEach(function (c) { S.push([T('  ' + c), M(-byCat[c])]); });
        S.push([TOT('Total overhead'), TOT(-opex, 'money'), TOT(rev ? opex / rev : null, 'pct')]);
        S.push([TOT('Net profit'), TOT(net, 'money'), TOT(rev ? net / rev : null, 'pct')]);

        // ── P&L by month ──
        var months = {};
        var mk = function (d) { return String(d).slice(0, 7); };
        sold.forEach(function (d) {
            var m = mk(d.date_sold); months[m] = months[m] || { r: 0, c: 0, o: 0, k: 0 };
            months[m].r += n(d.sell_total); months[m].c += n(d.buy_total) + n(d.other_costs); months[m].k++;
        });
        exp.forEach(function (e) {

        });
        var PL = [
            [{ v: 'Profit & loss by month', s: BK_XS.title }],
            [{ v: label + '  ·  watches sold by sale date, overhead by spend date', s: BK_XS.sub }],

            [H('Month'), H('Pieces', true), H('Revenue', true), H('Cost of goods', true), H('Gross profit', true), H('Margin', true), H('Overhead', true), H('Net profit', true)]
        ];
        var acc = { r: 0, c: 0, o: 0, k: 0 };
        Object.keys(months).sort().forEach(function (m) {

            PL.push([T(BK_MON[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4)), T(x.k), M(x.r), M(x.c), M(g), P(x.r ? g / x.r : null), M(x.o), M(g - x.o)]);
        });
        PL.push([TOT('Total'), TOT(acc.k), TOT(acc.r, 'money'), TOT(acc.c, 'money'), TOT(acc.r - acc.c, 'money'), TOT(acc.r ? (acc.r - acc.c) / acc.r : null, 'pct'), TOT(acc.o, 'money'), TOT(acc.r - acc.c - acc.o, 'money')]);

        // ── Deals ──
        var D = [
            [{ v: 'Deals', s: BK_XS.title }],
            [{ v: 'Every piece bought, newest first. Profit = sale price − purchase price − other costs.', s: BK_XS.sub }],

            [H('Ref'), H('Status'), H('Watch'), H('Reference'), H('Serial'), H('Year'), H('Set'), H('Bought'), H('Sold'), H('Days', true),

        ];
        deals.sort(function (a, b) { return (a.date_bought || a.date_sold || '') < (b.date_bought || b.date_sold || '') ? 1 : -1; })
            .forEach(function (d) {
                var p = bkProfit(d);
                var set = d.box && d.papers ? 'Full set' : d.box ? 'Box only' : d.papers ? 'Papers only' : (d.box === false && d.papers === false ? 'Watch only' : '');
                D.push([T(d.ref), T(d.sell_total == null ? 'In stock' : 'Sold'), T([d.brand, d.model].filter(Boolean).join(' ')), T(d.reference), T(d.serial), T(d.year), T(set),
                    T(d.date_bought), T(d.date_sold), T(d.date_sold && d.date_bought ? bkDays(d.date_bought, d.date_sold) : ''),
                    M(d.buy_total), M(d.other_costs), d.sell_total == null ? T('') : M(d.sell_total), p == null ? T('') : M(p), P(bkMargin(d)),
                    T(d.source_seller), T(d.buyer), T(d.notes)]);
            });
        var sAll = deals.filter(function (d) { return d.sell_total != null; });
        var sr = sAll.reduce(function (s, d) { return s + n(d.sell_total); }, 0);
        var sp = sAll.reduce(function (s, d) { return s + bkProfit(d); }, 0);
        D.push([TOT('Sold, all time'), TOT(sAll.length + ' pieces'), TOT(''), TOT(''), TOT(''), TOT(''), TOT(''), TOT(''), TOT(''), TOT(''),
            TOT(sAll.reduce(function (s, d) { return s + n(d.buy_total); }, 0), 'money'), TOT(sAll.reduce(function (s, d) { return s + n(d.other_costs); }, 0), 'money'),
            TOT(sr, 'money'), TOT(sp, 'money'), TOT(sr ? sp / sr : null, 'pct'), TOT(''), TOT(''), TOT('')]);

        // ── Expenses ──
        var E = [
            [{ v: 'Overhead', s: BK_XS.title }],
            [{ v: label + '  ·  operating expenses only, watch purchases are on the Deals sheet', s: BK_XS.sub }],
            blank,
            [{ v: 'By category', s: BK_XS.section }, { v: '', s: BK_XS.section }, { v: '', s: BK_XS.section }],
            [H('Category'), H('Amount', true), H('Share', true)]
        ];
        cats.forEach(function (c) { E.push([T(c), M(byCat[c]), P(opex ? byCat[c] / opex : null)]); });
        E.push([TOT('Total'), TOT(opex, 'money'), TOT(opex ? 1 : null, 'pct')]);
        E.push(blank);
        E.push([{ v: 'Every expense', s: BK_XS.section }, { v: '', s: BK_XS.section }, { v: '', s: BK_XS.section }]);
        E.push([H('Date'), H('Category'), H('What'), H('Vendor'), H('Amount', true), H('Paid with'), H('Deal'), H('Deductible'), H('Notes')]);
        exp.forEach(function (e) {
            E.push([T(e.spent_on), T(e.category), T(e.description), T(e.vendor), M(e.amount), T(e.payment_method), T(e.deal_ref), T(e.deductible ? 'Yes' : ''), T(e.notes)]);
        });

        // ── Bank ──
        var bal = 0;
        var K = [
            [{ v: 'Bank register', s: BK_XS.title }],
            [{ v: 'Chase ·1791  ·  ' + label + '  ·  every transaction with a running balance', s: BK_XS.sub }],
            blank,
            [H('Date'), H('Description'), H('Category'), H('Money in', true), H('Money out', true), H('Balance', true)]
        ];
        bank.forEach(function (t) {
            bal += n(t.money_in) - n(t.money_out);
            K.push([T(t.posted_on), T(t.logged_as || t.description), T(t.category || 'Uncategorized'),
                    n(t.money_in) ? M(t.money_in) : T(''), n(t.money_out) ? M(t.money_out) : T(''), M(bal)]);
        });
        var inn = bank.reduce(function (s, t) { return s + n(t.money_in); }, 0);
        var out = bank.reduce(function (s, t) { return s + n(t.money_out); }, 0);
        K.push([TOT('Total'), TOT(''), TOT(''), TOT(inn, 'money'), TOT(out, 'money'), TOT(inn - out, 'money')]);
        var bkIn = {}, bkOut = {};
        bank.forEach(function (t) {
            var c = t.category || 'Uncategorized';
            if (n(t.money_in)) bkIn[c] = (bkIn[c] || 0) + n(t.money_in);
            if (n(t.money_out)) bkOut[c] = (bkOut[c] || 0) + n(t.money_out);
        });
        K.push(blank);
        K.push([{ v: 'Money out by category', s: BK_XS.section }, { v: '', s: BK_XS.section }]);
        Object.keys(bkOut).sort(function (a, b) { return bkOut[b] - bkOut[a]; }).forEach(function (c) { K.push([T(c), M(bkOut[c])]); });
        K.push(blank);
        K.push([{ v: 'Money in by category', s: BK_XS.section }, { v: '', s: BK_XS.section }]);
        Object.keys(bkIn).sort(function (a, b) { return bkIn[b] - bkIn[a]; }).forEach(function (c) { K.push([T(c), M(bkIn[c])]); });

        // ── Subscriptions ──
        var U = [
            [{ v: 'Recurring tools', s: BK_XS.title }],
            [{ v: 'Monthly software and services. Not scoped by period.', s: BK_XS.sub }],
            blank,
            [H('Tool'), H('Purpose'), H('Per month', true), H('Billing'), H('Paid with'), H('Status'), H('Notes')]
        ];
        B.subscriptions.slice().sort(function (a, b) { return (a.status === 'Cancel') - (b.status === 'Cancel') || n(b.monthly_cost) - n(a.monthly_cost); })
            .forEach(function (x) {
                U.push([T(x.name), T(x.purpose), M(x.monthly_cost), T(x.billing), T(x.payment), T(x.status === 'Cancel' ? 'Cancelled' : 'Active'), T(x.notes)]);
            });
        U.push([TOT('Active per month'), TOT(''), TOT(burn, 'money'), TOT(''), TOT(''), TOT(''), TOT('')]);

        // ── Capital ──
        var C = [
            [{ v: 'Capital', s: BK_XS.title }],
            [{ v: 'Money put into or taken out of the business by owners and backers.', s: BK_XS.sub }],
            blank,
            [H('Date'), H('Direction'), H('Amount', true), H('What'), H('Notes')]
        ];
        (B.capital || []).slice().sort(function (a, b) { return a.moved_on < b.moved_on ? -1 : 1; })
            .forEach(function (c) { C.push([T(c.moved_on), T(c.direction), M(c.amount), T(c.description), T(c.notes)]); });
        C.push([TOT('Net contributed'), TOT(''), TOT(capIn, 'money'), TOT(''), TOT('')]);

        var wb = XLSX.utils.book_new();
        var add = function (name, rows, widths, headerRow) {
            var ws = XLSX.utils.aoa_to_sheet(rows);
            // Styled cells are passed as objects; make sure every one carries a
            // type, or Excel treats the text ones as empty.
            Object.keys(ws).forEach(function (k) {
                var c = ws[k];
                if (k[0] === '!' || !c || typeof c !== 'object') return;
                if (!c.t) c.t = typeof c.v === 'number' ? 'n' : 's';
                if (c.v == null) c.v = '';
            });
            ws['!cols'] = widths.map(function (w) { return { wch: w }; });
            ws['!rows'] = [{ hpt: 24 }];
            if (headerRow != null) {
                ws['!freeze'] = { xSplit: 0, ySplit: headerRow + 1 };
                ws['!views'] = [{ state: 'frozen', ySplit: headerRow + 1 }];
                var ref = XLSX.utils.decode_range(ws['!ref']);
                ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: headerRow, c: 0 }, e: { r: ref.e.r, c: ref.e.c } }) };
            }
            XLSX.utils.book_append_sheet(wb, ws, name);
        };
        add('Summary', S, [30, 18, 34]);
        add('P&L by month', PL, [14, 8, 14, 14, 14, 9, 14, 14], 3);
        add('Deals', D, [13, 9, 32, 12, 11, 6, 10, 11, 11, 6, 13, 12, 13, 13, 8, 26, 26, 50], 3);
        add('Overhead', E, [14, 24, 48, 22, 13, 11, 13, 10, 40]);
        add('Bank', K, [12, 52, 24, 13, 13, 14], 3);
        add('Subscriptions', U, [24, 26, 12, 10, 12, 10, 36], 3);
        add('Capital', C, [12, 10, 13, 44, 32], 3);
        return wb;
    }

    async function bkExport() {
        var btn = document.getElementById('bk-xlsx');
        btn.disabled = true; btn.textContent = 'Building…';
        try {
            var XLSX = await bkLoadXlsx();
            var wb = bkBuildWorkbook(XLSX, BOOKS, bkPeriod);
            var tag = bkPeriod === 'all' ? 'all-time' : bkPeriod === '90' ? 'last-90-days' : 'this-month';
            XLSX.writeFile(wb, 'DialedByH-Books-' + tag + '-' + new Date().toISOString().slice(0, 10) + '.xlsx');
        } catch (e) {
            alert('Export failed: ' + e.message);
        } finally {
            btn.disabled = false; btn.textContent = 'Export to Spreadsheet';
        }
    }

    // ── bank CSV paste ──────────────────────────────────────────
    // Splits on commas outside quotes, which is all a Chase export needs.
    function bkCsvRows(text) {
        return text.split(/\r?\n/).filter(function (l) { return l.trim(); }).map(function (line) {
            var out = [], cur = '', q = false;
            for (var i = 0; i < line.length; i++) {
                var c = line[i];
                if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else { q = !q; } }
                else if (c === ',' && !q) { out.push(cur); cur = ''; }
                else cur += c;
            }
            out.push(cur);
            return out.map(function (s) { return s.trim(); });
        });
    }

    // Chase columns are Details, Posting Date, Description, Amount, Type, Balance.
    // Matched by name rather than position so a reordered export still lands.
    function bkParseBank(text) {
        var rows = bkCsvRows(text);
        if (!rows.length) return [];
        var head = rows[0].map(function (h) { return h.toLowerCase(); });
        var find = function (want) {
            for (var i = 0; i < head.length; i++) if (head[i].indexOf(want) !== -1) return i;
            return -1;
        };
        var iDate = find('date'), iDesc = find('description'), iAmt = find('amount'), iType = find('type');
        if (iDate === -1 || iAmt === -1) return [];
        return rows.slice(1).map(function (r) {
            var raw = (r[iDate] || '').trim();
            var m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            var date = m ? m[3] + '-' + ('0' + m[1]).slice(-2) + '-' + ('0' + m[2]).slice(-2)
                         : (/^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw : null);
            var amt = Number((r[iAmt] || '').replace(/[$,\s]/g, ''));
            if (!date || !Number.isFinite(amt) || amt === 0) return null;
            return {
                posted_on: date,
                description: iDesc === -1 ? '' : r[iDesc],
                money_in: amt > 0 ? amt : 0,
                money_out: amt < 0 ? -amt : 0,
                txn_type: iType === -1 ? '' : r[iType]
            };
        }).filter(Boolean);
    }

    // Downscale before upload: Vercel caps a request body at ~4.5MB, and a raw
    // phone photo blows past that. PNG keeps the alpha channel that the
    // background-removed pieces depend on.
    function downscale(file, max) {
        return new Promise(function (resolve, reject) {
            var img = new Image();
            var url = URL.createObjectURL(file);
            img.onload = function () {
                URL.revokeObjectURL(url);
                var w = img.width, h = img.height;
                var s = Math.min(1, max / Math.max(w, h));
                var c = document.createElement('canvas');
                c.width = Math.round(w * s); c.height = Math.round(h * s);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                resolve(c.toDataURL('image/png'));
            };
            img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Could not read that image')); };
            img.src = url;
        });
    }

    var LEADS = [], STATS = null;
    var lq = '', lsort = 'created_at', ldir = -1, lopen = null;
    var lfilter = { tile: '', status: '', days: '', type: '' };

    var STATUSES = ['new', 'contacted', 'negotiating', 'closed', 'archived'];

    async function renderLeads() {
        var r = await A.adminFetchTo('/api/leads-admin', 'list');
