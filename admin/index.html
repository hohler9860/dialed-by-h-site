<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FBFAF4">
<title>Admin · Dialed By H</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-fpj-32.png?v=4">
<!-- Home-screen app icon: iOS reads these when Henry adds the admin from Safari. -->
<link rel="apple-touch-icon" sizes="180x180" href="/admin/icon-180.png">
<meta name="apple-mobile-web-app-title" content="DBH Admin">

<style>
/*
 * Admin console, built in the Boston Watch Club admin's design language:
 * cream ground, Departure Mono chrome, TikTok Sans display, black tab pills.
 * Deliberately self-contained — it does NOT load /dist/styles.css, because the
 * site's global sheet uppercases the whole body and would fight every label
 * here. Tokens below are lifted from the BWC theme.
 */
@font-face {
    font-family: 'tronica-mono';
    src: url('/fonts/DepartureMono-Regular.otf') format('opentype');
    font-weight: 400; font-display: block;
}
@font-face {
    font-family: 'tiktok';
    src: url('/fonts/TikTokSans.ttf') format('truetype');
    font-weight: 100 900; font-display: block;
}

:root {
    --label: 0,0,0;
    --label-d: 54,54,48;
    --bg-deep: 251,250,244;
    --l1: rgba(var(--label),1);
    --l2: rgba(var(--label-d),.6);
    --l3: rgba(var(--label-d),.32);
    --line: rgba(var(--label-d),.1);
    --b1: rgb(var(--bg-deep));
    --be: #efede7;
    --mono: 'tronica-mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sans: 'tiktok', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--b1); }
body { color: var(--l1); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
::selection { background: #fff; color: #000; }
a { color: inherit; text-decoration: none; }

.mono { font-family: var(--mono); }
.hidden { display: none !important; }

/* ── header ─────────────────────────────────────────────── */
header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px; font-family: var(--mono); font-size: 15px;
    background: rgba(var(--bg-deep),.8); backdrop-filter: blur(6px);
}
@media (min-width: 1024px) { header { padding: 28px 56px; } }
header img { height: 16px; width: auto; display: block; }
@media (min-width: 1024px) { header img { height: 18px; } }
.hbtn {
    font-family: var(--mono); font-size: 15px; text-transform: uppercase;
    background: none; border: 0; padding: 8px; cursor: pointer; color: var(--l1);
    position: relative;
}
.hbtn::before {
    content: ''; position: absolute; inset: 0;
    border: 2px dotted transparent; transition: border-color .2s; pointer-events: none;
}
.hbtn:hover::before { border-color: var(--l1); }

/* ── layout ─────────────────────────────────────────────── */
main { margin: 0 auto; padding: 96px 24px; width: 100%; max-width: 1100px; }
@media (min-width: 1024px) { main { padding: 128px 24px; } }

.eyebrow { font-family: var(--mono); font-size: 14px; text-transform: uppercase; color: var(--l2); }
h1.title {
    margin-top: 8px; font-weight: 700; font-size: 40px; line-height: 1;
    letter-spacing: -.02em; text-transform: uppercase;
    font-variation-settings: 'wdth' 120;
}
@media (min-width: 1024px) { h1.title { font-size: 60px; } }

/* ── tabs ───────────────────────────────────────────────── */
nav.tabs {
    margin-top: 32px; display: flex; flex-wrap: wrap; gap: 8px;
    font-family: var(--mono); font-size: 14px; text-transform: uppercase;
    border-bottom: 1px solid var(--line);
}
nav.tabs button {
    padding: 12px 16px; cursor: pointer; background: none; border: 0;
    font: inherit; color: var(--l1); transition: background .15s, color .15s;
}
nav.tabs button:hover { color: var(--l1); background: rgba(var(--label-d),.05); }
nav.tabs button[aria-selected="true"] { background: #000; color: var(--b1); }

section.body { margin-top: 40px; min-height: 40vh; }

/* ── controls ───────────────────────────────────────────── */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; }
input.ctl, select.ctl, textarea.ctl {
    font-family: var(--mono); font-size: 13px; color: var(--l1);
    background: transparent; border: 1px solid var(--line);
    padding: 9px 11px; outline: none; border-radius: 0;
}
input.ctl:focus, select.ctl:focus, textarea.ctl:focus { border-color: var(--l1); }
input.ctl::placeholder { color: var(--l3); }
.grow { flex: 1; min-width: 200px; }

.btn {
    font-family: var(--mono); font-size: 13px; text-transform: uppercase;
    padding: 10px 16px; cursor: pointer; border: 1px solid #000;
    background: #000; color: var(--b1); transition: opacity .15s;
}
.btn:hover { opacity: .82; }
.btn.ghost { background: transparent; color: var(--l1); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--l1); opacity: 1; }
.btn.danger { background: transparent; color: #b3261e; border-color: rgba(179,38,30,.35); }
.btn.danger:hover { border-color: #b3261e; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.count { font-family: var(--mono); font-size: 13px; text-transform: uppercase; color: var(--l2); margin-bottom: 12px; }

/* ── rows ───────────────────────────────────────────────── */
.row {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 4px; border-bottom: 1px solid var(--line);
    cursor: pointer; transition: background .12s;
}
.row:hover { background: rgba(var(--label-d),.04); }
.row .thumb {
    width: 46px; height: 46px; flex: none; background: var(--be);
    object-fit: cover; display: block;
}
.row .ph {
    width: 46px; height: 46px; flex: none; background: var(--be);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 8px; color: var(--l3);
}
.row .rname { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.row .rmeta {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase;
    color: var(--l2); margin-top: 3px; word-break: break-word;
}
.row .rgrow { flex: 1; min-width: 0; }
.pill {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    border: 1px solid var(--line); padding: 3px 7px; white-space: nowrap;
}
.pill.on { background: #000; color: var(--b1); border-color: #000; }

/* ── editor ─────────────────────────────────────────────── */
.sheet {
    position: fixed; inset: 0; z-index: 100; background: rgba(var(--bg-deep),.97);
    overflow-y: auto; padding: 24px;
}
.sheet-inner { max-width: 900px; margin: 0 auto; padding-bottom: 80px; }
.sheet h2 {
    font-weight: 700; font-size: 30px; text-transform: uppercase;
    letter-spacing: -.02em; font-variation-settings: 'wdth' 120; margin-bottom: 4px;
}
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-top: 28px; }
.field label {
    display: block; font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: .06em; color: var(--l2); margin-bottom: 6px;
}
.field input, .field textarea {
    width: 100%; font-family: var(--mono); font-size: 13px; color: var(--l1);
    background: transparent; border: 0; border-bottom: 1px solid var(--line);
    padding: 8px 2px; outline: none;
}
.field input:focus, .field textarea:focus { border-bottom-color: var(--l1); }
.field.wide { grid-column: 1 / -1; }

.imgs { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
.imgcard { position: relative; width: 110px; }
.imgcard img { width: 110px; height: 110px; object-fit: cover; background: var(--be); display: block; }
.imgcard .tools { display: flex; gap: 4px; margin-top: 5px; }
.imgcard .tools button {
    flex: 1; font-family: var(--mono); font-size: 10px; padding: 3px;
    border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--l1);
}
.imgcard .tools button:hover { border-color: var(--l1); }
.imgcard .primary {
    position: absolute; top: 4px; left: 4px; background: #000; color: var(--b1);
    font-family: var(--mono); font-size: 9px; padding: 2px 5px; text-transform: uppercase;
}

.note { font-family: var(--mono); font-size: 12px; color: var(--l2); margin-top: 8px; }
.err { font-family: var(--mono); font-size: 13px; color: #b3261e; text-transform: uppercase; margin-top: 12px; }

/* ── leads dashboard ────────────────────────────────────── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 8px; margin-bottom: 20px; }
.tile {
    border: 1px solid var(--line); padding: 12px 13px; cursor: pointer;
    background: transparent; text-align: left; transition: border-color .15s, background .15s;
}
.tile:hover { border-color: var(--l1); }
.tile[aria-pressed="true"] { background: #000; border-color: #000; }
.tile[aria-pressed="true"] .tk, .tile[aria-pressed="true"] .tv { color: var(--b1); }
.tk { display: block; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--l2); }
.tv { display: block; font-family: var(--mono); font-size: 24px; line-height: 1.1; margin-top: 5px; color: var(--l1); }

.tbl-wrap { border-top: 1px solid var(--line); overflow-x: auto; }
table.leads { width: 100%; border-collapse: collapse; font-size: 13px; }
table.leads th {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--l2); text-align: left; font-weight: 400; padding: 10px 10px 10px 0;
    border-bottom: 1px solid var(--line); white-space: nowrap;
    position: sticky; top: 0; background: var(--b1); z-index: 2;
}
table.leads th.s { cursor: pointer; user-select: none; }
table.leads th.s:hover { color: var(--l1); }
table.leads th .ar { color: var(--l3); margin-left: 3px; }
table.leads th.on { color: var(--l1); }
table.leads th.on .ar { color: var(--l1); }
table.leads td { padding: 11px 10px 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
/* Compact density for the wholesale feed: roughly twice the rows per screen. */
.tbl-wrap.dense table.leads { font-size: 12px; }
.tbl-wrap.dense table.leads td { padding: 4px 8px 4px 0; }
.tbl-wrap.dense table.leads th { padding: 6px 8px 6px 0; }
.tbl-wrap.dense .tsub, .tbl-wrap.dense .tmono { font-size: 10px; margin-top: 0; }

/* Card view for the wholesale feed: same tile recipe as the live buy page —
   borderless, square photo on a near-black canvas, then one letterspaced
   uppercase row with the name left and the price right. */
.wcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 34px 18px; padding-top: 20px; }
.wcard { cursor: pointer; min-width: 0; }
.wcard .wc-img { position: relative; width: 100%; aspect-ratio: 1; background: #0d0d0d; overflow: hidden; }
.wcard .wc-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.wcard .wc-img .wc-noimg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 9px; letter-spacing: .3em; color: rgba(255,255,255,.25); }
.wcard .wc-tag { position: absolute; top: 0; right: 0; z-index: 2; background: var(--l1); color: var(--b1);
    font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; padding: 4px 8px; }
.wcard .wc-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 12px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; min-width: 0; }
.wcard .wc-row .wc-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--l1); }
.wcard .wc-row .wc-price { color: var(--l2); font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }
.wcard:hover .wc-name { text-decoration: underline; text-underline-offset: 4px; }
.wcard .wc-ref { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--l3); margin-top: 4px; }
.wcard .wc-detail { display: none; margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10.5px; color: var(--l2); line-height: 1.7; }
.wcard.open .wc-detail { display: block; }

/* Pipeline diagram */
.pipe-wrap { padding-top: 8px; overflow-x: auto; }
.pipe-svg { width: 100%; height: auto; display: block; }
/* On a phone the diagram scrolls sideways instead of shrinking to confetti. */
@media (max-width: 820px) { .pipe-svg { min-width: 900px; } }
.pipe-svg .pnode { fill: var(--b1); stroke: var(--line); stroke-width: 1; }
.pipe-svg .pnode--work { stroke: var(--l2); }
.pipe-svg .plabel { font-family: var(--mono); font-size: 9px; letter-spacing: .14em; fill: var(--l2); }
.pipe-svg .pnum { font-family: var(--mono); font-size: 22px; fill: var(--l1); }
.pipe-svg .psub { font-family: var(--mono); font-size: 8.5px; fill: var(--l3); }
.pipe-svg .pedge { fill: none; stroke: var(--line); stroke-width: 1.4; }
.pipe-svg .pedge--flow { stroke-dasharray: 3 6; animation: pipeflow 1.2s linear infinite; stroke: var(--l2); }
.pipe-svg .pdot { fill: var(--l1); }
@keyframes pipeflow { to { stroke-dashoffset: -9; } }
.pipe-recent { margin-top: 18px; }
.pnum.bump { animation: pbump .5s ease; }
@keyframes pbump { 0% { fill: #7fd97f; } 100% { fill: var(--l1); } }
table.leads tbody tr { cursor: pointer; }
table.leads tbody tr:hover { background: rgba(var(--label-d),.04); }
.tname { font-weight: 700; letter-spacing: -.01em; }
.tsub { font-family: var(--mono); font-size: 11px; color: var(--l2); margin-top: 2px; }
.tmono { font-family: var(--mono); font-size: 11px; color: var(--l2); white-space: nowrap; }

/* Wholesale photos. The thumbnail sits inline so the eye can scan the table by
   watch rather than by text, which is how these listings are actually read. */
.wcell { display: flex; align-items: center; gap: 10px; }
.wcell .tname, .wcell .tsub { display: block; }
.wthumb {
    width: 44px; height: 44px; flex: 0 0 44px;
    object-fit: cover; background: var(--be);
    border: 1px solid var(--line); border-radius: 2px;
}
.wthumb--none { background: repeating-linear-gradient(45deg, var(--be), var(--be) 4px, transparent 4px, transparent 8px); }
.wshot {
    max-width: 320px; width: 100%; height: auto; display: block;
    border: 1px solid var(--line); border-radius: 2px; margin-top: 10px;
}
.tag {
    display: inline-block; font-family: var(--mono); font-size: 9px; text-transform: uppercase;
    letter-spacing: .06em; border: 1px solid var(--line); padding: 2px 6px; white-space: nowrap;
}
.tag.hot { background: #000; color: var(--b1); border-color: #000; }
.tag.warm { border-color: var(--l1); color: var(--l1); }
.tag.spam, .tag.test { color: var(--l3); }
.detail { background: rgba(var(--label-d),.03); }
.detail td { padding: 16px 10px 20px 0; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 26px; }
.dk { font-family: var(--mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--l2); margin-bottom: 3px; }
.dv { font-size: 13px; white-space: pre-wrap; word-break: break-word; }
select.stat {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    background: transparent; border: 1px solid var(--line); padding: 3px 5px; cursor: pointer; color: var(--l1);
}

/* ── books ──────────────────────────────────────────────── */
/*
 * Every class here is bk- prefixed on purpose: Books landed while other work was
 * in flight elsewhere in this file, and a shared .card or .stat would have been a
 * silent collision.
 *
 * Chart colours are the only new hues in the console. They were validated
 * colourblind-safe against this cream ground (#FBFAF4): worst all-pairs CVD
 * deltaE 9.2, normal-vision 24.0. Do not swap them for something that "matches"
 * without re-checking, and do not add a third series without doing the same.
 */
:root { --s1: #2a78d6; --s2: #eb6834; --ok: #0ca30c; --warn: #ec835a; --bad: #d03b3b; }

.bk-filters {
    padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
}
.bk-filters .lab { color: var(--l3); margin-right: 6px; }
.bk-seg { padding: 7px 13px; cursor: pointer; background: none; border: 0; font: inherit; color: var(--l2); }
.bk-seg:hover { color: var(--l1); }
.bk-seg[aria-pressed="true"] { background: #000; color: var(--b1); }

.bk-stats {
    margin-top: 24px; display: grid; gap: 1px; background: var(--line);
    border: 1px solid var(--line); grid-template-columns: repeat(2, 1fr);
}
@media (min-width: 760px)  { .bk-stats { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1100px) { .bk-stats { grid-template-columns: repeat(6, 1fr); } }
.bk-stat { background: var(--b1); padding: 18px 16px 16px; }
.bk-k { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--l3); }
.bk-v {
    margin-top: 9px; font-size: 27px; font-weight: 700; line-height: 1;
    letter-spacing: -.02em; font-variation-settings: 'wdth' 105;
}
.bk-v.neg { color: var(--bad); }
.bk-s { margin-top: 6px; font-family: var(--mono); font-size: 11px; color: var(--l2); }

/* align-items:start so a short card does not stretch to match a tall neighbour
   and leave a dead field of cream under its chart. */
.bk-grid { margin-top: 22px; display: grid; gap: 22px; align-items: start; }
@media (min-width: 900px) { .bk-grid.two { grid-template-columns: 1.35fr 1fr; } }
.bk-card { border: 1px solid var(--line); padding: 20px 20px 16px; }
.bk-card h3 {
    font-size: 15px; font-weight: 700; text-transform: uppercase;
    letter-spacing: -.01em; font-variation-settings: 'wdth' 115;
}
.bk-card .cap { margin-top: 5px; font-family: var(--mono); font-size: 11px; color: var(--l2); }
.bk-cat-row { display: flex; align-items: baseline; gap: 12px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
.bk-cat-row:last-child { border-bottom: none; }
.bk-cat-row.on { background: var(--l1); color: var(--b1); padding-left: 8px; padding-right: 8px; }
.bk-cat-row .bk-cat-n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bk-cat-row .bk-cat-c { font-family: var(--mono); font-size: 11px; color: var(--l2); }
.bk-cat-row.on .bk-cat-c { color: inherit; }
.bk-cat-row .bk-cat-v { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bk-legend {
    margin-top: 12px; display: flex; gap: 16px; font-family: var(--mono);
    font-size: 11px; color: var(--l2); text-transform: uppercase; letter-spacing: .04em;
}
.bk-legend i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: -1px; }
.bk-plot { margin-top: 12px; position: relative; }
.bk-plot svg { display: block; width: 100%; overflow: visible; }
.bk-tick { font-family: var(--mono); font-size: 10.5px; fill: rgba(54,54,48,.5); letter-spacing: .03em; }
.bk-dlab { font-family: var(--mono); font-size: 11px; fill: var(--l1); }
.bk-dsub { font-family: var(--mono); font-size: 10.5px; fill: rgba(54,54,48,.5); }
.bk-gl { stroke: rgba(54,54,48,.08); stroke-width: 1; }
.bk-base { stroke: rgba(54,54,48,.28); stroke-width: 1; }
.bk-hit { fill: transparent; cursor: crosshair; }
.bk-tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .12s;
    background: #000; color: var(--b1); padding: 8px 10px; font-family: var(--mono);
    font-size: 11px; line-height: 1.55; white-space: nowrap; z-index: 5;
}
.bk-empty { font-family: var(--mono); font-size: 12px; color: var(--l3); padding: 26px 0; text-align: center; }

.bk-sub { display: flex; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.bk-sub .nm { font-size: 13px; flex: 1; }
.bk-sub .amt { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.bk-sub.dead .nm { text-decoration: line-through; opacity: .45; }
.bk-chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
.bk-chip i { width: 7px; height: 7px; display: block; }
.bk-foot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; color: var(--l3); }
.bk-burn { font-family: var(--sans); font-size: 21px; font-weight: 700; letter-spacing: -.02em; color: var(--l1); }

table.bk-tbl { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
table.bk-tbl th {
    text-align: left; padding: 10px 14px 10px 0; border-bottom: 1px solid var(--line);
    color: var(--l3); text-transform: uppercase; letter-spacing: .06em; font-weight: 400; white-space: nowrap;
}
table.bk-tbl td { padding: 12px 14px 12px 0; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
table.bk-tbl td.nm { font-family: var(--sans); font-size: 13px; white-space: normal; min-width: 160px; }
/* The ledger is wider than the console; it scrolls in its own container. Names
   get an ellipsis rather than being sliced mid-word at the edge — the full
   value is one click away in the editor. */
table.bk-tbl td.who {
    font-family: var(--sans); font-size: 13px; max-width: 150px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
table.bk-tbl th.n, table.bk-tbl td.n { text-align: right; padding-right: 14px; }
table.bk-tbl tbody tr:hover td { background: rgba(var(--label-d),.04); }
.bk-mute { color: var(--l3); }

/* Books runs dark: it is the one tab read as a dashboard, not a list. Every
   bk- component already paints from the console tokens, so re-pointing those
   tokens inside .bk is the whole theme. Green = money in / profit, red = money
   out / loss, nothing else carries colour. */
.bk {
    --bkbg: #0b0e12; --bkcard: #11151b; --bkline: #1e2530; --bkt: #e7ebf0; --bkm: #8a94a3; --bkm2: #5b6675;
    --g: #22c55e; --r: #ef4444;
    --s1: var(--g); --s2: var(--r); --ok: var(--g); --bad: var(--r);
    --line: var(--bkline); --l1: var(--bkt); --l2: var(--bkm); --l3: var(--bkm2); --b1: var(--bkcard);
    background: var(--bkbg); color: var(--bkt); padding: 18px; border-radius: 14px;
}
.bk .bk-filters { border-color: var(--bkline); padding: 8px 0 12px; border-top: 0; }
.bk .bk-seg { color: var(--bkm); }
.bk .bk-seg:hover { color: var(--bkt); }
.bk .bk-seg[aria-pressed="true"] { background: var(--bkt); color: var(--bkbg); }
.bk .btn { border-color: var(--bkline); color: var(--bkt); background: transparent; }
.bk .btn:not(.ghost) { background: var(--bkt); color: var(--bkbg); border-color: var(--bkt); }
.bk .btn:hover { border-color: var(--bkm); }
.bk .bk-stats { margin-top: 0; gap: 1px; background: var(--bkline); border-color: var(--bkline); }
.bk .bk-stat { background: var(--bkcard); padding: 14px 14px 12px; }
.bk .bk-v { font-size: 24px; margin-top: 7px; }
.bk .bk-v.pos { color: var(--g); }
.bk .bk-v.neg { color: var(--r); }
.bk .bk-v.flat { color: var(--bkt); }
.bk .bk-s { color: var(--bkm2); }
.bk .bk-mas { margin-top: 14px; columns: 1; column-gap: 14px; }
@media (min-width: 900px) { .bk .bk-mas { columns: 2; } }
.bk .bk-mas > .bk-card { break-inside: avoid; margin: 0 0 14px; }
.bk .bk-card { background: var(--bkcard); border-color: var(--bkline); padding: 16px 16px 12px; border-radius: 10px; }
.bk .bk-card h3 { font-size: 13px; letter-spacing: .02em; }
.bk .bk-card .cap { color: var(--bkm2); margin-top: 3px; }
.bk .bk-cat-row { padding: 6px 2px; border-color: var(--bkline); font-size: 12.5px; }
.bk .bk-cat-row.on { background: var(--bkt); color: var(--bkbg); }
.bk .bk-cat-row .bk-cat-c { color: var(--bkm2); }
.bk .bk-cat-v.in { color: var(--g); }
.bk .bk-cat-v.out { color: var(--r); }
.bk .bk-cat-row.on .bk-cat-v { color: inherit; }
.bk .bk-tick, .bk .bk-dsub { fill: var(--bkm2); }
.bk .bk-dlab { fill: var(--bkt); }
.bk .bk-gl { stroke: rgba(255,255,255,.06); }
.bk .bk-base { stroke: rgba(255,255,255,.22); }
.bk .bk-tip { background: #000; color: #fff; border: 1px solid var(--bkline); }
.bk .bk-sub { border-color: var(--bkline); padding: 8px 0; }
.bk .bk-sub .amt { color: var(--r); }
.bk .bk-sub.dead .amt { color: var(--bkm2); }
.bk select.stat { background: var(--bkcard); border-color: var(--bkline); }
.bk .bk-foot { color: var(--bkm2); }
.bk .bk-burn { color: var(--r); }
.bk table.leads th { color: var(--bkm2); border-color: var(--bkline); }
.bk table.leads td { border-color: var(--bkline); }
.bk .tmono { color: var(--bkm); }
.bk .tsub { color: var(--bkm2); }
.bk td.in { color: var(--g); }
.bk td.out { color: var(--r); }
.bk .count { color: var(--bkm); }
.bk .bk-legend { color: var(--bkm); margin-top: 8px; }
.bk .bk-tax { margin: 14px 0 0; display: grid; gap: 1px; background: var(--bkline); border: 1px solid var(--bkline); border-radius: 10px; overflow: hidden; }
@media (min-width: 760px) { .bk .bk-tax { grid-template-columns: repeat(3, 1fr); } }
.bk .bk-tax .t { background: var(--bkcard); padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 96px; }
.bk .bk-tax .d { font-family: var(--mono); font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.bk .bk-tax .d.soon { color: var(--r); } .bk .bk-tax .d.near { color: #f59e0b; } .bk .bk-tax .d.far { color: var(--g); }
.bk .bk-tax .n { font-size: 13px; font-weight: 700; margin-top: 4px; }
.bk .bk-tax .w { font-family: var(--mono); font-size: 10.5px; color: var(--bkm2); text-transform: uppercase; letter-spacing: .06em; }
.bk .bk-note { font-family: var(--mono); font-size: 11px; color: var(--bkm); text-transform: none; letter-spacing: 0; line-height: 1.5; margin-top: 4px; }
.bk .bk-taxrow { display: flex; gap: 14px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--bkline); }
.bk .bk-taxrow:last-child { border-bottom: 0; }
.bk .bk-taxrow .l { flex: 1; min-width: 0; }
.bk .bk-taxrow .rt { text-align: right; min-width: 108px; font-family: var(--mono); font-size: 11px; color: var(--bkm); }
.bk .bk-taxrow .rt b { display: block; font-size: 12px; }
.bk .bk-head { display: flex; align-items: baseline; gap: 12px; }
.bk .bk-head h3 { margin: 0; }
.bk .bk-head .sp { flex: 1; }

/* ── brand grid ─────────────────────────────────────────── */
.brands { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.bcard {
    display: flex; align-items: center; gap: 12px; text-align: left;
    border: 1px solid var(--line); background: transparent; padding: 12px;
    cursor: pointer; transition: border-color .15s, background .15s;
}
.bcard:hover { border-color: var(--l1); background: rgba(var(--label-d),.03); }
/* A card whose content stacks. .bcard centres its children in a flex row, so
   anything with more than one block in it comes out as narrow columns. */
.scard {
    display: block; text-align: left;
    border: 1px solid var(--line); background: transparent; padding: 14px;
}
.scard + .scard { margin-top: 10px; }
.scard .row { padding: 0; border-bottom: 0; cursor: default; }
.scard pre { margin: 6px 0 0; }
.bcard img { width: 44px; height: 44px; object-fit: cover; background: var(--be); flex: none; display: block; }
.bcard .bn { font-weight: 700; font-size: 14px; letter-spacing: -.01em; line-height: 1.25; }
.bcard .bc { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--l2); margin-top: 3px; }
.crumb {
    font-family: var(--mono); font-size: 12px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--l2); margin-bottom: 14px;
}
.crumb button {
    font: inherit; color: var(--l2); background: none; border: 0; cursor: pointer; padding: 0;
}
.crumb button:hover { color: var(--l1); }
.crumb .sep { margin: 0 8px; color: var(--l3); }
.crumb .cur { color: var(--l1); }

/* ── login ──────────────────────────────────────────────── */
#gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
#gate .box { width: 100%; max-width: 400px; }
#gate input {
    width: 100%; font-family: var(--mono); font-size: 14px; color: var(--l1);
    background: transparent; border: 0; border-bottom: 1px solid var(--l3);
    padding: 12px 2px; outline: none; margin-bottom: 20px;
}
#gate input:focus { border-bottom-color: var(--l1); }
</style>
</head>
<body>

<!-- LOGIN -->
<section id="gate">
    <div class="box">
        <img src="/images/logo-dark.png" alt="Dialed By H" style="height:18px;width:auto;display:block;margin-bottom:28px">
        <p class="eyebrow">Control Room</p>
        <h1 class="title" style="font-size:40px;margin-bottom:28px">Admin</h1>
        <form id="gate-form">
            <input id="gate-pw" type="password" autocomplete="current-password" placeholder="ADMIN PASSWORD">
            <button class="btn" type="submit" style="width:100%">Sign In</button>
            <p id="gate-err" class="err hidden">Wrong password</p>
        </form>
    </div>
</section>

<!-- CONSOLE -->
<div id="app" class="hidden">
    <header>
        <a href="/"><img src="/images/logo-dark.png" alt="Dialed By H"></a>
        <button id="signout" class="hbtn">Sign Out</button>
    </header>

    <main>
        <p class="eyebrow">Control Room</p>
        <h1 class="title">Admin</h1>

        <nav class="tabs" id="tabs">
            <button data-tab="today"   aria-selected="true">Today</button>
            <button data-tab="books"   aria-selected="false">Books</button>
            <button data-tab="deals"   aria-selected="false">Deals</button>
            <button data-tab="pieces"  aria-selected="false">Pieces</button>
            <button data-tab="journal" aria-selected="false">Journal</button>
            <button data-tab="leads"   aria-selected="false">Leads</button>
            <button data-tab="ntq"     aria-selected="false">NTQ</button>
            <button data-tab="wholesale" aria-selected="false">Wholesale</button>
            <button data-tab="parts"   aria-selected="false">Parts/Acc</button>
            <button data-tab="pipeline" aria-selected="false">Pipeline</button>
            <button data-tab="matches" aria-selected="false">Matches</button>
            <button data-tab="dealers" aria-selected="false">Dealers</button>
            <button data-tab="retail"  aria-selected="false">Retail</button>
            <button data-tab="buyers"  aria-selected="false">Buyers</button>
            <button data-tab="accuracy" aria-selected="false">Accuracy</button>
            <button data-tab="health"  aria-selected="false">Health</button>
            <button data-tab="ww"      aria-selected="false">W&amp;W 2027</button>
        </nav>

        <section class="body" id="view"></section>
    </main>
</div>

<!-- EDITOR SHEET -->
<div id="sheet" class="sheet hidden"><div class="sheet-inner" id="sheet-inner"></div></div>

<script src="/scripts/admin-auth.js"></script>
<script>
(function () {
    'use strict';

    var A = window.dialedAdmin;
    var gate = document.getElementById('gate');
    var app = document.getElementById('app');
    var view = document.getElementById('view');
    var sheet = document.getElementById('sheet');
    var sheetInner = document.getElementById('sheet-inner');

    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ── auth ────────────────────────────────────────────────
    function boot() {
        gate.classList.add('hidden');
        app.classList.remove('hidden');
        // Honour a deep link like /admin/#journal (the standalone article
        // editor links back this way).
        var want = (location.hash || '').replace('#', '');
        // Today is the landing tab: who is owed a reply comes before the books.
        show(TABS[want] ? want : 'today');
    }

    document.getElementById('gate-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var err = document.getElementById('gate-err');
        err.classList.add('hidden');
        // Probe the pieces endpoint: it is the tab that opens first, so a pass
        // here means the console is actually usable.
        var ok = await A.tryLoginWith(document.getElementById('gate-pw').value, '/api/get-inventory', 'list');
        if (ok) boot(); else err.classList.remove('hidden');
    });

    document.getElementById('signout').addEventListener('click', function () {
        A.clearToken();
        location.reload();
    });

    // ── tabs ────────────────────────────────────────────────
    var TABS = { today: renderToday, books: renderBooks, deals: renderDeals, pieces: renderPieces, journal: renderJournal, leads: renderLeads, ntq: renderNTQ, wholesale: renderWholesale, parts: renderParts, pipeline: renderPipeline, matches: renderMatches, dealers: renderDealers, retail: renderRetail, buyers: renderBuyers, accuracy: renderAccuracy, health: renderHealth, ww: renderWW };

    document.getElementById('tabs').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-tab]');
        if (b) show(b.dataset.tab);
    });

    function show(tab) {
        [].forEach.call(document.querySelectorAll('#tabs button'), function (b) {
            b.setAttribute('aria-selected', String(b.dataset.tab === tab));
        });
        try { history.replaceState(null, '', '#' + tab); } catch (e) {}
        view.innerHTML = '<p class="count">Loading…</p>';
        TABS[tab]().catch(function (err) {
            view.innerHTML = '<p class="err">' + esc(err.message || 'Failed to load') + '</p>';
        });
    }

    // ══════════════════════════════════════════════════════════
    // BOOKS  — the landing tab
    // ══════════════════════════════════════════════════════════
    // The business tracker that used to live in a Google Sheet. Everything here
    // is derived at paint time from the raw rows; nothing computed is stored, so
    // the numbers cannot drift out of sync with the deals and expenses behind
    // them. Fetched once per tab visit, then re-derived locally on filter change.
    var BOOKS = null;
    var bkPeriod = 'all';
    var bkCat = '';        // category filter for the transaction register
    // The register is long and rarely the thing being looked for, so it starts
    // folded. Picking a category opens it, since that is a request to see rows.
    var bkTaxOpen = false;
    try { bkTaxOpen = localStorage.getItem('bk-tax-open') === '1'; } catch (e) {}
    var bkRegOpen = false;
    try { bkRegOpen = localStorage.getItem('bk-reg-open') === '1'; } catch (e) {}

    function bkMoney(n, d) {
        d = d || 0;
        return (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US',
            { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    function bkCompact(n) {
        var a = Math.abs(n);
        return (n < 0 ? '-' : '') + '$' + (a >= 1000 ? (a / 1000).toFixed(a >= 10000 ? 0 : 1) + 'K' : a.toFixed(0));
    }
    function bkPct(n) { return (n * 100).toFixed(Math.abs(n) < 0.1 ? 2 : 1) + '%'; }
    function bkDays(a, b) { return Math.round((new Date(b) - new Date(a)) / 864e5); }
    function bkNum(v) { return v == null ? 0 : Number(v); }
    function bkProfit(d) {
        return d.sell_total == null ? null : bkNum(d.sell_total) - bkNum(d.buy_total) - bkNum(d.other_costs);
    }
    function bkMargin(d) {
        return d.sell_total ? bkProfit(d) / bkNum(d.sell_total) : null;
    }
    var BK_MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // The period filter scopes dated things only. Cash on hand is deliberately
    // exempt: it is a balance, not a flow, so slicing it by date would be a lie.
    function bkCutoff() {
        var now = new Date();
        if (bkPeriod === 'mtd') {
            return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-01';
        }
        if (bkPeriod === '90') {
            var d = new Date(now.getTime() - 90 * 864e5);
            return d.toISOString().slice(0, 10);
        }
        return '0000-00-00';
    }

    // ── Today ───────────────────────────────────────────────
    // The three questions Henry was answering by eye across three tabs:
    // who is owed a reply, who has options sitting ready, and what is still
    // being hunted. Ordered so the top of the page is the next thing to do.
    var TD = { data: null };

    async function renderToday() {
        TD.data = await A.adminFetchTo('/api/leads-admin', 'today');
        paintToday();
    }

    function tdTag(txt, colour) {
        return '<span class="tag" style="background:' + colour + ';color:#fff">' + esc(txt) + '</span>';
    }

    function tdPerson(r) {
        // Preferred channel first: most of these people asked for iMessage.
        var ph = String(r.phone || '').replace(/[^0-9+]/g, '');
        var links = [];
        if (ph) links.push('<a class="btn ghost" href="sms:' + esc(ph) +
            (r.draft_sms ? '&body=' + encodeURIComponent(r.draft_sms) : '') + '">Text</a>');
        if (ph) links.push('<a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/' +
            esc(ph.replace(/\D/g, '')) + '">WhatsApp</a>');
        if (r.email) links.push('<a class="btn ghost" href="mailto:' + esc(r.email) + '">Email</a>');

        var job = r.needs_details ? 'ask what exactly'
                : (r.matches_ready > 0 ? r.matches_ready + ' to show them' : 'nothing found yet');

        var b = r.brief || {};
        var spec = b.spec || {};
        var specBits = ['brand','model','reference','dial','size','bracelet','bezel','year','set','budget']
            .filter(function (k) { return spec[k]; })
            .map(function (k) { return k + ': ' + spec[k]; });
        var seriousColour = b.serious === 'STRONG' ? OK_GREEN
                          : b.serious === 'WEAK'   ? WARN_AMBER : '';

        return '<div class="scard" style="margin-top:8px">' +
          '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">' +
            '<b>' + esc(r.full_name || '(no name)') + '</b>' +
            (r.lead_quality === 'HOT' ? tdTag('HOT', BAD_RED) : '') +
            (b.serious ? '<span class="count" style="color:' + seriousColour + '">' +
                         esc(b.serious) + ' buyer</span>' : '') +
            '<span class="count">' + esc(r.days_quiet) + 'd quiet</span>' +
            (r.draft_kind === 'NEXT'
              ? '<span class="count" style="color:' + OK_GREEN + '">next message ready</span>' : '') +
            // An email draft reads oddly if you paste it into a text, so say so.
            (r.draft_channel === 'EMAIL'
              ? '<span class="count" style="color:' + WARN_AMBER + '">email draft</span>' : '') +
            (r.location ? '<span class="count">' + esc(r.location) + '</span>' : '') +
            '<span class="count" style="margin-left:auto">' + esc(job) + '</span>' +
          '</div>' +

          // Where this stands, read by two models. Written above the draft
          // because it is what decides whether the draft is the right reply.
          (b.status_line
            ? '<p class="count" style="margin:6px 0 0;color:inherit">' + esc(b.status_line) + '</p>'
            : '') +
          (specBits.length
            ? '<p class="count" style="margin:6px 0 0">Hunting · <b>' +
                esc(specBits.join('  ·  ')) + '</b></p>'
            : '') +
          ((b.missing || []).length
            ? '<p class="count" style="margin:4px 0 0;color:' + WARN_AMBER + '">Still need: ' +
                esc((b.missing || []).join(', ')) + '</p>'
            : '') +
          (b.next_move
            ? '<p class="count" style="margin:4px 0 0">Next · ' + esc(b.next_move) + '</p>'
            : '') +
          (b.agreed === false
            ? '<p class="count" style="margin:4px 0 0;color:' + WARN_AMBER +
              '">the two reads disagreed on part of this, worth checking</p>' : '') +

          // The actual conversation, newest last, so the reply is written with
          // the thread in view rather than from memory.
          ((r.recent || []).length
            ? '<div style="margin-top:10px;border-left:2px solid var(--line);padding-left:10px">' +
              r.recent.map(function (m) {
                  return '<p class="count" style="margin:3px 0">' +
                    '<b>' + (m.from_me ? 'You' : 'Them') + '</b> ' +
                    '<span style="opacity:.6">' + esc(fmtAgo(m.sent_at)) + '</span> · ' +
                    esc(String(m.body || '').slice(0, 220)) + '</p>';
              }).join('') +
              '</div>'
            : '') +
          (r.draft_sms
            ? '<textarea class="js-td-draft" data-draft="' + esc(r.draft_id) + '" ' +
              'style="width:100%;min-height:104px;margin:8px 0 0;font:inherit;font-size:12px;' +
              'line-height:1.5;padding:8px;background:transparent;color:inherit;' +
              'border:1px solid var(--line);border-radius:6px;resize:vertical">' +
              esc(r.draft_sms) + '</textarea>'
            : '<p class="count" style="margin:8px 0 0">No text draft. Reply in your own words.</p>') +
          '<div class="bar" style="margin-top:8px">' + links.join('') +
            (r.draft_id ? '<button class="btn ghost js-td-sent" data-draft="' + esc(r.draft_id) +
                          '">I sent this</button>' : '') +
          '</div>' +
        '</div>';
    }

    function paintToday() {
        var d = TD.data || {}, c = d.counters || {};
        var q = d.needsReply || [], h = d.hunting || [];
        var ball = q.filter(function (r) { return r.ball === 'BALL_WITH_YOU'; });
        var cold = q.filter(function (r) { return r.ball !== 'BALL_WITH_YOU'; });

        var found = h.filter(function (r) { return r.state === 'FOUND'; });
        var hunt  = h.filter(function (r) { return r.state === 'HUNTING'; });
        var vague = h.filter(function (r) { return r.state === 'TOO_VAGUE'; });

        function huntRow(r) {
            return '<tr>' +
              '<td>' + esc(r.client_name || '') +
                (r.lead_quality === 'HOT' ? ' 🔥' : '') + '</td>' +
              '<td>' + esc(r.piece || '(not stated)') +
                (r.reference ? ' <span class="count">' + esc(r.reference) + '</span>' : '') + '</td>' +
              '<td class="count">' + esc(r.days_open) + 'd</td>' +
              '<td>' + (r.options > 0
                  ? '<b>' + esc(r.options) + '</b> <span class="count">from ' +
                    esc(money(r.from_price)) + '</span>'
                  : (r.retail_available > 0
                      ? '<span class="count">' + esc(r.retail_available) + ' at retail</span>'
                      : '<span class="count">—</span>')) + '</td>' +
            '</tr>';
        }
        function huntTable(rows, note) {
            if (!rows.length) return '<p class="count">Nothing here.</p>';
            return (note ? '<p class="count">' + note + '</p>' : '') +
              '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
              '<th style="width:190px">Client</th><th>Piece</th>' +
              '<th style="width:70px">Open</th><th style="width:190px">Options</th>' +
              '</tr></thead><tbody>' + rows.map(huntRow).join('') + '</tbody></table></div>';
        }

        // The day in a sentence, before the counters. Computed in SQL from the
        // same rows shown below, so it cannot drift from them.
        var sm = d.summary || {};
        var summaryLine = '';
        if (sm.ball_with_you != null) {
            var bits = [];
            if (sm.ball_with_you) bits.push('<b>' + sm.ball_with_you + '</b> replied and are waiting on you' +
                (sm.top_name ? ', longest is <b>' + esc(sm.top_name) + '</b> at ' + sm.top_days + ' days' : ''));

                ((sm.strong_names || []).length ? ' (' + (sm.strong_names || []).map(esc).join(', ') + ')' : ''));
            if (sm.ready_to_show) bits.push('<b>' + sm.ready_to_show + '</b> have stock you could show them today');
            if (sm.too_vague) bits.push('<b>' + sm.too_vague + '</b> are still too vague to search, so the next move there is to ask, not to hunt');
            summaryLine =

        view.innerHTML =
          summaryLine +

            '<div style="display:flex;gap:24px;flex-wrap:wrap">' +

                (c.ballWithYou ? BAD_RED : OK_GREEN) + '">' + esc(c.ballWithYou || 0) + '</b></div>' +
              '<div><div class="count">Never answered</div><b style="font-size:26px;color:' +

              '<div><div class="count">Have options ready</div><b style="font-size:26px">' +
                esc(c.found || 0) + '</b></div>' +
              '<div><div class="count">Still hunting</div><b style="font-size:26px">' +
                esc(c.hunting || 0) + '</b></div>' +
              '<div><div class="count">Too vague to search</div><b style="font-size:26px;color:' +
                (c.tooVague ? WARN_AMBER : OK_GREEN) + '">' + esc(c.tooVague || 0) + '</b></div>' +
            '</div>' +
          '</div>' +

          '<p class="count" style="margin-top:22px">They replied and are waiting on you · ' +
            'this is the group that costs deals</p>' +
          (ball.length ? ball.map(tdPerson).join('') : '<p class="count">Nobody. Good.</p>') +

          '<p class="count" style="margin-top:26px">Never answered · oldest first</p>' +
          (cold.length ? cold.map(tdPerson).join('') : '<p class="count">Nobody waiting.</p>') +

          '<p class="count" style="margin-top:26px">Pieces you are hunting</p>' +

            '<p class="count">Found · stock is in the index, send them options</p>' +

        // Marking sent starts the follow-up clock, and stores whatever wording
        // Henry actually used so the drafts learn from him.
        [].forEach.call(view.querySelectorAll('.js-td-sent'), function (b) {
            b.addEventListener('click', async function () {

                btn.disabled = true; btn.textContent = 'Saving…';
                try {

                    await A.adminFetchTo('/api/leads-admin', 'mark-draft-sent',

    async function renderBooks() {
        if (!BOOKS) BOOKS = await A.adminFetchTo('/api/leads-admin', 'books');
        paintBooks();
    }

    function paintBooks() {
        var cut = bkCutoff();
        var inRange = function (d) { return d && d >= cut; };

        var sold = BOOKS.deals.filter(function (d) { return d.sell_total != null && inRange(d.date_sold); });
        var held = BOOKS.deals.filter(function (d) { return d.sell_total == null; });
        var rev = sold.reduce(function (s, d) { return s + bkNum(d.sell_total); }, 0);
        var gp = sold.reduce(function (s, d) { return s + bkProfit(d); }, 0);
        var opex = BOOKS.expenses.filter(function (e) { return inRange(e.spent_on); })
            .reduce(function (s, e) { return s + bkNum(e.amount); }, 0);
        var net = gp - opex;
        var avgDays = sold.length
            ? Math.round(sold.reduce(function (s, d) { return s + bkDays(d.date_bought, d.date_sold); }, 0) / sold.length)
            : null;
        var stock = held.reduce(function (s, d) { return s + bkNum(d.buy_total) + bkNum(d.other_costs); }, 0);

        // Tile colour is the one rule of the page: green in, red out.
        var tiles = [
            ['Revenue', bkMoney(rev), sold.length + ' piece' + (sold.length === 1 ? '' : 's') + ' sold', 'pos'],
            ['Gross profit', bkMoney(gp), rev ? bkPct(gp / rev) + ' blended margin' : '—', gp < 0 ? 'neg' : 'pos'],
            ['Overhead', bkMoney(opex), 'non-watch spend', 'neg'],
            ['Net profit', bkMoney(net), net < 0 ? 'overhead ahead of margin' : 'after overhead', net < 0 ? 'neg' : 'pos'],
            ['Cash on hand', bkMoney(BOOKS.cash), 'bank balance, all time', BOOKS.cash < 0 ? 'neg' : 'flat'],
            ['In stock', held.length ? bkMoney(stock) : '—',
                held.length ? held.length + ' piece' + (held.length === 1 ? '' : 's') + ' at cost'
                            : (avgDays === null ? 'nothing held' : 'avg ' + avgDays + 'd to sell'), 'flat']
        ];

        view.innerHTML = '<div class="bk">' +
            '<div class="bk-filters" role="group" aria-label="Period">' +

                    var label = p === 'all' ? 'All time' : p === '90' ? 'Last 90 days' : 'This month';
                    return '<button class="bk-seg" data-p="' + p + '" aria-pressed="' +
                        (bkPeriod === p) + '">' + label + '</button>';
                }).join('') +
                '<span style="flex:1"></span>' +
                '<button class="btn ghost" id="bk-xlsx">Export to Spreadsheet</button>' +
                '<button class="btn ghost" id="bk-csv">Import Bank Statement</button>' +
                '<button class="btn" id="bk-exp-new">Log Expense</button>' +
            '</div>' +
            '<div class="bk-stats">' + tiles.map(function (t) {
                return '<div class="bk-stat"><div class="bk-k">' + t[0] + '</div>' +
                    '<div class="bk-v ' + t[3] + '">' + t[1] + '</div>' +
                    '<div class="bk-s">' + t[2] + '</div></div>';
            }).join('') + '</div>' +
            '<div class="bk-tax" id="bk-tax-top"><div class="t"><div class="w">Tax calendar</div><div class="n">Loading…</div></div></div>' +
            '<div class="bk-mas">' +
                '<div class="bk-card"><h3>Cash in / cash out</h3>' +
                    '<p class="cap">Chase &middot;1791 by month. Capital included, not just deals.</p>' +
                    '<div class="bk-legend"><span><i style="background:var(--s1)"></i>Cash in</span>' +
                    '<span><i style="background:var(--s2)"></i>Cash out</span></div>' +
                    '<div class="bk-plot" id="bk-cash"><div class="bk-tip" id="bk-cash-t"></div></div></div>' +
                '<div class="bk-card"><h3>Profit per deal</h3>' +
                    '<p class="cap">Sold pieces only. Label is margin on sale price.</p>' +
                    '<div class="bk-plot" id="bk-deal"><div class="bk-tip" id="bk-deal-t"></div></div></div>' +
                '<div class="bk-card"><h3>Overhead</h3>' +
                    '<p class="cap">Expenses by category, biggest first.</p>' +
                    '<div class="bk-plot" id="bk-exp"><div class="bk-tip" id="bk-exp-t"></div></div></div>' +
                '<div class="bk-card"><h3>Money in by category</h3>' +
                    '<p class="cap">Bank money in, grouped.</p>' +
                    '<div id="bk-cats-in"></div></div>' +
                '<div class="bk-card"><h3>Spend by category</h3>' +
                    '<p class="cap">Bank money out, grouped. Click a row to filter the register.</p>' +
                    '<div id="bk-cats"></div></div>' +
                '<div class="bk-card"><h3>Monthly burn</h3>' +
                    '<p class="cap">Recurring tools. Not scoped by the period filter.</p>' +
                    '<div id="bk-subs"></div></div>' +
            '</div>' +
            '<div class="bk-card">' +
                '<div class="bk-head"><h3>Full tax calendar</h3><span class="sp"></span>' +

                '<div class="bk-head"><h3>Every transaction</h3><span class="sp"></span>' +
                '<button class="btn ghost" id="bk-reg-toggle" aria-expanded="' + bkRegOpen + '">' +
                    (bkRegOpen ? 'Hide' : 'Show') + '</button></div>' +

        [].forEach.call(view.querySelectorAll('.bk-seg'), function (b) {
            b.addEventListener('click', function () { bkPeriod = b.dataset.p; paintBooks(); });
