    // ══════════════════════════════════════════════════════════
    // LEADS
    // ══════════════════════════════════════════════════════════
    var LEADS = [], STATS = null;
    var lq = '', lsort = 'created_at', ldir = -1, lopen = null;
    var lfilter = { tile: '', status: '', days: '', type: '' };

    var STATUSES = ['new', 'contacted', 'negotiating', 'closed', 'archived'];

    async function renderLeads() {
        var r = await A.adminFetchTo('/api/leads-admin', 'list');
        LEADS = r.leads || [];
        STATS = r.stats || null;
        paintLeads();
    }

    // Tiles double as one-click filters — the fastest way to answer
    // "who do I call next" without touching a dropdown.
    var TILES = [
        { k: '',            l: 'All' },
        { k: 'new',         l: 'New' },
        { k: 'HOT',         l: 'Hot' },
        { k: 'WARM',        l: 'Warm' },
        { k: 'COLD',        l: 'Cold' },
        { k: 'REAL',        l: 'Real' },
        { k: 'JUNK',        l: 'Spam/Test' },
    ];

    function tileCount(k) {
        return leadsAfter(k, lfilter.status, lfilter.days, lq).length;
    }

    function matchTile(l, k) {
        if (!k) return true;
        if (k === 'new') return !l.status || l.status === 'new';
        if (k === 'REAL') return l.lead_class === 'REAL';
        if (k === 'JUNK') return l.lead_class === 'SPAM' || l.lead_class === 'TEST';
        // quality tiles only mean anything on real leads
        return l.lead_class === 'REAL' && l.lead_quality === k;
    }

    // Leads means people asking us to source a watch. JOIN_LIST is a private-list
    // signup, not a sourcing request, so it is out of this view by default -
    // it was padding the counts without ever being something to action.
    // The Type filter can still surface them when you want the list.
    var SOURCING_TYPES = ['BUY', 'WATCH_DETAIL', 'SELL', 'TRADE'];

    function isSourcing(l) {
        var t = l.submission_type;
        // unknown/blank types are treated as sourcing so nothing goes missing
        return !t || SOURCING_TYPES.indexOf(t) >= 0;
    }

    function leadsAfter(tile, status, days, q) {
        var cutoff = days ? Date.now() - (+days * 864e5) : 0;
        var needle = (q || '').toLowerCase();
        return LEADS.filter(function (l) {
            if (lfilter.type === '__list') { if (isSourcing(l)) return false; }
            else if (lfilter.type) { if (l.submission_type !== lfilter.type) return false; }
            else if (!isSourcing(l)) return false;
            if (!matchTile(l, tile)) return false;
            if (status && (l.status || 'new') !== status) return false;
            if (cutoff && new Date(l.created_at).getTime() < cutoff) return false;
            if (needle && JSON.stringify(l).toLowerCase().indexOf(needle) < 0) return false;
            return true;
        });
    }

    var COLS = [
        { k: 'created_at',      l: 'Date',    w: '96px' },
        { k: 'full_name',       l: 'Name' },
        { k: 'submission_type', l: 'Type',    w: '110px' },
        { k: 'watch',           l: 'Watch' },
        { k: 'lead_quality',    l: 'Quality', w: '80px' },
        { k: 'lead_class',      l: 'Class',   w: '78px' },
        { k: 'status',          l: 'Status',  w: '124px' },
    ];

    function cell(l, k) {
        if (k === 'watch') return l.watch_details || l.watch_interest || '';
        if (k === 'created_at') return l.created_at || '';
        return l[k] || '';
    }

    function sortLeads(list) {
        var k = lsort;
        return list.slice().sort(function (a, b) {
            var av = cell(a, k), bv = cell(b, k);
            if (k === 'created_at') {
                return (new Date(av).getTime() - new Date(bv).getTime()) * ldir;
            }
            // quality sorts by real urgency, not alphabetically
            if (k === 'lead_quality') {
                var R = { HOT: 3, WARM: 2, COLD: 1, '': 0 };
                return ((R[av] || 0) - (R[bv] || 0)) * ldir;
            }
            return String(av).localeCompare(String(bv)) * ldir;
        });
    }

    function fmtDate(d) {
        if (!d) return '—';
        var t = new Date(d), now = new Date();
        var days = Math.floor((now - t) / 864e5);
        if (days === 0) return 'Today';
        if (days === 1) return 'Yesterday';
        if (days < 7) return days + 'd ago';
        return t.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: t.getFullYear() === now.getFullYear() ? undefined : '2-digit' });
    }

    function paintLeads() {
        var list = sortLeads(leadsAfter(lfilter.tile, lfilter.status, lfilter.days, lq));

        var html =
            '<div class="tiles">' + TILES.map(function (t) {
                var n = leadsAfter(t.k, lfilter.status, lfilter.days, lq).length;
                return '<button class="tile" data-tile="' + t.k + '" aria-pressed="' + (lfilter.tile === t.k) + '">' +
                    '<span class="tk">' + esc(t.l) + '</span><span class="tv">' + n + '</span></button>';
            }).join('') + '</div>' +

            '<div class="bar">' +
              '<input id="l-q" class="ctl grow" type="search" placeholder="SEARCH NAME, EMAIL, PHONE, WATCH…" value="' + esc(lq) + '">' +
              '<select id="l-days" class="ctl">' +
                [['', 'ALL TIME'], ['7', 'LAST 7 DAYS'], ['30', 'LAST 30 DAYS'], ['90', 'LAST 90 DAYS']].map(function (o) {
                    return '<option value="' + o[0] + '"' + (lfilter.days === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
                }).join('') +
              '</select>' +
              '<select id="l-type" class="ctl">' +
                '<option value=""' + (lfilter.type ? '' : ' selected') + '>SOURCING REQUESTS</option>' +
                '<option value="BUY"' + (lfilter.type === 'BUY' ? ' selected' : '') + '>BUY ONLY</option>' +
                '<option value="WATCH_DETAIL"' + (lfilter.type === 'WATCH_DETAIL' ? ' selected' : '') + '>WATCH ENQUIRY ONLY</option>' +
                '<option value="__list"' + (lfilter.type === '__list' ? ' selected' : '') + '>PRIVATE LIST SIGNUPS</option>' +
              '</select>' +
              '<select id="l-status" class="ctl">' +
                '<option value=""' + (lfilter.status ? '' : ' selected') + '>ANY STATUS</option>' +
                STATUSES.map(function (v) {
                    return '<option value="' + v + '"' + (lfilter.status === v ? ' selected' : '') + '>' + v.toUpperCase() + '</option>';
                }).join('') +
              '</select>' +
              '<button class="btn ghost" id="l-csv">Export</button>' +
              '<button class="btn ghost" id="l-refresh">Refresh</button>' +
            '</div>' +

            '<p class="count">' + list.length + ' of ' + LEADS.filter(isSourcing).length + ' lead' + (LEADS.length === 1 ? '' : 's') +
              ' · sorted by ' + esc(COLS.filter(function (c) { return c.k === lsort; })[0].l.toLowerCase()) +
              (ldir < 0 ? ' (newest first)' : ' (oldest first)') + '</p>' +

            '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
              COLS.map(function (c) {
                  var on = lsort === c.k;
                  return '<th class="s' + (on ? ' on' : '') + '" data-sort="' + c.k + '"' +
                      (c.w ? ' style="width:' + c.w + '"' : '') + '>' + esc(c.l) +
                      '<span class="ar">' + (on ? (ldir < 0 ? '↓' : '↑') : '↕') + '</span></th>';
              }).join('') +
            '</tr></thead><tbody>' +
              (list.length ? list.map(leadRow).join('')
                           : '<tr><td colspan="7" style="padding:28px 0"><span class="tmono">No leads match those filters.</span></td></tr>') +
            '</tbody></table></div>';

        view.innerHTML = html;
        wireLeads();
    }

    function leadRow(l) {
        var q = l.lead_quality || '';
        var c = l.lead_class || '';
        var watch = l.watch_details || l.watch_interest || '';
        var open = lopen === l.id;

        var main = '<tr data-id="' + esc(l.id) + '">' +
            '<td><span class="tmono">' + esc(fmtDate(l.created_at)) + '</span></td>' +
            '<td><div class="tname">' + esc(l.full_name || '—') + '</div>' +
                '<div class="tsub">' + esc(l.email || l.phone || '') + '</div></td>' +
            '<td><span class="tmono">' + esc(l.submission_type || '—') + '</span></td>' +
            '<td>' + (watch ? esc(watch.length > 60 ? watch.slice(0, 60) + '…' : watch) : '<span class="tmono">—</span>') + '</td>' +
            '<td>' + (q ? '<span class="tag ' + q.toLowerCase() + '">' + esc(q) + '</span>' : '<span class="tmono">—</span>') + '</td>' +
            '<td>' + (c ? '<span class="tag ' + c.toLowerCase() + '">' + esc(c) + '</span>' : '<span class="tmono">—</span>') + '</td>' +
            '<td><select class="stat" data-status-for="' + esc(l.id) + '">' +
                STATUSES.map(function (v) {
                    return '<option value="' + v + '"' + ((l.status || 'new') === v ? ' selected' : '') + '>' + v.toUpperCase() + '</option>';
                }).join('') +
            '</select></td>' +
        '</tr>';

        if (!open) return main;

        var D = [
            ['Email', l.email], ['Phone', l.phone], ['Budget', l.budget],
            ['Type', l.submission_type], ['Watch', watch],
            ['Confidence', l.lead_confidence], ['Reason', l.lead_reason],
            ['Message', l.message || l.notes],
            ['Submitted', l.created_at ? new Date(l.created_at).toLocaleString() : ''],
        ].filter(function (d) { return d[1]; });

        return main + '<tr class="detail"><td colspan="7"><div class="dgrid">' +
            D.map(function (d) {
                return '<div><div class="dk">' + esc(d[0]) + '</div><div class="dv">' + esc(d[1]) + '</div></div>';
            }).join('') +
        '</div></td></tr>';
    }

    function wireLeads() {
        [].forEach.call(view.querySelectorAll('.tile'), function (b) {
            b.addEventListener('click', function () {
                lfilter.tile = b.dataset.tile; paintLeads();
            });
        });
        [].forEach.call(view.querySelectorAll('th.s'), function (th) {
            th.addEventListener('click', function () {
                var k = th.dataset.sort;
                // same column flips direction; a new column starts descending,
                // which is what you want for dates and quality
                if (lsort === k) ldir = -ldir; else { lsort = k; ldir = -1; }
                paintLeads();
            });
        });
        [].forEach.call(view.querySelectorAll('tbody tr[data-id]'), function (tr) {
            tr.addEventListener('click', function (e) {
                if (e.target.closest('select')) return;   // status control is not a row click
                lopen = lopen === tr.dataset.id ? null : tr.dataset.id;
                paintLeads();
            });
        });
        [].forEach.call(view.querySelectorAll('[data-status-for]'), function (sel) {
            sel.addEventListener('change', async function () {
                var id = sel.dataset.statusFor, val = sel.value;
                sel.disabled = true;
                try {
                    await A.adminFetchTo('/api/leads-admin', 'set-status', { id: id, status: val });
                    var l = LEADS.filter(function (x) { return x.id === id; })[0];
                    if (l) l.status = val;
                } catch (err) {
                    alert('Could not update status: ' + err.message);
                }
                sel.disabled = false;
                paintLeads();
            });
        });

        var q = document.getElementById('l-q');
        q.addEventListener('input', function () {
            lq = this.value;
            var pos = this.selectionStart;
            paintLeads();
            var n = document.getElementById('l-q');
            n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {}
        });
        document.getElementById('l-days').addEventListener('change', function () {
            lfilter.days = this.value; paintLeads();
        });
        document.getElementById('l-type').addEventListener('change', function () {
            lfilter.type = this.value; paintLeads();
        });
        document.getElementById('l-status').addEventListener('change', function () {
            lfilter.status = this.value; paintLeads();
        });
        document.getElementById('l-refresh').addEventListener('click', function () {
            view.innerHTML = '<p class="count">Refreshing…</p>';
            renderLeads().catch(function (e) {
                view.innerHTML = '<p class="err">Could not refresh: ' + esc(e.message || e) + '</p>';
            });
        });
        document.getElementById('l-csv').addEventListener('click', exportLeads);
    }

    function exportLeads() {
        var list = sortLeads(leadsAfter(lfilter.tile, lfilter.status, lfilter.days, lq));
        var cols = ['created_at', 'full_name', 'email', 'phone', 'submission_type', 'watch_details', 'budget', 'lead_class', 'lead_quality', 'lead_confidence', 'status'];
        var csv = [cols.join(',')].concat(list.map(function (l) {
            return cols.map(function (k) {
                return '"' + String(l[k] == null ? '' : l[k]).replace(/"/g, '""') + '"';
            }).join(',');
        })).join('\n');
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = 'dialed-leads.csv';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    // ══════════════════════════════════════════════════════════
    // WHOLESALE  — the price index scraped out of the dealer groups
    // ══════════════════════════════════════════════════════════
    var WS = { listings: [], stats: [], variants: [], alerts: [], names: {}, counters: {}, loadedAt: null };
    var wq = '';
    var wfilter = { tile: '', brand: '', group: '', days: '' };
    var wsort = 'message_ts';
    var wdir = -1;
    var wopen = null;

    var wsTimer = null;

    async function renderWholesale() {
        var r = await A.adminFetchTo('/api/leads-admin', 'wholesale');
        WS.listings = r.listings || [];
        WS.stats    = r.stats || [];
        WS.variants = r.variants || [];
        WS.alerts   = r.alerts || [];
        WS.names    = r.nameByJid || {};
        WS.counters = r.counters || {};
        WS.loadedAt = new Date().toISOString();
        paintWholesale();
        startWholesaleAuto();
    }

    // The groups post continuously and the ingest runs every minute, so a tab
    // left open goes stale within minutes. Poll on the same cadence, and stop
    // the moment another tab is showing so it is not fetching in the background.
    function startWholesaleAuto() {
        if (wsTimer) clearInterval(wsTimer);
        wsTimer = setInterval(function () {
            var onTab = document.querySelector('#tabs button[data-tab="wholesale"][aria-selected="true"]');
            if (!onTab) { clearInterval(wsTimer); wsTimer = null; return; }
            if (document.hidden) return;              // don't poll a background tab
            A.adminFetchTo('/api/leads-admin', 'wholesale').then(function (r) {
                WS.listings = r.listings || [];
                WS.stats    = r.stats || [];
                WS.variants = r.variants || [];
                WS.alerts   = r.alerts || [];
                WS.names    = r.nameByJid || {};
                WS.counters = r.counters || {};
                WS.loadedAt = new Date().toISOString();
                paintWholesale();
            }).catch(function () { /* a failed poll must not break the view */ });
        }, 60000);
    }

    var WTILES = [
        { k: '',         l: 'All' },
        { k: 'deals',    l: 'Under market' },
        { k: 'priced',   l: 'Priced' },
        { k: 'wtb',      l: 'Wanted' },
        { k: 'diamonds', l: 'Diamonds' },
        { k: 'mismatch', l: 'Photo ≠ text' },
        { k: 'weak',     l: 'Check these' },
    ];

    function matchWTile(l, k) {
        if (!k) return true;
        if (k === 'deals')    return l.delta_pct != null && l.delta_pct >= 10;
        if (k === 'priced')   return l.price_usd != null;
        if (k === 'wtb')      return l.listing_type === 'WTB' || l.listing_type === 'NTQ';
        if (k === 'diamonds') return !!l.has_diamonds;
        if (k === 'mismatch') return !!l.vision_mismatch;
        // Anything the extractor could not back up against the original message.
        if (k === 'weak')     return l.trust_score != null && l.trust_score < 70;
        return true;
    }

    function wsAfter(tile, brand, group, days, q) {
        var cutoff = days ? Date.now() - (+days * 864e5) : 0;
        var needle = (q || '').toLowerCase();
        return WS.listings.filter(function (l) {
            if (!matchWTile(l, tile)) return false;
            if (brand && (l.brand || '') !== brand) return false;
            if (group && l.group_jid !== group) return false;
            if (cutoff && new Date(l.message_ts).getTime() < cutoff) return false;
            if (needle) {
                var hay = [l.brand, l.model, l.reference, l.nickname, l.seller_name,
                           l.dial_material, l.case_material, l.bracelet].filter(Boolean).join(' ').toLowerCase();
                if (hay.indexOf(needle) < 0) return false;
            }
            return true;
        });
    }

    var WCOLS = [
        { k: 'message_ts',   l: 'Seen',   w: '92px' },
        { k: 'brand',        l: 'Watch' },
        { k: 'spec',         l: 'Spec' },
        { k: 'price_usd',    l: 'Asking', w: '104px' },
        { k: 'delta_pct',    l: 'vs Mkt', w: '104px' },
        { k: 'seller_name',  l: 'Seller', w: '150px' },
    ];

    // The dealer feed moves every minute, so "Today" tells you nothing. Show how
    // stale a listing is, because a good price posted 3 minutes ago is a very
    // different thing from the same price posted yesterday.
    function fmtAgo(t) {
        if (!t) return '—';
        var s = Math.floor((Date.now() - new Date(t).getTime()) / 1000);
        if (s < 0) s = 0;
        if (s < 60) return s + 's ago';
        if (s < 3600) return Math.floor(s / 60) + 'm ago';
        if (s < 86400) return Math.floor(s / 3600) + 'h ago';
        return Math.floor(s / 86400) + 'd ago';
    }
    function fmtClock(t) {
        if (!t) return '';
        var d = new Date(t), now = new Date();
        var time = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        return d.toDateString() === now.toDateString()
            ? time
            : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + time;
    }

    function specOf(l) {
        return [
            l.dial_material && l.dial_material !== 'STANDARD' ? l.dial_material : null,
            l.case_material ? l.case_material.replace(/_/g, ' ') : null,
            l.bracelet,
            l.has_diamonds ? 'diamonds' : null,
            l.nickname ? '"' + l.nickname + '"' : null,
        ].filter(Boolean).join(' · ');
    }

    function money(n) {
        if (n == null) return '—';
        return '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
    }

    // The model's own confidence sat at 97% average and never moved, so it told
    // us nothing. Trust is computed from things that can be checked against the
    // original message: was the reference actually written, was the price
    // written, is there a photo, does the photo agree with the caption.
    function trustCell(l) {
        if (l.trust_score == null) return '—';
        var t = Number(l.trust_score);
        var cls = t >= 85 ? 'hot' : t >= 70 ? 'warm' : 'spam';
        var why = (l.trust_why || []).join(' · ');
        return '<span class="tag ' + cls + '">' + t + '%</span>' +
               (why ? '<span class="count" style="margin-left:8px">' + esc(why) + '</span>' : '');
    }

    function wcell(l, k) {
        if (k === 'spec')  return specOf(l);
        if (k === 'trust_score') return l.trust_score == null ? null : Number(l.trust_score);
        if (k === 'brand') return [l.brand, l.model, l.reference].filter(Boolean).join(' ');
        return l[k];
    }

    function sortWs(list) {
        var k = wsort;
        return list.slice().sort(function (a, b) {
            var av = wcell(a, k), bv = wcell(b, k);
            if (k === 'message_ts') return (new Date(av) - new Date(bv)) * wdir;
            // numeric columns: nulls always sink, whichever way you sort
            if (k === 'price_usd' || k === 'delta_pct' || k === 'trust_score') {
                if (av == null && bv == null) return 0;
                if (av == null) return 1;
                if (bv == null) return -1;
                return (Number(av) - Number(bv)) * wdir;
            }
            return String(av == null ? '' : av).localeCompare(String(bv == null ? '' : bv)) * wdir;
        });
    }

    function paintWholesale() {
        var list = sortWs(wsAfter(wfilter.tile, wfilter.brand, wfilter.group, wfilter.days, wq));
        var c = WS.counters;
        var brands = Object.keys(WS.listings.reduce(function (m, l) {
            if (l.brand) m[l.brand] = 1; return m;
        }, {})).sort();

        var html =
            '<div class="tiles">' + WTILES.map(function (t) {
                var n = wsAfter(t.k, wfilter.brand, wfilter.group, wfilter.days, wq).length;
                return '<button class="tile" data-wtile="' + t.k + '" aria-pressed="' + (wfilter.tile === t.k) + '">' +
                    '<span class="tk">' + esc(t.l) + '</span><span class="tv">' + n + '</span></button>';
            }).join('') + '</div>' +

            '<div class="bar">' +
              '<input id="w-q" class="ctl grow" type="search" placeholder="SEARCH BRAND, MODEL, REF, NICKNAME, SELLER…" value="' + esc(wq) + '">' +
              '<select id="w-brand" class="ctl"><option value="">ANY BRAND</option>' +
                brands.map(function (b) {
                    return '<option value="' + esc(b) + '"' + (wfilter.brand === b ? ' selected' : '') + '>' + esc(b.toUpperCase()) + '</option>';
                }).join('') + '</select>' +
              '<select id="w-group" class="ctl"><option value="">ANY GROUP</option>' +
                Object.keys(WS.names).map(function (j) {
                    return '<option value="' + esc(j) + '"' + (wfilter.group === j ? ' selected' : '') + '>' + esc((WS.names[j] || '').toUpperCase()) + '</option>';
                }).join('') + '</select>' +
              '<select id="w-days" class="ctl">' +
                [['', 'ALL TIME'], ['1', 'LAST 24H'], ['7', 'LAST 7 DAYS'], ['30', 'LAST 30 DAYS']].map(function (o) {
                    return '<option value="' + o[0] + '"' + (wfilter.days === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
                }).join('') + '</select>' +
              '<button class="btn ghost" id="w-csv">Export</button>' +
              '<button class="btn ghost" id="w-refresh">Refresh</button>' +
            '</div>' +

            // Newest listing age is the real health signal: the ingest runs every
            // minute, so anything older than a few minutes means it has stalled.
            '<p class="count">' +
              (WS.listings.length
                ? 'Newest ' + esc(fmtAgo(WS.listings.reduce(function (a, b) {
                      return new Date(a.message_ts) > new Date(b.message_ts) ? a : b;
                  }).message_ts)) + ' · refreshed ' + esc(fmtAgo(WS.loadedAt)) + ' · auto every 60s'
                : '') +
            '</p>' +
            '<p class="count">' + list.length + ' of ' + WS.listings.length + ' listing' + (WS.listings.length === 1 ? '' : 's') +
              ' · ' + (c.quotable || 0) + ' reference' + (c.quotable === 1 ? '' : 's') + ' priceable' +
              ' · ' + (c.variants || 0) + ' variants tracked' +
              ((c.alerts || 0) ? ' · ' + c.alerts + ' alert' + (c.alerts === 1 ? '' : 's') + ' fired' : '') + '</p>' +

            '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
              WCOLS.map(function (col) {
                  var on = wsort === col.k;
                  return '<th class="s' + (on ? ' on' : '') + '" data-wsort="' + col.k + '"' +
                      (col.w ? ' style="width:' + col.w + '"' : '') + '>' + esc(col.l) +
                      '<span class="ar">' + (on ? (wdir < 0 ? '↓' : '↑') : '↕') + '</span></th>';
              }).join('') +
            '</tr></thead><tbody>' +
              (list.length ? list.map(wsRow).join('')
                           : '<tr><td colspan="6" style="padding:28px 0"><span class="tmono">Nothing matches those filters.</span></td></tr>') +
            '</tbody></table></div>';

        view.innerHTML = html;
        wireWholesale();
    }

    function wsRow(l) {
        var open = wopen === l.id;
        var d = l.delta_pct;
        // Only call something a deal when there is a real baseline behind it.
        var deltaCell = (d == null)
            ? '<span class="tmono">—</span>'
            : '<span class="tag ' + (d >= 10 ? 'hot' : (d <= -10 ? 'spam' : 'warm')) + '">' +
                  (d > 0 ? '-' : '+') + Math.abs(d) + '%</span>';

        var main = '<tr data-wid="' + esc(l.id) + '">' +
            '<td><span class="tmono">' + esc(fmtAgo(l.message_ts)) + '</span>' +
                '<div class="tsub">' + esc(fmtClock(l.message_ts)) + '</div></td>' +
            '<td><div class="wcell">' +
                (l.image_url
                    ? '<img class="wthumb" src="' + esc(l.image_url) + '" alt="" loading="lazy" decoding="async">'
                    : '<span class="wthumb wthumb--none"></span>') +
                '<span><span class="tname">' + esc([l.brand, l.model].filter(Boolean).join(' ') || '—') + '</span>' +
                '<span class="tsub">' + esc(l.reference || 'no ref') + '</span></span>' +
            '</div></td>' +
            '<td>' + (specOf(l) ? esc(specOf(l)) : '<span class="tmono">—</span>') + '</td>' +
            '<td><span class="tmono">' + esc(money(l.price_usd)) + '</span></td>' +
            '<td>' + deltaCell + '</td>' +
            '<td><span class="tsub">' + esc(l.seller_name || '—') + '</span></td>' +
        '</tr>';

        if (!open) return main;

        var rows = [
            ['Reference',   l.reference || '—'],
            ['Asking',      money(l.price_usd)],
            // An exact match now means same dial colour too, which is the single
            // biggest price driver. Where there is no number, say which reason.
            ['Market',      l.baseline_usd
                              ? money(l.baseline_usd) + ' (median of ' + l.baseline_n +
                                (l.baseline_basis === 'VARIANT'
                                  ? ' exact matches, same dial)' : ' same ref)')
                              : (l.baseline_note || 'not enough quotes yet')],
            ['Condition',   (l.condition || 'UNKNOWN').replace(/_/g, ' ')],
            ['Set',         (l.set_completeness || 'UNKNOWN').replace(/_/g, ' ')],
            ['Year',        l.year || '—'],
            ['Dial',        [l.dial_color, l.dial_material].filter(Boolean).join(' ') || '—'],
            ['Case',        [l.case_material, l.case_size_mm ? l.case_size_mm + 'mm' : null].filter(Boolean).join(' ').replace(/_/g, ' ') || '—'],
            ['Bracelet',    l.bracelet || '—'],
            ['Bezel',       l.bezel || '—'],
            ['Complications', (l.complications || []).join(', ').replace(/_/g, ' ') || '—'],
            ['Diamonds',    l.has_diamonds ? (l.diamonds_factory === true ? 'factory' : l.diamonds_factory === false ? 'aftermarket' : 'yes, source unstated') : 'no'],
            ['Group',       WS.names[l.group_jid] || l.group_jid],
            ['Type',        l.listing_type],
            ['Trust',       trustCell(l)],
            ['Read by',     l.model_used || '—'],
        ];
        if (l.vision_mismatch) {
            rows.push(['Photo says', [l.vision_brand, l.vision_model, l.vision_reference].filter(Boolean).join(' ') || '—']);
        }

        // The fields the model most often gets wrong, made editable in place.
        // A correction writes straight to the listing, so variant matching and
        // quotes pick it up immediately, and the original is kept so the
        // extractor can be measured against it.
        var EDIT = [
            ['dial_color',       'Dial colour',  l.dial_color,       null],
            ['dial_material',    'Dial material',l.dial_material,    ['', 'STANDARD','MOP','METEORITE','STONE','LACQUER','ENAMEL']],
            ['condition',        'Condition',    l.condition,        ['', 'NEW','UNWORN','PRE_OWNED','UNKNOWN']],
            ['set_completeness', 'Contents',     l.set_completeness, ['', 'FULL_SET','WATCH_AND_CARD','WATCH_ONLY','UNKNOWN']],
            ['case_material',    'Case metal',   l.case_material,    ['', 'STEEL','YELLOW_GOLD','WHITE_GOLD','ROSE_GOLD','TWO_TONE','PLATINUM','TITANIUM','CERAMIC']],
            ['bracelet',         'Bracelet',     l.bracelet,         ['', 'OYSTER','JUBILEE','OYSTERFLEX','PRESIDENT','LEATHER','RUBBER','INTEGRATED']],
            ['reference',        'Reference',    l.reference,        null],
            ['price_usd',        'Price',        l.price_usd,        null],
        ];
        var corrected = l.corrected_fields || [];

        var editHtml =
          '<p class="count" style="margin-top:14px">Fix anything the model got wrong. ' +
          'Corrections apply everywhere immediately and are kept as training data.</p>' +
          '<div class="dgrid">' + EDIT.map(function (e) {
              var was = corrected.indexOf(e[0]) >= 0;
              var input = e[3]
                ? '<select class="ctl js-fix" data-id="' + esc(l.id) + '" data-field="' + e[0] + '" style="font-size:11px;padding:5px 6px">' +
                    e[3].map(function (o) {
                        return '<option value="' + esc(o) + '"' + (String(e[2] || '') === o ? ' selected' : '') + '>' +
                               esc(o || '—') + '</option>';
                    }).join('') + '</select>'
                : '<input class="ctl js-fix" data-id="' + esc(l.id) + '" data-field="' + e[0] + '" ' +
                  'value="' + esc(e[2] == null ? '' : e[2]) + '" style="font-size:11px;padding:5px 6px;width:120px">';
              return '<div><div class="dk">' + esc(e[1]) +
                     (was ? ' <span class="tag warm">fixed</span>' : '') + '</div>' +
                     '<div class="dv">' + input + '</div></div>';
          }).join('') + '</div>';

        return main +
            '<tr class="detail"><td colspan="6"><div class="dgrid">' +
              rows.map(function (r) {
                  return '<div><div class="dk">' + esc(r[0]) + '</div><div class="dv">' + esc(String(r[1])) + '</div></div>';
              }).join('') +
            '</div>' + editHtml +
            (l.image_url ? '<img class="wshot" src="' + esc(l.image_url) + '" alt="" loading="lazy" decoding="async">' : '') +
            (l.vision_mismatch ? '<p class="note">The photo does not match the reference in the caption. Worth a look before quoting.</p>' : '') +
            '</td></tr>';
    }

    function wireWholesale() {
        var q = document.getElementById('w-q');
        if (q) q.addEventListener('input', function () { wq = this.value; var p = this.selectionStart; paintWholesale();
            var n = document.getElementById('w-q'); if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} } });

        // Corrections save on blur (text) or change (select) so a fix is one
        // action, not type-then-click. Clicks inside must not collapse the row.
        [].forEach.call(document.querySelectorAll('.js-fix'), function (el) {
            el.addEventListener('click', function (e) { e.stopPropagation(); });
            var evt = el.tagName === 'SELECT' ? 'change' : 'blur';
            el.addEventListener(evt, async function (e) {
                e.stopPropagation();
                var id = Number(this.dataset.id), field = this.dataset.field, val = this.value;
                var live = (WS.listings.filter(function (x) { return x.id === id; })[0] || {})[field];
                if (String(live == null ? '' : live) === String(val)) return;   // nothing changed
                var node = this;
                node.style.opacity = '0.5';
                try {
                    var r = await A.adminFetchTo('/api/leads-admin', 'correct-listing',
                                                 { listing_id: id, field: field, value: val });
                    // keep the in-memory row in step so a repaint does not revert it
                    WS.listings.forEach(function (x) { if (x.id === id) x[field] = r.now; });
                    node.style.opacity = '1';
                } catch (err) {
                    node.style.opacity = '1';
                    alert('Could not save: ' + err.message);
                }
            });
        });

        [['w-brand', 'brand'], ['w-group', 'group'], ['w-days', 'days']].forEach(function (pair) {
            var el = document.getElementById(pair[0]);
            if (el) el.addEventListener('change', function () { wfilter[pair[1]] = this.value; paintWholesale(); });
        });

        var rf = document.getElementById('w-refresh');
        if (rf) rf.addEventListener('click', function () {
            view.innerHTML = '<p class="count">Loading…</p>';
            renderWholesale().catch(function (e) { view.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
        });

        var csv = document.getElementById('w-csv');
        if (csv) csv.addEventListener('click', exportWholesale);

        [].forEach.call(document.querySelectorAll('[data-wtile]'), function (b) {
            b.addEventListener('click', function () { wfilter.tile = this.dataset.wtile; paintWholesale(); });
        });

        [].forEach.call(document.querySelectorAll('[data-wsort]'), function (th) {
            th.addEventListener('click', function () {
                var k = this.dataset.wsort;
                if (wsort === k) wdir = -wdir;
                else { wsort = k; wdir = (k === 'message_ts' || k === 'price_usd' || k === 'delta_pct') ? -1 : 1; }
                paintWholesale();
            });
        });

        [].forEach.call(document.querySelectorAll('tr[data-wid]'), function (tr) {
            tr.addEventListener('click', function () {
                var id = Number(this.dataset.wid);
                wopen = (wopen === id) ? null : id;
                paintWholesale();
            });
        });
    }

    function exportWholesale() {
        var list = sortWs(wsAfter(wfilter.tile, wfilter.brand, wfilter.group, wfilter.days, wq));
        var cols = ['message_ts', 'brand', 'model', 'reference', 'price_usd', 'baseline_usd', 'delta_pct',
                    'condition', 'set_completeness', 'year', 'dial_color', 'dial_material', 'case_material',
                    'case_size_mm', 'bracelet', 'bezel', 'has_diamonds', 'nickname', 'seller_name',
                    'listing_type', 'trust_score', 'model_used'];
        var csv = [cols.join(',')].concat(list.map(function (l) {
            return cols.map(function (k) {
                var s = l[k] == null ? '' : String(l[k]);
                // stop a dealer's text executing as a formula in Excel
                if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
                return '"' + s.replace(/"/g, '""') + '"';
            }).join(',');
        })).join('\n');
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = 'dialed-wholesale.csv';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    // ── go ──────────────────────────────────────────────────
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !sheet.classList.contains('hidden')) closeSheet();
    });

    // ══════════════════════════════════════════════════════════
    // MATCHES  — a client asked for it, a dealer has it
    // ══════════════════════════════════════════════════════════
    var MX = { wants: [], best: [], alerts: [], counters: {} };
    var mxView = 'matched';
    var QB = { rows: [], counters: {} };
    var RT = { rows: [], bySource: [], counters: {} };
    var mxq = '';

    async function renderMatches() {
        var r = await A.adminFetchTo('/api/leads-admin', 'matches');
        MX.wants = r.wants || []; MX.best = r.best || [];
        MX.alerts = r.alerts || []; MX.counters = r.counters || {};
        // Quote book rides along: the Prices view is where the confidence gate is
        // actually visible, and the tile count comes from it.
        try {
            var qb = await A.adminFetchTo('/api/leads-admin', 'quote-book');
            QB.rows = qb.rows || []; QB.counters = qb.counters || {};
        } catch (e) { QB = { rows: [], counters: {} }; }
        try {
            var rt = await A.adminFetchTo('/api/leads-admin', 'retail');
            RT.rows = rt.rows || []; RT.bySource = rt.bySource || []; RT.counters = rt.counters || {};
        } catch (e) { RT = { rows: [], bySource: [], counters: {} }; }
        paintMatches();
    }

    function mxRank(q) { return q === 'HOT' ? 1 : q === 'WARM' ? 2 : 3; }

    function paintMatches() {
        var c = MX.counters;
        var q = mxq.trim().toLowerCase();
        var hay = function (o) { return JSON.stringify(o).toLowerCase(); };

        var matched = MX.best.filter(function (m) { return !q || hay(m).indexOf(q) >= 0; });
        var openIds = {};
        MX.best.forEach(function (m) { openIds[m.want_id] = 1; });
        var waiting = MX.wants.filter(function (w) { return !openIds[w.id]; })
                              .filter(function (w) { return !q || hay(w).indexOf(q) >= 0; });
        var alerts = MX.alerts.filter(function (a) { return !q || hay(a).indexOf(q) >= 0; });

        var tiles = [
            { k: 'matched', l: 'Matched',  v: MX.best.length },
            { k: 'waiting', l: 'Still hunting', v: MX.wants.length - MX.best.length },
            { k: 'alerts',  l: 'Under market', v: MX.alerts.length },
            { k: 'prices',  l: 'Quotable', v: (QB.counters.quotable != null ? QB.counters.quotable : '—') },
            { k: 'retail',  l: 'Retail',   v: (RT.counters.total != null ? RT.counters.total : '—') },
        ];

        var html =
            '<div class="tiles">' + tiles.map(function (t) {
                return '<button class="tile" data-mx="' + t.k + '" aria-pressed="' + (mxView === t.k) + '">' +
                  '<span class="tk">' + esc(t.l) + '</span><span class="tv">' + t.v + '</span></button>';
            }).join('') + '</div>' +
            '<div class="bar"><input id="mx-q" class="ctl grow" type="search" ' +
              'placeholder="SEARCH CLIENT, BRAND, REFERENCE, DEALER…" value="' + esc(mxq) + '">' +
              '<button class="btn ghost" id="mx-refresh">Refresh</button></div>' +
            // Someone can enquire about a piece nobody has posted a want for
            // yet, so the lookup has to work off a bare reference too.
            '<div class="bar"><input id="mx-src" class="ctl grow" type="search" ' +
              'placeholder="SOURCE ANY REFERENCE — e.g. 126610LV">' +
              '<button class="btn ghost" id="mx-src-go">Find it</button></div>' +
            '<div class="src-panel" id="mx-src-out"></div>';

        if (mxView === 'matched') {
            html += '<p class="count">' + matched.length + ' client' + (matched.length === 1 ? '' : 's') +
                    ' with a piece available now · cheapest match each</p>' +
                    (matched.length ? matched.map(mxCard).join('')
                      : '<p class="count">Nothing matched yet. Wants stay open, so this fills as dealers post.</p>');
        } else if (mxView === 'waiting') {
            html += '<p class="count">' + waiting.length + ' open want' + (waiting.length === 1 ? '' : 's') +
                    ' with nothing in the groups yet</p>' +
                    '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
                      '<th>Client</th><th>Looking for</th><th style="width:90px">Quality</th>' +
                      '<th style="width:90px">Waiting</th><th style="width:110px">Contact</th>' +
                    '</tr></thead><tbody>' +
                    (waiting.length ? waiting.map(function (w) {
                        return '<tr>' +
                          '<td><div class="tname">' + esc(w.client_name || '—') + '</div></td>' +
                          '<td>' + esc([w.brand, w.model, w.reference].filter(Boolean).join(' ') || '—') + '</td>' +
                          '<td>' + (w.lead_quality ? '<span class="tag ' + w.lead_quality.toLowerCase() + '">' + esc(w.lead_quality) + '</span>' : '<span class="tmono">—</span>') + '</td>' +
                          '<td><span class="tmono">' + (w.days_open || 0) + 'd</span></td>' +
                          '<td>' + (w.client_phone ? '<a class="tmono" href="https://wa.me/' + esc(String(w.client_phone).replace(/\D/g,'')) + '" target="_blank" rel="noopener">WhatsApp</a>' : '<span class="tmono">—</span>') + '</td>' +
                        '</tr>';
                    }).join('') : '<tr><td colspan="5" style="padding:28px 0"><span class="tmono">Nothing open.</span></td></tr>') +
                    '</tbody></table></div>';
        } else if (mxView === 'retail') {
            var rt = RT.rows.filter(function (r) { return !q || hay(r).indexOf(q) >= 0; }).slice(0, 400);
            var c3 = RT.counters;
            html += '<p class="count">' + (c3.total || 0) + ' retail products from ' + (c3.sources || 0) +
                    ' sites · ' + (c3.with_ref || 0) + ' with a reference · ' +
                    (c3.comparable || 0) + ' complete enough to compare like for like</p>' +
                    // Source quality is the honest answer to "can I trust this":
                    // a site that never states condition can only support a
                    // reference-only comparison.
                    '<div class="tbl-wrap" style="margin-bottom:14px"><table class="leads"><thead><tr>' +
                      '<th>Source</th><th style="width:80px">Products</th><th style="width:80px">Ref</th>' +
                      '<th style="width:70px">Year</th><th style="width:90px">Condition</th><th style="width:90px">Contents</th>' +
                    '</tr></thead><tbody>' +
                    RT.bySource.map(function (s) {
                        var pct = function (n) { return s.products ? Math.round(100 * n / s.products) + '%' : '—'; };
                        return '<tr>' +
                          '<td><div class="tname">' + esc(s.name) + '</div></td>' +
                          '<td><span class="tmono">' + s.products + '</span></td>' +
                          '<td><span class="tmono">' + pct(s.with_ref) + '</span></td>' +
                          '<td><span class="tmono">' + pct(s.with_year) + '</span></td>' +
                          '<td><span class="tmono">' + pct(s.with_condition) + '</span></td>' +
                          '<td><span class="tmono">' + pct(s.with_set) + '</span></td>' +
                        '</tr>';
                    }).join('') +
                    '</tbody></table></div>' +
                    '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
                      '<th style="width:56px"></th><th>Watch</th><th style="width:120px">Source</th>' +
                      '<th style="width:110px">Price</th><th style="width:170px">Spec</th>' +
                    '</tr></thead><tbody>' +
                    (rt.length ? rt.map(function (r) {
                        var sp = [r.year, r.condition ? r.condition.replace(/_/g,' ') : null,
                                  r.set_completeness ? r.set_completeness.replace(/_/g,' ') : null]
                                 .filter(Boolean).join(' · ');
                        return '<tr>' +
                          '<td>' + (r.image_url
                              ? '<img class="wthumb" src="' + esc(r.image_url) + '" alt="" loading="lazy" decoding="async">'
                              : '<span class="wthumb wthumb--none"></span>') + '</td>' +
                          '<td><div class="tname">' + esc((r.title || '').slice(0, 70) || '—') + '</div>' +
                              '<div class="tsub">' + esc(r.reference || 'no reference') + '</div></td>' +
                          '<td><span class="tsub">' + esc(r.source_slug) + '</span></td>' +
                          '<td><span class="tmono">' + esc(money(r.price_usd)) + '</span>' +
                              (r.available === false ? '<div class="tsub">sold</div>' : '') + '</td>' +
                          '<td>' + (sp ? '<span class="tsub">' + esc(sp) + '</span>'
                                       : '<span class="tmono">not stated</span>') + '</td>' +
                        '</tr>';
                    }).join('') : '<tr><td colspan="5" style="padding:28px 0"><span class="tmono">No retail products yet.</span></td></tr>') +
                    '</tbody></table></div>';
        } else if (mxView === 'prices') {
            var qb = QB.rows.filter(function (r) { return !q || hay(r).indexOf(q) >= 0; });
            var c2 = QB.counters;
            html += '<p class="count">' +
                    (c2.quotable || 0) + ' of ' + (c2.total || 0) + ' references safe to quote · ' +
                    (c2.high || 0) + ' high confidence, ' + (c2.medium || 0) + ' medium · ' +
                    (c2.indicative || 0) + ' reference-only, ' + (c2.no_retail || 0) + ' no retail data' +
                    '</p>' +
                    '<p class="count">Your own benchmark beats anything scraped, because you know the ' +
                    'condition it applies to. Set one on any row and it takes over. ' +
                    'INDICATIVE rows compare on reference only, so they are shown to you but never quoted to a client.</p>' +
                    '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
                      '<th>Reference</th><th style="width:150px">Trades as</th>' +
                      '<th style="width:100px">Wholesale</th><th style="width:100px">Retail</th>' +
                      '<th style="width:120px">You quote</th><th style="width:110px">You make</th>' +
                      '<th style="width:110px">Confidence</th><th style="width:130px">Your price</th>' +
                    '</tr></thead><tbody>' +
                    (qb.length ? qb.map(function (r) {
                        var ok = r.quote_confidence === 'MANUAL' || r.quote_confidence === 'HIGH'
                                 || r.quote_confidence === 'MEDIUM';
                        var conf = (r.quote_confidence === 'MANUAL' || r.quote_confidence === 'HIGH') ? 'hot'
                                 : r.quote_confidence === 'MEDIUM' ? 'warm' : 'spam';
                        var spec = [r.spec_year, r.spec_condition ? r.spec_condition.replace(/_/g,' ') : null,
                                    r.spec_set ? r.spec_set.replace(/_/g,' ') : null].filter(Boolean).join(' · ');
                        return '<tr>' +
                          '<td><div class="tname">' + esc(r.reference || '—') + '</div>' +
                              '<div class="tsub">' + esc([r.brand, r.model].filter(Boolean).join(' ')) + ' · ' + (r.quotes || 0) + ' quotes</div></td>' +
                          '<td><span class="tsub">' + esc(spec || '—') + '</span></td>' +
                          '<td><span class="tmono">' + esc(money(r.wholesale_median)) + '</span></td>' +
                          '<td>' + (r.retail_benchmark
                              ? '<span class="tmono">' + esc(money(r.retail_benchmark)) + '</span>' +
                                '<div class="tsub">' + esc(r.retail_source || '') + ' · ' + (r.retail_n || 0) + '</div>'
                              : '<span class="tmono">—</span>') + '</td>' +
                          // Never show a target the system cannot defend.
                          '<td>' + (ok && r.target_quote
                              ? '<span class="tmono">' + esc(money(r.floor_quote)) + ' to ' + esc(money(r.target_quote)) + '</span>'
                              : '<span class="tmono">' + esc(money(r.floor_quote)) + ' floor only</span>') + '</td>' +
                          '<td>' + (ok && r.target_profit
                              ? '<span class="tmono">' + esc(money(r.floor_profit)) + ' to ' + esc(money(r.target_profit)) + '</span>'
                              : '<span class="tmono">' + esc(money(r.floor_profit)) + '</span>') + '</td>' +
                          '<td><span class="tag ' + conf + '">' + esc(r.quote_confidence || 'NONE') + '</span>' +
                              '<div class="tsub">' + esc(r.match_tier || '') + '</div></td>' +
                          // One field, one button. Entering a number here makes it
                          // the benchmark for this reference and promotes it out of
                          // INDICATIVE, so it becomes quotable.
                          '<td><input class="ctl js-bm-in" data-ref="' + esc(r.reference) + '" ' +
                              'style="width:78px;font-size:11px;padding:5px 6px" ' +
                              'placeholder="retail $" inputmode="numeric">' +
                              '<button class="btn ghost js-bm-save" data-ref="' + esc(r.reference) + '" ' +
                              'data-cond="' + esc(r.spec_condition || '') + '" ' +
                              'data-set="' + esc(r.spec_set || '') + '" ' +
                              'style="margin-left:4px;padding:5px 8px">Set</button></td>' +
                        '</tr>';
                    }).join('') : '<tr><td colspan="8" style="padding:28px 0"><span class="tmono">No references priced yet.</span></td></tr>') +
                    '</tbody></table></div>';
        } else {
            html += '<p class="count">' + alerts.length + ' listing' + (alerts.length === 1 ? '' : 's') +
                    ' posted under market · no client attached</p>' +
                    '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
                      '<th>Reference</th><th style="width:100px">Asking</th><th style="width:100px">Market</th>' +
                      '<th style="width:80px">Under</th><th style="width:110px">You make</th><th style="width:90px">Sellable</th>' +
                    '</tr></thead><tbody>' +
                    (alerts.length ? alerts.map(function (a) {
                        return '<tr>' +
                          '<td><div class="tname">' + esc(a.reference || '—') + '</div>' +
                              '<div class="tsub">' + (a.basis === 'VARIANT' ? 'exact variant' : 'same ref') + ' · ' + (a.sample_size || 0) + ' quotes</div></td>' +
                          '<td><span class="tmono">' + esc(money(a.price_usd)) + '</span></td>' +
                          '<td><span class="tmono">' + esc(money(a.baseline_usd)) + '</span></td>' +
                          '<td><span class="tag hot">' + Math.round(a.discount_pct || 0) + '%</span></td>' +
                          '<td><span class="tmono">' + esc(money(a.profit_at_8)) + '</span></td>' +
                          '<td>' + (a.sellable === false ? '<span class="tag spam">no room</span>' : '<span class="tmono">ok</span>') + '</td>' +
                        '</tr>';
                    }).join('') : '<tr><td colspan="6" style="padding:28px 0"><span class="tmono">No alerts yet.</span></td></tr>') +
                    '</tbody></table></div>';
        }

        view.innerHTML = html;
        wireMatches();
    }

    // A card, not a row: this is the thing Henry acts on, and it needs both
    // phone numbers and the money in one glance.
    function mxCard(m) {
        var w = m.want || {};
        var piece = [w.brand, w.model, m.reference || w.reference].filter(Boolean).join(' ') || 'Watch';
        var days = w.opened_at ? Math.floor((Date.now() - new Date(w.opened_at).getTime()) / 864e5) : 0;
        var cp = String(w.client_phone || '').replace(/\D/g, '');
        var dp = String(m.dealer_phone || '').replace(/\D/g, '');
        // A target price only exists when retail was matched like for like.
        var verified = (m.quote_confidence === 'HIGH' || m.quote_confidence === 'MEDIUM')
                       && m.quote_high != null;

        var spec = [
            m.listing && m.listing.year,
            m.listing && m.listing.condition && m.listing.condition !== 'UNKNOWN'
                ? m.listing.condition.replace(/_/g, ' ') : null,
            m.listing && m.listing.set_completeness && m.listing.set_completeness !== 'UNKNOWN'
                ? m.listing.set_completeness.replace(/_/g, ' ') : null,
            m.listing && m.listing.case_material ? m.listing.case_material.replace(/_/g, ' ') : null,
            m.listing && m.listing.dial_material && m.listing.dial_material !== 'STANDARD'
                ? m.listing.dial_material : null,
            m.listing && m.listing.has_diamonds ? 'diamonds' : null,
            m.listing && m.listing.nickname ? '"' + m.listing.nickname + '"' : null,
        ].filter(Boolean).join(' · ');

        return '<div class="bcard" style="margin-bottom:10px">' +
          '<div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px">' +
            // The dealer's own photo: how condition actually gets judged.
            (m.image_url
              ? '<img class="wthumb" style="width:64px;height:64px;flex:0 0 64px" ' +
                'src="' + esc(m.image_url) + '" alt="" loading="lazy" decoding="async">'
              : '') +
            '<div style="flex:1">' +
              '<div class="tname">' + esc(w.client_name || 'Client') +
                (w.lead_quality ? ' <span class="tag ' + w.lead_quality.toLowerCase() + '">' + esc(w.lead_quality) + '</span>' : '') +
                (w.ok_to_text === false ? ' <span class="tag spam">no texts</span>' : '') + '</div>' +
              '<div class="tsub">' + esc(piece) + ' · asked ' + (days === 0 ? 'today' : days + 'd ago') + '</div>' +
              (spec ? '<div class="tsub">' + esc(spec) + '</div>' : '') +
            '</div>' +
            // Only show a range when retail was matched like for like. Otherwise
            // the floor is the only number the system can stand behind.
            '<div style="text-align:right">' +
              '<div class="tname">' + (verified
                  ? esc(money(m.profit_low)) + ' to ' + esc(money(m.profit_high))
                  : esc(money(m.profit_low)) + '+') + '</div>' +
              '<div class="tsub">' + (verified ? 'your margin' : 'floor margin, retail unverified') + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="dgrid" style="margin-top:10px">' +
            '<div><div class="dk">Dealer asks</div><div class="dv">' + esc(money(m.dealer_price)) + '</div></div>' +
            '<div><div class="dk">You quote</div><div class="dv">' + (verified
                ? esc(money(m.quote_low)) + ' to ' + esc(money(m.quote_high))
                : esc(money(m.quote_low)) + ' floor') + '</div></div>' +
            '<div><div class="dk">Retail</div><div class="dv">' + (m.retail_median
                ? esc(money(m.retail_median)) + (m.retail_source ? ' (' + esc(m.retail_source) + ')' : '')
                : 'not comparable yet') + '</div></div>' +
            '<div><div class="dk">Confidence</div><div class="dv">' +
                esc(m.quote_confidence || 'NONE') + (m.match_tier ? ' · ' + esc(m.match_tier) : '') + '</div></div>' +
            '<div><div class="dk">Dealer</div><div class="dv">' + esc(m.dealer_name || 'unknown') + '</div></div>' +
          '</div>' +
          '<div class="row" style="gap:8px;margin-top:10px">' +
            (cp ? '<a class="btn ghost" href="https://wa.me/' + esc(cp) + '" target="_blank" rel="noopener">Message client</a>' : '') +
            (dp ? '<a class="btn ghost" href="https://wa.me/' + esc(dp) + '" target="_blank" rel="noopener">Open dealer chat</a>' : '') +
            (dp ? '<button class="btn ghost js-ask" data-listing="' + esc(m.listing_id) + '">Ask if available</button>' : '') +
            ((m.reference || w.reference)
              ? '<button class="btn ghost js-source" data-ref="' + esc(m.reference || w.reference) + '">Source it</button>'
              : '') +
            (m.listing ? '<button class="btn ghost js-piece" data-piece="' + esc(m.listing_id) + '">View the piece</button>' : '') +
          '</div>' +
          '<div class="piece-panel" data-piecefor="' + esc(m.listing_id || '') + '"></div>' +
          '<div class="src-panel" data-srcfor="' + esc(m.reference || w.reference || '') + '"></div>' +
        '</div>';
    }

    // The dealer's own photo, full size, next to every attribute that was read
    // off the post. Condition on a used watch is judged by eye, so the picture
    // is the point, not a decoration.
    function piecePanel(m) {
        var l = m.listing || {};
        var rows = [
            ['Reference',     l.reference],
            ['Asking',        l.price_usd ? money(l.price_usd) : null],
            ['Year',          l.year],
            ['Condition',     l.condition && l.condition !== 'UNKNOWN' ? l.condition.replace(/_/g, ' ') : null],
            ['Contents',      l.set_completeness && l.set_completeness !== 'UNKNOWN' ? l.set_completeness.replace(/_/g, ' ') : null],
            ['Dial',          [l.dial_color, l.dial_material && l.dial_material !== 'STANDARD' ? l.dial_material : null].filter(Boolean).join(' ')],
            ['Case',          [l.case_material, l.case_size_mm ? l.case_size_mm + 'mm' : null].filter(Boolean).join(' ').replace(/_/g, ' ')],
            ['Bezel',         l.bezel],
            ['Bracelet',      l.bracelet],
            ['Complications', (l.complications || []).join(', ').replace(/_/g, ' ')],
            ['Diamonds',      l.has_diamonds ? (l.diamonds_factory === true ? 'factory' : l.diamonds_factory === false ? 'aftermarket' : 'yes, source unstated') : null],
            ['Nickname',      l.nickname],
            ['Dealer',        l.seller_name || m.dealer_name],
            ['Posted',        l.message_ts ? fmtAgo(l.message_ts) : null],
        ].filter(function (r) { return r[1]; })
         .map(function (r) { return '<div><div class="dk">' + r[0] + '</div><div class="dv">' + esc(r[1]) + '</div></div>'; })
         .join('');

        var tcls = l.trust_score >= 85 ? 'hot' : l.trust_score >= 70 ? 'warm' : 'spam';

        return '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">' +
          '<div class="row" style="gap:16px;align-items:flex-start;flex-wrap:wrap">' +
            (m.image_url
              ? '<a href="' + esc(m.image_url) + '" target="_blank" rel="noopener">' +
                '<img src="' + esc(m.image_url) + '" alt="" loading="lazy" decoding="async" ' +
                'style="width:280px;max-width:100%;border-radius:6px;display:block"></a>'
              : '<div class="wthumb wthumb--none" style="width:280px;height:200px"></div>') +
            '<div style="flex:1;min-width:240px">' +
              '<div class="dgrid">' + rows + '</div>' +
              '<p class="count" style="margin-top:10px">Read with ' +
                '<span class="tag ' + tcls + '">' + esc(l.trust_score == null ? '—' : l.trust_score) + '</span> confidence' +
                (l.trust_why && l.trust_why.length ? ' · ' + esc(l.trust_why.join(', ')) : ' · nothing against it') +
              '</p>' +
            '</div>' +
          '</div>' +
          (m.image_url ? '<p class="count" style="margin-top:8px">Click the photo to open it full size</p>' : '') +
        '</div>';
    }

    // Every place this reference can be had right now. Group chats are the real
    // wholesale channel, but a store holding one in stock is still an option:
    // he DMs them and asks for a trade price. Their window price is shown as
    // written, because what they would actually sell it to him for is a
    // conversation, not a number this can work out.
    function srcRow(o) {
        var retail = o.o_channel === 'RETAIL';
        var where  = retail
            ? (o.o_url ? '<a href="' + esc(o.o_url) + '" target="_blank" rel="noopener">' + esc(o.o_source) + '</a>'
                       : esc(o.o_source))
            : esc(o.o_source);
        var reach = '';
        if (!retail) {
            var ph = String(o.o_contact || '').replace(/\D/g, '');
            reach = ph ? '<a class="btn ghost" style="padding:3px 8px;font-size:10px" href="https://wa.me/' +
                         esc(ph) + '" target="_blank" rel="noopener">WhatsApp</a>' : esc(o.o_contact || '');
        } else if (o.o_contact) {
            reach = '<a class="btn ghost" style="padding:3px 8px;font-size:10px" href="' +
                    esc(o.o_contact.indexOf('http') === 0 ? o.o_contact : 'https://instagram.com/' + o.o_contact.replace(/^@/, '')) +
                    '" target="_blank" rel="noopener">DM store</a>';
        }
        var spec = [o.o_year,
                    o.o_condition && o.o_condition !== 'UNKNOWN' ? o.o_condition.replace(/_/g, ' ') : null,
                    o.o_set && o.o_set !== 'UNKNOWN' ? o.o_set.replace(/_/g, ' ') : null]
                   .filter(Boolean).join(' · ');
        // How old the row is matters more on the retail side: a store listing is
        // only refreshed when the catalogue syncs, so a piece that sold weeks ago
        // can still read as in stock. Say so rather than implying it is live.
        var ageMs = o.o_seen_at ? (Date.now() - new Date(o.o_seen_at).getTime()) : null;
        var days  = ageMs == null ? null : Math.floor(ageMs / 864e5);
        var stale = retail && days != null && days >= 3;
        var seen  = o.o_seen_at
            ? '<div class="count"' + (stale ? ' style="color:#b98900"' : '') + '>' +
              (retail ? 'seen ' : 'posted ') + esc(fmtAgo(o.o_seen_at)) +
              (stale ? ' · confirm it is still there' : '') + '</div>'
            : '';

        return '<tr>' +
            '<td><span class="tag ' + (retail ? 'warm' : 'hot') + '">' + (retail ? 'RETAIL' : 'WHOLESALE') + '</span></td>' +
            '<td>' + where + seen + '</td>' +
            '<td>' + esc(o.o_title || '—') + (spec ? '<div class="count">' + esc(spec) + '</div>' : '') + '</td>' +
            '<td style="text-align:right">' + esc(money(o.o_price_usd)) +
                '<div class="count">' + (retail ? 'window price' : 'dealer ask') + '</div></td>' +
            '<td>' + reach + '</td>' +
        '</tr>';
    }

    function paintSourcing(ref, box) {
        box.innerHTML = '<p class="count" style="margin-top:10px">Looking…</p>';
        A.adminFetchTo('/api/leads-admin', 'sourcing', { reference: ref }).then(function (d) {
            var list = d.options || [];
            if (!list.length) {
                box.innerHTML = '<p class="count" style="margin-top:10px">Nothing in the groups or in stock anywhere right now.</p>';
                return;
            }
            box.innerHTML =
              '<p class="count" style="margin-top:12px">' + d.wholesale_n + ' in the group chats · ' +
              d.retail_n + ' sitting in stock at a store. Store prices are their window price, ' +
              'so ask for a trade price before you quote off them.</p>' +
              '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
                '<th style="width:96px">Channel</th><th style="width:150px">Where</th><th>Piece</th>' +
                '<th style="width:120px;text-align:right">Asking</th><th style="width:110px">Reach</th>' +
              '</tr></thead><tbody>' + list.map(srcRow).join('') + '</tbody></table></div>';
        }).catch(function (e) {
            box.innerHTML = '<p class="count" style="margin-top:10px">Could not load options: ' + esc(e.message || e) + '</p>';
        });
    }

    function wireMatches() {
        [].forEach.call(document.querySelectorAll('[data-mx]'), function (b) {
            b.addEventListener('click', function () { mxView = this.dataset.mx; paintMatches(); });
        });
        var q = document.getElementById('mx-q');
        if (q) q.addEventListener('input', function () {
            mxq = this.value; var p = this.selectionStart; paintMatches();
            var n = document.getElementById('mx-q');
            if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} }
        });
        var r = document.getElementById('mx-refresh');
        if (r) r.addEventListener('click', function () {
            view.innerHTML = '<p class="count">Loading…</p>';
            renderMatches().catch(function (e) { view.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
        });

        // Save a manual benchmark. It is stored against the spec this reference
        // actually trades in, so it is a like-for-like number rather than a
        // headline figure.
        [].forEach.call(document.querySelectorAll('.js-bm-save'), function (b) {
            b.addEventListener('click', async function () {
                var ref = this.dataset.ref;
                var input = document.querySelector('.js-bm-in[data-ref="' + ref + '"]');
                var val = input && input.value.trim();
                if (!val) { if (input) input.focus(); return; }
                var btn = this;
                btn.disabled = true; btn.textContent = '…';
                try {
                    await A.adminFetchTo('/api/leads-admin', 'set-benchmark', {
                        reference: ref,
                        retail_price: val,
                        condition: this.dataset.cond || null,
                        set_completeness: this.dataset.set || null,
                    });
                    btn.textContent = 'Saved';
                    // Re-read so the row flips out of INDICATIVE immediately.
                    renderMatches().catch(function () {});
                } catch (e) {
                    btn.disabled = false; btn.textContent = 'Set';
                    alert('Could not save: ' + e.message);
                }
            });
        });

        // Sends from Henry's own WhatsApp, so confirm first. Deliberately one
        // dealer at a time: an automated blast to people he trades with is the
        // quickest way to get the number flagged.
        [].forEach.call(document.querySelectorAll('.js-ask'), function (b) {
            b.addEventListener('click', async function () {
                var id = this.dataset.listing;
                if (!confirm('Send "is this still available?" to this dealer from your WhatsApp?')) return;
                var btn = this;
                btn.disabled = true; btn.textContent = 'Sending…';
                try {
                    var r = await A.adminFetchTo('/api/leads-admin', 'ask-dealer', { listing_id: Number(id) });
                    btn.textContent = 'Asked ✓';
                } catch (e) {
                    btn.disabled = false; btn.textContent = 'Ask if available';
                    alert('Could not send: ' + e.message);
                }
            });
        });

        var srcGo = document.getElementById('mx-src-go');
        var srcIn = document.getElementById('mx-src');
        var srcOut = document.getElementById('mx-src-out');
        function runLookup() {
            var ref = (srcIn.value || '').trim();
            if (!ref) { srcOut.innerHTML = ''; return; }
            paintSourcing(ref, srcOut);
        }
        if (srcGo) srcGo.addEventListener('click', runLookup);
        if (srcIn) srcIn.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); runLookup(); }
        });

        [].forEach.call(document.querySelectorAll('.js-piece'), function (b) {
            b.addEventListener('click', function () {
                var box = this.closest('.bcard').querySelector('.piece-panel');
                if (!box) return;
                if (box.innerHTML) { box.innerHTML = ''; this.textContent = 'View the piece'; return; }
                var id = String(this.dataset.piece);
                var m = (MX.best || []).filter(function (r) { return String(r.listing_id) === id; })[0];
                if (!m) return;
                box.innerHTML = piecePanel(m);
                this.textContent = 'Hide the piece';
            });
        });

        [].forEach.call(document.querySelectorAll('.js-source'), function (b) {
            b.addEventListener('click', function () {
                var ref = this.dataset.ref;
                var box = this.closest('.bcard').querySelector('.src-panel');
                if (!box) return;
                // second click closes it again
                if (box.innerHTML) { box.innerHTML = ''; this.textContent = 'Source it'; return; }
                this.textContent = 'Hide options';
                paintSourcing(ref, box);
            });
        });
    }

    var BY = { rows: [], counters: {} };

    function byAfter(f, q) {
        var needle = (q || '').toLowerCase();
        return BY.rows.filter(function (r) {
            if (f === 'sourceable' && !r.can_source) return false;
            if (f === 'store' && !r.store_beats_group) return false;
            if (f === 'nosupply' && r.can_source) return false;
            if (needle) {
                var hay = [r.reference, r.brand, r.model, r.nickname].filter(Boolean).join(' ').toLowerCase();
                if (hay.indexOf(needle) < 0) return false;
            }
            return true;

    function byRow(r) {
