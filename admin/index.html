    // ══════════════════════════════════════════════════════════
    // ACCURACY  — everything needed to tune the extractor
    // ══════════════════════════════════════════════════════════
    var AC = { flows: [], scorecard: [], coverage: [], samples: [] };
    var acOnly = '', acSort = 'recent', acOpen = null;

    async function renderAccuracy() {
        AC = await A.adminFetchTo('/api/leads-admin', 'accuracy', { only: acOnly, sort: acSort });
        paintAccuracy();
    }

    // Small inline SVG charts. No library, no external request, and they read
    // the same numbers as the tables underneath so the two cannot disagree.
    function svgBars(rows, opts) {
        opts = opts || {};
        if (!rows.length) return '<p class="count">no data</p>';
        var labW = opts.labW || 150, barW = opts.barW || 300, rh = 24;
        var H = rows.length * rh + 8, max = opts.max || Math.max.apply(null, rows.map(function (r) { return r.v; })) || 1;
        return '<svg viewBox="0 0 ' + (labW + barW + 70) + ' ' + H + '" width="100%" ' +
               'style="max-width:' + (labW + barW + 70) + 'px;overflow:visible" role="img">' +
          rows.map(function (r, i) {
              var y = i * rh + 4, w = Math.max(1, (r.v / max) * barW);
              return '<text x="0" y="' + (y + 12) + '" font-size="11" fill="var(--l2)">' +
                       esc(r.k.length > 22 ? r.k.slice(0, 21) + '…' : r.k) + '</text>' +
                     '<rect x="' + labW + '" y="' + y + '" width="' + w + '" height="14" rx="3" fill="' +
                       (r.c || 'var(--l1)') + '"></rect>' +
                     '<text x="' + (labW + w + 6) + '" y="' + (y + 11) + '" font-size="11" fill="var(--l3)">' +
                       esc(r.t != null ? r.t : r.v) + '</text>';
          }).join('') + '</svg>';
    }

    // Trust spread across buckets: the shape of how good the reads are.
    function svgHistogram(samples) {
        var B = [[0, 49], [50, 69], [70, 84], [85, 99], [100, 100]];
        var LBL = ['0-49', '50-69', '70-84', '85-99', '100'];
        var COL = ['#b23', '#b23', '#b98900', 'var(--l1)', 'var(--l1)'];
        var counts = B.map(function (b) {
            return samples.filter(function (s) {
                return s.trust_score != null && s.trust_score >= b[0] && s.trust_score <= b[1];
            }).length;
        });
        var max = Math.max.apply(null, counts) || 1;
        var W = 440, H = 130, bw = W / B.length;
        return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:' + W + 'px" role="img">' +
          counts.map(function (n, i) {
              var h = Math.round((n / max) * (H - 34)), x = i * bw + 10, y = H - 22 - h;
              return '<rect x="' + x + '" y="' + y + '" width="' + (bw - 20) + '" height="' + Math.max(h, 1) +
                     '" rx="3" fill="' + COL[i] + '"></rect>' +
                     '<text x="' + (x + (bw - 20) / 2) + '" y="' + (y - 4) + '" font-size="11" ' +
                       'text-anchor="middle" fill="var(--l2)">' + n + '</text>' +
                     '<text x="' + (x + (bw - 20) / 2) + '" y="' + (H - 6) + '" font-size="10" ' +
                       'text-anchor="middle" fill="var(--l3)">' + LBL[i] + '</text>';
          }).join('') + '</svg>';
    }

    function acSample(s) {
        var out = [
            ['Reference', s.reference], ['Price', s.price_usd ? money(s.price_usd) : null],
            ['Brand', s.brand], ['Model', s.model], ['Year', s.year],
            ['Condition', s.condition], ['Contents', s.set_completeness],
            ['Dial', [s.dial_color, s.dial_material].filter(Boolean).join(' ')],
            ['Case', s.case_material], ['Bracelet', s.bracelet], ['Nickname', s.nickname],
        ].filter(function (r) { return r[1]; })
         .map(function (r) { return '<div><div class="dk">' + r[0] + '</div><div class="dv">' +
                esc(String(r[1]).replace(/_/g, ' ')) + '</div></div>'; }).join('');

        var vis = (s.vision_brand || s.vision_model || s.vision_reference)
            ? '<p class="count" style="margin-top:8px">Photo read as: ' +
              esc([s.vision_brand, s.vision_model, s.vision_reference].filter(Boolean).join(' ')) +
              (s.vision_mismatch ? ' — disagrees with the caption' : '') + '</p>' : '';

        return '<tr class="ac-detail"><td colspan="7">' +
          '<p class="count">What the dealer actually wrote</p>' +
          '<pre style="white-space:pre-wrap;font-size:12px;margin:6px 0 12px;opacity:.85">' +
            esc(s.source_text || '(no caption, photo only)') + '</pre>' +
          '<p class="count">What the model returned</p>' +
          '<div class="dgrid" style="margin-top:6px">' + (out || '<div class="count">nothing</div>') + '</div>' +
          vis +
          '<p class="count" style="margin-top:10px">' +
            'self-rated ' + esc(s.self_confidence == null ? '—' : s.self_confidence + '%') +
            ' · measured ' + esc(s.trust_score == null ? '—' : s.trust_score) +
            (s.trust_why && s.trust_why.length ? ' (' + esc(s.trust_why.join(', ')) + ')' : '') +
            ' · ' + esc(s.run_model) +
            (s.latency_ms ? ' · ' + Math.round(s.latency_ms / 100) / 10 + 's' : '') +
            (s.tokens_in ? ' · ' + s.tokens_in + ' in / ' + s.tokens_out + ' out' : '') +
            (s.corrected_fields && s.corrected_fields.length
              ? ' · you fixed: ' + esc(s.corrected_fields.join(', ')) : '') +
          '</p></td></tr>';
    }

    function paintAccuracy() {
        var FILTERS = [
            { k: '',          l: 'Recent' },
            { k: 'weak',      l: 'Weak reads' },
            { k: 'mismatch',  l: 'Photo ≠ text' },
            { k: 'noref',     l: 'No reference' },
            { k: 'noprice',   l: 'No price' },
            { k: 'corrected', l: 'You corrected' },
        ];

        // Charts first, tables underneath. Same numbers, two ways of reading.
        var flows = (AC.flows || []).filter(function (f) { return f.runs > 0; });
        var cov = (AC.coverage || []).filter(function (c) { return c.listings > 20; })
                    .sort(function (a, b) { return a.pct - b.pct; });
        var sc = AC.scorecard || [];

        view.innerHTML =
          '<div class="row" style="gap:26px;flex-wrap:wrap;align-items:flex-start;margin-bottom:8px">' +

            '<div style="flex:1;min-width:300px">' +
              '<p class="count">Failure rate by flow, last hour · a fault fixed earlier today ' +
              'still sits in the 24h column, so this ranks on what is happening now</p>' +
              svgBars(flows.map(function (f) {
                  var pct = f.failure_pct_1h == null ? 0 : Number(f.failure_pct_1h);
                  return { k: f.workflow_name, v: pct,
                           t: (f.runs_1h ? pct + '% of ' + Number(f.runs_1h).toLocaleString() + ' this hour'
                                         : 'idle this hour'),
                           c: pct >= 50 ? '#b23' : pct >= 5 ? '#b98900' : 'var(--l1)' };
              }), { max: 100, labW: 160, barW: 200 }) +
            '</div>' +

            '<div style="flex:1;min-width:300px">' +
              '<p class="count">Field coverage, worst first · what to fix in the prompt</p>' +
              svgBars(cov.slice(0, 12).map(function (c) {
                  return { k: c.field, v: Number(c.pct), t: c.pct + '%',
                           c: c.pct >= 90 ? 'var(--l1)' : c.pct >= 70 ? '#b98900' : '#b23' };
              }), { max: 100, labW: 130, barW: 200 }) +
            '</div>' +

            '<div style="flex:1;min-width:280px">' +
              '<p class="count">Trust spread across the reads shown below</p>' +
              svgHistogram(AC.samples || []) +
              '<p class="count">A healthy shape leans right. Anything left of 70 could not be ' +
              'backed up against the dealer\'s own message.</p>' +
            '</div>' +

            (sc.length ? '<div style="flex:1;min-width:300px">' +
              '<p class="count">Model comparison · share of reads that came out solid</p>' +
              svgBars(sc.map(function (m) {
                  return { k: String(m.model).split('/').pop(), v: Number(m.pct_solid),
                           t: m.pct_solid + '% solid of ' + Number(m.listings).toLocaleString(),
                           c: m.pct_solid >= 80 ? 'var(--l1)' : m.pct_solid >= 60 ? '#b98900' : '#b23' };
              }), { max: 100, labW: 140, barW: 190 }) +
            '</div>' : '') +

          '</div>' +

          // n8n's own numbers, collected every 15 minutes.
          '<p class="count">Flow runs, last 24 hours · collected from n8n every 15 minutes</p>' +
          '<div class="tbl-wrap" style="margin-bottom:20px"><table class="leads"><thead><tr>' +
            '<th style="width:90px">State</th><th>Flow</th>' +
            '<th style="width:150px">Last hour</th><th style="width:150px">Last 24h</th>' +
            '<th style="width:110px">Last run</th>' +
          '</tr></thead><tbody>' +
          (AC.flows || []).map(function (f) {
              // HEALED matters: a flow fixed at lunchtime still carries its
              // failures in the daily figure and would otherwise read as broken.
              var cls = (f.status === 'OK' || f.status === 'HEALED') ? 'hot'
                      : (f.status === 'IDLE' || f.status === 'FLAKY') ? 'warm' : 'spam';
              return '<tr>' +
                '<td><span class="tag ' + cls + '">' + esc(f.status) + '</span></td>' +
                '<td>' + esc(f.workflow_name) + (f.active === false
                    ? ' <span class="count">(off)</span>' : '') + '</td>' +
                '<td>' + (f.runs_1h ? Number(f.runs_1h).toLocaleString() + ' runs' +
                            '<div class="count">' + Number(f.errors_1h).toLocaleString() +
                            ' failed · ' + esc(f.failure_pct_1h) + '%</div>'
                          : '<span class="count">idle</span>') + '</td>' +
                '<td>' + Number(f.runs).toLocaleString() + ' runs' +
                    '<div class="count">' + Number(f.errors).toLocaleString() +
                    ' failed · ' + esc(f.failure_pct) + '%</div></td>' +
                '<td>' + esc(fmtAgo(f.last_run_at)) + '</td>' +
              '</tr>';
          }).join('') +
          '</tbody></table></div>' +

          '<p class="count">Model scorecard · graded against the original message, not the ' +
          'model\'s own confidence</p>' +
          '<div class="tbl-wrap" style="margin-bottom:20px"><table class="leads"><thead><tr>' +
            '<th>Model</th><th style="width:80px">Read</th><th style="width:80px">Trust</th>' +
            '<th style="width:80px">Solid</th><th style="width:80px">Weak</th>' +
            '<th style="width:80px">Ref</th><th style="width:80px">Price</th>' +
            '<th style="width:90px">Mismatch</th><th style="width:90px">Corrected</th>' +
            '<th style="width:80px">Speed</th><th style="width:110px">Tokens</th>' +
          '</tr></thead><tbody>' +
          (AC.scorecard || []).map(function (m) {
              var tcls = m.avg_trust >= 90 ? 'hot' : m.avg_trust >= 80 ? 'warm' : 'spam';
              return '<tr>' +
                '<td>' + esc(m.model) + (m.fixed_fields
                    ? '<div class="count">fixed: ' + esc(m.fixed_fields) + '</div>' : '') + '</td>' +
                '<td>' + Number(m.listings).toLocaleString() + '</td>' +
                '<td><span class="tag ' + tcls + '">' + esc(m.avg_trust) + '</span></td>' +
                '<td>' + esc(m.pct_solid) + '%</td><td>' + esc(m.pct_weak) + '%</td>' +
                '<td>' + esc(m.pct_reference) + '%</td><td>' + esc(m.pct_price) + '%</td>' +
                '<td>' + esc(m.pct_mismatch) + '%</td><td>' + esc(m.pct_corrected) + '%</td>' +
                '<td>' + (m.avg_ms ? Math.round(m.avg_ms / 1000) + 's' : '—') + '</td>' +
                '<td>' + (m.avg_tokens_in ? m.avg_tokens_in + ' / ' + m.avg_tokens_out : '—') + '</td>' +
              '</tr>';
          }).join('') +
          '</tbody></table></div>' +

          // Where the extractor is thin, worst first. This is the list that
          // tells you what to change in the prompt.
          '<p class="count">Field coverage · how often each field comes back filled, worst first</p>' +
          '<div class="tbl-wrap" style="margin-bottom:20px"><table class="leads"><thead><tr>' +
            '<th style="width:180px">Field</th><th style="width:180px">Model</th>' +
            '<th style="width:110px">Filled</th><th>Rate</th>' +
          '</tr></thead><tbody>' +
          (AC.coverage || []).filter(function (c) { return c.listings > 20; }).map(function (c) {
              var w = Math.max(0, Math.min(100, Number(c.pct)));
              return '<tr>' +
                '<td>' + esc(c.field) + '</td><td class="count">' + esc(c.run_model) + '</td>' +
                '<td>' + c.filled + ' / ' + c.listings + '</td>' +
                '<td><div style="background:var(--line);height:8px;border-radius:4px;overflow:hidden">' +
                  '<div style="width:' + w + '%;height:8px;background:' +
                  (w >= 90 ? 'var(--l1)' : w >= 70 ? '#b98900' : '#b23') + '"></div></div>' +
                  '<div class="count">' + esc(c.pct) + '%</div></td>' +
              '</tr>';
          }).join('') +
          '</tbody></table></div>' +

          '<div class="bar">' +
            FILTERS.map(function (f) {
                return '<button class="btn ghost" data-ac="' + f.k + '" ' +
                  (acOnly === f.k ? 'style="border-color:var(--l1)"' : '') + '>' + esc(f.l) + '</button>';
            }).join('') +
            '<button class="btn ghost" data-acsort="' + (acSort === 'worst' ? 'recent' : 'worst') + '">' +
              (acSort === 'worst' ? 'Sorted: worst first' : 'Sorted: newest first') + '</button>' +
          '</div>' +
          '<p class="count">' + (AC.samples || []).length + ' reads · click any row to see the ' +
          'dealer\'s original message next to what the model returned</p>' +
          '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
            '<th style="width:70px">Trust</th><th style="width:150px">Watch</th>' +
            '<th style="width:110px">Reference</th><th style="width:110px">Price</th>' +
            '<th>Why it scored that</th><th style="width:90px">Model</th>' +
            '<th style="width:80px">Seen</th>' +
          '</tr></thead><tbody>' +
          (AC.samples || []).map(function (s) {
              var tcls = s.trust_score >= 85 ? 'hot' : s.trust_score >= 70 ? 'warm' : 'spam';
              var row = '<tr data-acrow="' + esc(s.id) + '" style="cursor:pointer">' +
                '<td><span class="tag ' + tcls + '">' + esc(s.trust_score == null ? '—' : s.trust_score) + '</span></td>' +
                '<td>' + esc([s.brand, s.model].filter(Boolean).join(' ') || '—') + '</td>' +
                '<td>' + esc(s.reference || '—') + '</td>' +
                '<td>' + esc(s.price_usd ? money(s.price_usd) : '—') + '</td>' +
                '<td class="count">' + esc((s.trust_why || []).join(' · ') || 'nothing against it') + '</td>' +
                '<td class="count">' + esc(String(s.run_model).split('/').pop()) + '</td>' +
                '<td>' + esc(fmtAgo(s.message_ts)) + '</td>' +
              '</tr>';
              return row + (acOpen === s.id ? acSample(s) : '');
          }).join('') +
          '</tbody></table></div>';

        [].forEach.call(document.querySelectorAll('[data-ac]'), function (b) {
            b.addEventListener('click', function () { acOnly = this.dataset.ac; acOpen = null; renderAccuracy(); });
        });
        [].forEach.call(document.querySelectorAll('[data-acsort]'), function (b) {
            b.addEventListener('click', function () { acSort = this.dataset.acsort; acOpen = null; renderAccuracy(); });
        });
        [].forEach.call(document.querySelectorAll('[data-acrow]'), function (r) {
            r.addEventListener('click', function () {
                var id = Number(this.dataset.acrow);
                acOpen = (acOpen === id) ? null : id;
                paintAccuracy();
            });
        });
    }

    // ══════════════════════════════════════════════════════════
    // HEALTH  — is anything actually flowing
    // ══════════════════════════════════════════════════════════
    var hlTimer = null;

    function fmtAge(m) {
        if (m == null) return 'never';
        if (m < 60)    return m + 'm ago';
        if (m < 1440)  return Math.floor(m / 60) + 'h ago';
        return Math.floor(m / 1440) + 'd ago';
    }

    async function renderHealth() {
        var d = await A.adminFetchTo('/api/leads-admin', 'health');
        var steps = d.steps || [];
        var bad = d.dead + d.stale;

        view.innerHTML =
          '<div class="tiles">' +
            '<div class="tile"><span class="tk">Steps</span><span class="tv">' + steps.length + '</span></div>' +
            '<div class="tile"><span class="tk">Stale</span><span class="tv">' + d.stale + '</span></div>' +
            '<div class="tile"><span class="tk">Dead</span><span class="tv">' + d.dead + '</span></div>' +
          '</div>' +
          '<p class="count">' + (bad === 0
            ? 'Everything has produced something recently.'
            : bad + ' step' + (bad === 1 ? '' : 's') + ' not producing. A flow can be broken for weeks ' +
              'and the only symptom is silence here.') +
          ' Checked ' + esc(new Date(d.checked_at).toLocaleTimeString()) + '.</p>' +
          '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
            '<th style="width:90px">State</th><th style="width:190px">Step</th><th>What it does</th>' +
            '<th style="width:110px">Last</th><th style="width:110px;text-align:right">Recent</th>' +
          '</tr></thead><tbody>' +
          steps.map(function (s) {
              var cls = s.status === 'OK' ? 'hot' : s.status === 'STALE' ? 'warm' : 'spam';
              return '<tr>' +
                '<td><span class="tag ' + cls + '">' + esc(s.status) + '</span></td>' +
                '<td>' + esc(s.step) + '</td>' +
                '<td class="count">' + esc(s.detail) + '</td>' +
                '<td>' + esc(fmtAge(s.age_mins)) + '</td>' +
                '<td style="text-align:right">' + esc(s.volume == null ? '—' : Number(s.volume).toLocaleString()) + '</td>' +
              '</tr>';
          }).join('') +
          '</tbody></table></div>' +

          // How good the extractor actually is. Not its own confidence, which
          // sat at 94 and never moved, but the score computed against the
          // original message plus how often a human had to step in.
          '<p class="count" style="margin-top:22px">Extraction accuracy · graded against the ' +
          'original WhatsApp message, not the model\'s opinion of itself</p>' +
          '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
            '<th style="width:180px">Model</th><th style="width:80px">Read</th>' +
            '<th style="width:80px">Trust</th><th style="width:90px">Solid</th>' +
            '<th style="width:90px">Weak</th><th style="width:80px">Ref</th>' +
            '<th style="width:80px">Price</th><th style="width:90px">Corrected</th>' +
            '<th style="width:80px">Speed</th>' +
          '</tr></thead><tbody>' +
          (d.scorecard || []).map(function (m) {
              var tcls = m.avg_trust >= 90 ? 'hot' : m.avg_trust >= 80 ? 'warm' : 'spam';
              return '<tr>' +
                '<td>' + esc(m.model) + (m.fixed_fields
                    ? '<div class="count">fixed: ' + esc(m.fixed_fields) + '</div>' : '') + '</td>' +
                '<td>' + Number(m.listings).toLocaleString() + '</td>' +
                '<td><span class="tag ' + tcls + '">' + esc(m.avg_trust) + '</span></td>' +
                '<td>' + esc(m.pct_solid) + '%</td>' +
                '<td>' + esc(m.pct_weak) + '%</td>' +
                '<td>' + esc(m.pct_reference) + '%</td>' +
                '<td>' + esc(m.pct_price) + '%</td>' +
                '<td>' + esc(m.pct_corrected) + '%</td>' +
                '<td>' + (m.avg_ms ? Math.round(m.avg_ms / 1000) + 's' : '—') + '</td>' +
              '</tr>';
          }).join('') +
          '</tbody></table></div>' +
          '<p class="count">Solid is 85+, weak is under 70. Corrected is the only real ground ' +
          'truth there is, so the more you fix in Wholesale the sharper this gets.</p>';

        // Keep it live while he is looking at it, and stop the moment he is not.
        if (hlTimer) clearInterval(hlTimer);
        hlTimer = setInterval(function () {
            var on = document.querySelector('#tabs button[data-tab="health"][aria-selected="true"]');
            if (!on || document.hidden) { clearInterval(hlTimer); hlTimer = null; return; }
            renderHealth();
        }, 60000);
    }

    async function renderRetail() {
        var r = await A.adminFetchTo('/api/leads-admin', 'retail');
        RT.rows = r.rows || []; RT.bySource = r.bySource || []; RT.counters = r.counters || {};
        paintRetail();
    }

    function paintRetail() {
        var q = rtq.trim().toLowerCase();
        var rows = RT.rows.filter(function (r) {
            if (rtSource && r.source_slug !== rtSource) return false;
            if (!q) return true;
            return [r.title, r.reference, r.brand, r.source_slug].filter(Boolean)
                   .join(' ').toLowerCase().indexOf(q) >= 0;
        });
        var c = RT.counters;
        var shown = rows.slice(0, 400);

        view.innerHTML =
          '<div class="tiles">' +
            '<div class="tile"><span class="tk">Products</span><span class="tv">' + (c.total || 0) + '</span></div>' +
            '<div class="tile"><span class="tk">With reference</span><span class="tv">' + (c.with_ref || 0) + '</span></div>' +
            '<div class="tile"><span class="tk">Comparable</span><span class="tv">' + (c.comparable || 0) + '</span></div>' +
            '<div class="tile"><span class="tk">Sources</span><span class="tv">' + (c.sources || 0) + '</span></div>' +
          '</div>' +

          // Source quality first: this is the honest answer to "can I trust this
          // price". A site that never states condition or contents can only ever
          // support a reference-only comparison, which is not quotable.
          '<p class="count">Coverage by source · a price is only usable for quoting when the ' +
          'reference, condition and contents are all stated</p>' +
          '<div class="tbl-wrap" style="margin-bottom:18px"><table class="leads"><thead><tr>' +
            '<th>Source</th><th style="width:90px">Products</th><th style="width:80px">Ref</th>' +
            '<th style="width:70px">Year</th><th style="width:100px">Condition</th>' +
            '<th style="width:100px">Contents</th><th style="width:90px"></th>' +
          '</tr></thead><tbody>' +
          RT.bySource.map(function (s) {
              var pct = function (n) { return s.products ? Math.round(100 * n / s.products) + '%' : '—'; };
              var usable = s.products ? Math.round(100 * s.with_set / s.products) : 0;
              return '<tr>' +
                '<td><div class="tname">' + esc(s.name) + '</div></td>' +
                '<td><span class="tmono">' + s.products + '</span></td>' +
                '<td><span class="tmono">' + pct(s.with_ref) + '</span></td>' +
                '<td><span class="tmono">' + pct(s.with_year) + '</span></td>' +
                '<td><span class="tmono">' + pct(s.with_condition) + '</span></td>' +
                '<td><span class="tmono">' + pct(s.with_set) + '</span></td>' +
                '<td>' + (usable > 0 ? '<span class="tag warm">usable</span>'
                                     : '<span class="tag spam">ref only</span>') + '</td>' +
              '</tr>';
          }).join('') +
          '</tbody></table></div>' +

          '<div class="bar">' +
            '<input id="rt-q" class="ctl grow" type="search" placeholder="SEARCH WATCH, REFERENCE, BRAND…" value="' + esc(rtq) + '">' +
            '<select id="rt-src" class="ctl"><option value="">ALL SOURCES</option>' +
              RT.bySource.map(function (s) {
                  return '<option value="' + esc(s.slug) + '"' + (rtSource === s.slug ? ' selected' : '') + '>' +
                         esc(s.name.toUpperCase()) + '</option>';
              }).join('') + '</select>' +
            '<button class="btn ghost" id="rt-refresh">Refresh</button>' +
          '</div>' +
          '<p class="count">' + rows.length + ' of ' + RT.rows.length +
            (rows.length > 400 ? ' · showing first 400' : '') + '</p>' +

          '<div class="tbl-wrap"><table class="leads"><thead><tr>' +
            '<th style="width:56px"></th><th>Watch</th><th style="width:130px">Source</th>' +
            '<th style="width:110px">Price</th><th style="width:180px">Spec</th>' +
          '</tr></thead><tbody>' +
          (shown.length ? shown.map(function (r) {
              var sp = [r.year, r.condition ? r.condition.replace(/_/g,' ') : null,
                        r.set_completeness ? r.set_completeness.replace(/_/g,' ') : null]
                       .filter(Boolean).join(' · ');
              return '<tr>' +
                '<td>' + (r.image_url
                    ? '<img class="wthumb" src="' + esc(r.image_url) + '" alt="" loading="lazy" decoding="async">'
                    : '<span class="wthumb wthumb--none"></span>') + '</td>' +
                '<td><div class="tname">' + esc((r.title || '').slice(0, 72) || '—') + '</div>' +
                    '<div class="tsub">' + esc(r.reference || 'no reference') + '</div></td>' +
                '<td><span class="tsub">' + esc(r.source_slug) + '</span></td>' +
                '<td><span class="tmono">' + esc(money(r.price_usd)) + '</span>' +
                    (r.available === false ? '<div class="tsub">sold</div>' : '') + '</td>' +
                '<td>' + (sp ? '<span class="tsub">' + esc(sp) + '</span>'
                             : '<span class="tmono">not stated</span>') + '</td>' +
                (r.url ? '' : '') +
              '</tr>';
          }).join('') : '<tr><td colspan="5" style="padding:28px 0"><span class="tmono">Nothing matches.</span></td></tr>') +
          '</tbody></table></div>';

        var qi = document.getElementById('rt-q');
        if (qi) qi.addEventListener('input', function () {
            rtq = this.value; var p = this.selectionStart; paintRetail();
            var n = document.getElementById('rt-q');
            if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} }
        });
        var sel = document.getElementById('rt-src');
        if (sel) sel.addEventListener('change', function () { rtSource = this.value; paintRetail(); });
        var rf = document.getElementById('rt-refresh');
        if (rf) rf.addEventListener('click', function () {
            view.innerHTML = '<p class="count">Loading…</p>';
            renderRetail().catch(function (e) { view.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
        });
    }

    if (A.isAuthed()) boot();
})();
</script>
</body>
</html>
