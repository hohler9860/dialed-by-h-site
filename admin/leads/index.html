<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads · Dialed By H</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-fpj-32.png?v=4" />

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/dist/styles.css">

    <style>
        /* Global styles uppercase the whole body; the console needs real casing. */
        body { text-transform: none; opacity: 1 !important; transition: none !important; }

        .admin-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
        }

        .pill {
            display: inline-block;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 9px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 3px 9px;
            border-radius: 999px;
            white-space: nowrap;
        }
        /* Quality reads as a ramp: bright = act now, dim = park it. */
        .q-HOT  { background: rgba(74,222,128,0.14);  color: #4ade80; }
        .q-WARM { background: rgba(56,189,248,0.13);  color: #38bdf8; }
        .q-COLD { background: rgba(148,163,184,0.12); color: #94a3b8; }
        .q-NA   { background: rgba(255,255,255,0.04); color: #555; }

        .c-REAL { background: rgba(255,255,255,0.07); color: #e8e8e8; }
        .c-TEST { background: rgba(255,255,255,0.03); color: #5a5a5a; }
        .c-SPAM { background: rgba(248,113,113,0.12); color: #f87171; }
        .c-NONE { background: rgba(255,255,255,0.03); color: #6b6b6b; }

        .stat-tile { cursor: pointer; transition: border-color .15s, background .15s; }
        .stat-tile:hover { border-color: rgba(255,255,255,0.22); }
        .stat-tile.is-active { border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.06); }

        .ctl {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.10);
            color: #f0f0f0;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            padding: 8px 10px;
            border-radius: 8px;
            outline: none;
        }
        .ctl:focus { border-color: rgba(255,255,255,0.35); }
        .ctl option { background: #141414; color: #f0f0f0; }

        table.leads { width: 100%; border-collapse: collapse; }
        table.leads th {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #888;
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.10);
            white-space: nowrap;
            position: sticky;
            top: 0;
            background: #0d0d0d;
            z-index: 2;
        }
        table.leads th.sortable { cursor: pointer; user-select: none; }
        table.leads th.sortable:hover { color: #f0f0f0; }
        table.leads th .arrow { opacity: .35; margin-left: 4px; }
        table.leads th.sorted .arrow { opacity: 1; }
        table.leads th.sorted { color: #f0f0f0; }

        table.leads td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
            vertical-align: top;
        }
        tr.lead-row { cursor: pointer; }
        tr.lead-row:hover > td { background: rgba(255,255,255,0.025); }
        tr.detail-row > td { background: rgba(255,255,255,0.02); padding: 0 12px 18px; }

        .mono { font-family: 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; }
        .truncate-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .conf-bar { width: 46px; height: 3px; background: rgba(255,255,255,0.10); border-radius: 999px; overflow: hidden; }
        .conf-bar > span { display: block; height: 100%; background: #94a3b8; }

        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 26px; }
        .detail-label { font-family: 'Space Grotesk', sans-serif; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #777; margin-bottom: 3px; }
        .detail-value { font-size: 13px; color: #e2e2e2; white-space: pre-wrap; word-break: break-word; }

        .btn {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700; font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
            padding: 9px 16px; border-radius: 8px; cursor: pointer; transition: background .15s, border-color .15s;
        }
        .btn-primary { background: #f0f0f0; color: #0a0a0a; border: 1px solid #f0f0f0; }
        .btn-primary:hover { background: #fff; }
        .btn-ghost { background: transparent; color: #f0f0f0; border: 1px solid rgba(255,255,255,0.16); }
        .btn-ghost:hover { border-color: rgba(255,255,255,0.4); }

        @media (max-width: 720px) {
            .truncate-cell { max-width: 150px; }
        }
    </style>
</head>
<body class="min-h-screen bg-charcoal text-ivory font-inter">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- LOGIN GATE -->
    <section id="login-gate" class="min-h-screen flex items-center justify-center px-6">
        <div class="admin-card rounded-2xl p-8 sm:p-10 w-full max-w-md">
            <div class="flex items-center gap-3 mb-6">
                <img src="/images/logo.png" alt="Dialed By H" class="h-7 w-auto">
            </div>
            <p class="text-[10px] tracking-[0.3em] uppercase text-muted font-space mb-2">Pipeline</p>
            <h1 class="font-space font-bold text-3xl mb-6 tracking-tight">Leads Login</h1>
            <form id="login-form" class="space-y-4">
                <input id="password-input" type="password" autocomplete="current-password" placeholder="Admin password"
                    class="w-full bg-transparent border-b border-ivory/30 py-3 px-2 text-ivory placeholder-muted/60 focus:border-ivory outline-none font-inter">
                <p id="login-error" class="text-xs text-red-400 hidden">Wrong password.</p>
                <button type="submit" class="w-full bg-ivory text-charcoal py-3 font-space font-bold text-xs uppercase tracking-[0.25em] hover:bg-white transition-colors">
                    Sign In
                </button>
            </form>
        </div>
    </section>

    <!-- CONSOLE -->
    <section id="dashboard" class="hidden">
        <nav class="px-5 sm:px-10 py-5 flex justify-between items-center border-b border-ivory/5">
            <a href="/" class="flex items-center gap-3">
                <img src="/images/logo.png" alt="Dialed By H" class="h-7 sm:h-8 w-auto">
            </a>
            <div class="flex items-center gap-5 text-xs font-space font-medium uppercase tracking-widest">
                <a href="/admin/journal/" class="hover:text-muted transition-colors">Journal</a>
                <a href="/" class="hover:text-muted transition-colors hidden sm:inline">View Site</a>
                <button id="logout-btn" class="text-muted hover:text-ivory transition-colors">Sign Out</button>
            </div>
        </nav>

        <div class="px-5 sm:px-10 py-8 sm:py-12 max-w-[1500px] mx-auto">
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-4 mb-8">
                <div>
                    <p class="text-[10px] tracking-[0.3em] uppercase text-muted font-space mb-2">Pipeline</p>
                    <h1 class="font-space font-bold text-3xl sm:text-4xl tracking-tight">Leads</h1>
                </div>
                <div class="flex items-center gap-3">
                    <button id="export-btn" class="btn btn-ghost">Export CSV</button>
                    <button id="refresh-btn" class="btn btn-primary">Refresh</button>
                </div>
            </div>

            <!-- STAT TILES (clickable filters) -->
            <div id="stats" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-8"></div>

            <!-- CONTROLS -->
            <div class="admin-card rounded-xl p-4 mb-5 flex flex-wrap items-center gap-3">
                <input id="search" class="ctl flex-1 min-w-[200px]" type="search"
                       placeholder="Search name, email, phone, watch, notes…" autocomplete="off">
                <select id="f-class" class="ctl" aria-label="Classification">
                    <option value="REAL">Real leads</option>
                    <option value="">All classes</option>
                    <option value="TEST">Test</option>
                    <option value="SPAM">Spam</option>
                    <option value="__none">Unclassified</option>
                </select>
                <select id="f-quality" class="ctl" aria-label="Quality">
                    <option value="">Any quality</option>
                    <option value="HOT">Hot</option>
                    <option value="WARM">Warm</option>
                    <option value="COLD">Cold</option>
                </select>
                <select id="f-type" class="ctl" aria-label="Submission type">
                    <option value="">Any type</option>
                    <option value="BUY">Buy</option>
                    <option value="SELL">Sell</option>
                    <option value="TRADE">Trade</option>
                    <option value="WATCH_DETAIL">Watch detail</option>
                    <option value="JOIN_LIST">Join list</option>
                </select>
                <select id="f-status" class="ctl" aria-label="Status">
                    <option value="">Any status</option>
                    <option value="new">New</option>
                    <option value="contacted">Contacted</option>
                    <option value="negotiating">Negotiating</option>
                    <option value="closed">Closed</option>
                    <option value="archived">Archived</option>
                </select>
                <button id="clear-btn" class="btn btn-ghost">Clear</button>
            </div>

            <p id="result-count" class="text-muted text-xs font-space uppercase tracking-[0.2em] mb-3"></p>

            <div class="admin-card rounded-xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="leads">
                        <thead>
                            <tr>
                                <th class="sortable" data-sort="created_at">Date <span class="arrow">↓</span></th>
                                <th class="sortable" data-sort="full_name">Name <span class="arrow">↕</span></th>
                                <th>Contact</th>
                                <th class="sortable" data-sort="submission_type">Type <span class="arrow">↕</span></th>
                                <th>Watch</th>
                                <th class="sortable" data-sort="lead_class">Class <span class="arrow">↕</span></th>
                                <th class="sortable" data-sort="lead_quality">Quality <span class="arrow">↕</span></th>
                                <th class="sortable" data-sort="lead_confidence">Conf <span class="arrow">↕</span></th>
                                <th class="sortable" data-sort="status">Status <span class="arrow">↕</span></th>
                            </tr>
                        </thead>
                        <tbody id="tbody">
                            <tr><td colspan="9" class="text-muted text-sm p-6">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <script src="/scripts/admin-auth.js"></script>
    <script>
    (function () {
        const ENDPOINT = "/api/leads-admin";

        const loginGate  = document.getElementById("login-gate");
        const dashboard  = document.getElementById("dashboard");
        const loginForm  = document.getElementById("login-form");
        const passwordIn = document.getElementById("password-input");
        const loginError = document.getElementById("login-error");
        const logoutBtn  = document.getElementById("logout-btn");
        const tbody      = document.getElementById("tbody");
        const statsEl    = document.getElementById("stats");
        const countEl    = document.getElementById("result-count");
        const searchEl   = document.getElementById("search");
        const fClass     = document.getElementById("f-class");
        const fQuality   = document.getElementById("f-quality");
        const fType      = document.getElementById("f-type");
        const fStatus    = document.getElementById("f-status");

        const STATUSES = ["new", "contacted", "negotiating", "closed", "archived"];
        const QUALITY_RANK = { HOT: 3, WARM: 2, COLD: 1, NA: 0 };
        const CLASS_RANK   = { REAL: 3, SPAM: 2, TEST: 1 };

        let allLeads = [];
        let stats = null;
        let sortKey = "created_at";
        let sortDir = "desc";
        const expanded = new Set();

        function escHtml(s) {
            return String(s == null ? "" : s)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function fmtDate(iso) {
            if (!iso) return "—";
            try {
                return new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "2-digit" });
            } catch { return "—"; }
        }
        function fmtDateTime(iso) {
            if (!iso) return "—";
            try { return new Date(iso).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" }); }
            catch { return "—"; }
        }

        // ── filtering ──────────────────────────────────────────
        function matches(l) {
            const cls = fClass.value;
            if (cls === "__none") { if (l.lead_class) return false; }
            else if (cls && l.lead_class !== cls) return false;

            if (fQuality.value && l.lead_quality !== fQuality.value) return false;
            if (fType.value && l.submission_type !== fType.value) return false;

            if (fStatus.value) {
                const s = l.status || "new";
                if (s !== fStatus.value) return false;
            }

            const q = searchEl.value.trim().toLowerCase();
            if (q) {
                const hay = [
                    l.full_name, l.email, l.phone, l.watch_name, l.watch_ref,
                    l.watch_details, l.budget, l.lead_reason,
                ].filter(Boolean).join(" ").toLowerCase();
                if (!hay.includes(q)) return false;
            }
            return true;
        }

        function sortValue(l, key) {
            switch (key) {
                case "lead_quality":    return QUALITY_RANK[l.lead_quality] ?? -1;
                case "lead_class":      return CLASS_RANK[l.lead_class] ?? -1;
                case "lead_confidence": return typeof l.lead_confidence === "number" ? l.lead_confidence : -1;
                case "created_at":      return l.created_at ? Date.parse(l.created_at) : 0;
                case "status":          return (l.status || "new").toLowerCase();
                default:                return String(l[key] || "").toLowerCase();
            }
        }

        function currentView() {
            const rows = allLeads.filter(matches);
            rows.sort((a, b) => {
                const av = sortValue(a, sortKey), bv = sortValue(b, sortKey);
                if (av < bv) return sortDir === "asc" ? -1 : 1;
                if (av > bv) return sortDir === "asc" ? 1 : -1;
                // Stable tiebreak so equal keys don't shuffle between renders.
                return Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0);
            });
            return rows;
        }

        // ── rendering ──────────────────────────────────────────
        function renderStats() {
            if (!stats) return;
            const tiles = [
                { label: "Total",        value: stats.total,        filter: null },
                { label: "Real leads",   value: stats.real,         filter: { cls: "REAL" } },
                { label: "Hot",          value: stats.hot,          filter: { cls: "REAL", q: "HOT" } },
                { label: "Warm",         value: stats.warm,         filter: { cls: "REAL", q: "WARM" } },
                { label: "Untouched",    value: stats.newStatus,    filter: { cls: "REAL", st: "new" } },
                { label: "Test / spam",  value: stats.test + stats.spam, filter: { cls: "TEST" } },
            ];
            statsEl.innerHTML = tiles.map((t, i) => `
                <div class="admin-card stat-tile rounded-xl p-4" data-tile="${i}">
                    <div class="text-[9px] tracking-[0.22em] uppercase text-muted font-space mb-1">${escHtml(t.label)}</div>
                    <div class="font-space font-bold text-2xl mono">${t.value}</div>
                </div>`).join("");

            statsEl.querySelectorAll("[data-tile]").forEach(el => {
                el.addEventListener("click", () => {
                    const t = tiles[Number(el.dataset.tile)];
                    if (!t.filter) { fClass.value = ""; fQuality.value = ""; fStatus.value = ""; }
                    else {
                        fClass.value   = t.filter.cls || "";
                        fQuality.value = t.filter.q   || "";
                        fStatus.value  = t.filter.st  || "";
                    }
                    fType.value = "";
                    render();
                });
            });
        }

        function statusSelect(l) {
            const cur = l.status || "new";
            return `<select class="ctl js-status" data-id="${escHtml(l.id)}" style="font-size:11px;padding:5px 7px;">
                ${STATUSES.map(s => `<option value="${s}"${s === cur ? " selected" : ""}>${s}</option>`).join("")}
            </select>`;
        }

        function detailRow(l) {
            const field = (label, val) => !val ? "" : `
                <div><div class="detail-label">${escHtml(label)}</div><div class="detail-value">${escHtml(val)}</div></div>`;
            return `
            <tr class="detail-row" data-detail-for="${escHtml(l.id)}">
                <td colspan="9">
                    <div class="detail-grid pt-1">
                        ${field("Full name", l.full_name)}
                        ${field("Email", l.email)}
                        ${field("Phone", l.phone)}
                        ${field("Budget", l.budget)}
                        ${field("Watch", l.watch_name)}
                        ${field("Reference", l.watch_ref)}
                        ${field("Submitted", fmtDateTime(l.created_at))}
                        ${field("Classified", l.classified_at ? fmtDateTime(l.classified_at) : "Not yet classified")}
                        ${field("Why this score", l.lead_reason)}
                        ${field("Row id", l.id)}
                    </div>
                    ${l.watch_details ? `
                        <div class="mt-4">
                            <div class="detail-label">Details</div>
                            <div class="detail-value">${escHtml(l.watch_details)}</div>
                        </div>` : ""}
                    <div class="mt-4 flex flex-wrap gap-3">
                        ${l.email ? `<a class="btn btn-ghost" href="mailto:${encodeURIComponent(l.email)}">Email</a>` : ""}
                        ${l.phone ? `<a class="btn btn-ghost" href="sms:${encodeURIComponent(l.phone)}">Text</a>` : ""}
                        ${l.phone ? `<a class="btn btn-ghost" target="_blank" rel="noopener"
                            href="https://wa.me/${encodeURIComponent(String(l.phone).replace(/\D/g, ""))}">WhatsApp</a>` : ""}
                    </div>
                </td>
            </tr>`;
        }

        function render() {
            const rows = currentView();

            countEl.textContent = rows.length === allLeads.length
                ? `${rows.length} leads`
                : `${rows.length} of ${allLeads.length} leads`;

            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-muted text-sm p-8 text-center">
                    No leads match these filters.</td></tr>`;
                return;
            }

            tbody.innerHTML = rows.map(l => {
                const cls = l.lead_class || "NONE";
                const qual = l.lead_quality || "NA";
                const conf = typeof l.lead_confidence === "number" ? l.lead_confidence : null;
                const watch = [l.watch_name, l.watch_ref].filter(Boolean).join(" · ");
                const open = expanded.has(l.id);
                return `
                <tr class="lead-row" data-id="${escHtml(l.id)}">
                    <td class="mono text-muted whitespace-nowrap">${fmtDate(l.created_at)}</td>
                    <td><div class="truncate-cell">${escHtml(l.full_name || "—")}</div></td>
                    <td>
                        <div class="truncate-cell text-muted" style="font-size:12px">${escHtml(l.email || "")}</div>
                        <div class="mono text-muted" style="font-size:12px">${escHtml(l.phone || "")}</div>
                    </td>
                    <td><span class="text-muted font-space" style="font-size:10px;letter-spacing:.12em">${escHtml(l.submission_type || "")}</span></td>
                    <td><div class="truncate-cell">${escHtml(watch || "—")}</div></td>
                    <td><span class="pill c-${escHtml(cls)}">${escHtml(l.lead_class || "unclassified")}</span></td>
                    <td><span class="pill q-${escHtml(qual)}">${escHtml(qual)}</span></td>
                    <td>
                        ${conf === null ? '<span class="text-muted">—</span>' : `
                            <div class="mono" style="font-size:11px">${conf}</div>
                            <div class="conf-bar"><span style="width:${Math.max(0, Math.min(100, conf))}%"></span></div>`}
                    </td>
                    <td>${statusSelect(l)}</td>
                </tr>
                ${open ? detailRow(l) : ""}`;
            }).join("");

            // Header sort indicators
            document.querySelectorAll("th.sortable").forEach(th => {
                const active = th.dataset.sort === sortKey;
                th.classList.toggle("sorted", active);
                const arrow = th.querySelector(".arrow");
                if (arrow) arrow.textContent = active ? (sortDir === "asc" ? "↑" : "↓") : "↕";
            });
        }

        // ── events ─────────────────────────────────────────────
        tbody.addEventListener("click", (e) => {
            if (e.target.closest(".js-status") || e.target.closest("a")) return;
            const row = e.target.closest("tr.lead-row");
            if (!row) return;
            const id = row.dataset.id;
            if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
            render();
        });

        tbody.addEventListener("change", async (e) => {
            const sel = e.target.closest(".js-status");
            if (!sel) return;
            const id = sel.dataset.id;
            const next = sel.value;
            const lead = allLeads.find(l => l.id === id);
            const prev = lead ? (lead.status || "new") : "new";
            sel.disabled = true;
            try {
                await window.dialedAdmin.adminFetchTo(ENDPOINT, "set-status", { id, status: next });
                if (lead) lead.status = next;
                // Re-render so a status filter drops the row if it no longer matches.
                if (fStatus.value) render();
            } catch (err) {
                if (err.message === "Unauthorized") return showLogin();
                sel.value = prev;
                alert("Could not update status: " + err.message);
            } finally {
                sel.disabled = false;
            }
        });

        document.querySelectorAll("th.sortable").forEach(th => {
            th.addEventListener("click", () => {
                const key = th.dataset.sort;
                if (sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
                else { sortKey = key; sortDir = (key === "created_at" || key === "lead_confidence" || key === "lead_quality") ? "desc" : "asc"; }
                render();
            });
        });

        [searchEl, fClass, fQuality, fType, fStatus].forEach(el => {
            el.addEventListener("input", render);
            el.addEventListener("change", render);
        });

        document.getElementById("clear-btn").addEventListener("click", () => {
            searchEl.value = ""; fClass.value = ""; fQuality.value = ""; fType.value = ""; fStatus.value = "";
            render();
        });

        document.getElementById("refresh-btn").addEventListener("click", load);

        document.getElementById("export-btn").addEventListener("click", () => {
            const rows = currentView();
            const cols = ["created_at","submission_type","full_name","email","phone","budget",
                          "watch_name","watch_ref","lead_class","lead_quality","lead_confidence",
                          "lead_reason","status","watch_details"];
            // Prefix formula characters so a cell can't execute on open in Excel/Sheets.
            const cell = (v) => {
                let s = v == null ? "" : String(v);
                if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
                return `"${s.replace(/"/g, '""')}"`;
            };
            const csv = [cols.join(",")]
                .concat(rows.map(r => cols.map(c => cell(r[c])).join(",")))
                .join("\r\n");
            const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `dialed-leads-${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        });

        // ── data ───────────────────────────────────────────────
        async function load() {
            tbody.innerHTML = `<tr><td colspan="9" class="text-muted text-sm p-6">Loading…</td></tr>`;
            try {
                const data = await window.dialedAdmin.adminFetchTo(ENDPOINT, "list");
                allLeads = data.leads || [];
                stats = data.stats || null;
                if (data.truncated) console.warn("Lead list was truncated by the server cap.");
                renderStats();
                render();
            } catch (e) {
                if (e.message === "Unauthorized") return showLogin();
                tbody.innerHTML = `<tr><td colspan="9" class="text-red-400 text-sm p-6">Error: ${escHtml(e.message)}</td></tr>`;
            }
        }

        function showDashboard() {
            loginGate.classList.add("hidden");
            dashboard.classList.remove("hidden");
            load();
        }
        function showLogin() {
            dashboard.classList.add("hidden");
            loginGate.classList.remove("hidden");
            passwordIn.value = "";
            passwordIn.focus();
        }

        loginForm.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            loginError.classList.add("hidden");
            const ok = await window.dialedAdmin.tryLoginWith(passwordIn.value.trim(), ENDPOINT, "list");
            if (ok) showDashboard(); else loginError.classList.remove("hidden");
        });

        logoutBtn.addEventListener("click", () => {
            window.dialedAdmin.clearToken();
            showLogin();
        });

        if (window.dialedAdmin.isAuthed()) {
            window.dialedAdmin.adminFetchTo(ENDPOINT, "list")
                .then(showDashboard)
                .catch(() => { window.dialedAdmin.clearToken(); showLogin(); });
        } else {
            showLogin();
        }
    })();
    </script>
</body>
</html>
