form input:focus,form textarea:focus{border-color:var(--cream)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
.sub{margin-top:6px;width:100%}
.msg{font-family:var(--works);color:var(--grey-light);font-size:16px;margin:0}

<script>
(function(){
  var t=document.getElementById('toggle'),f=document.getElementById('fallback'),msg=document.getElementById('msg');
  t.addEventListener('click',function(){
    f.hidden=!f.hidden;t.setAttribute('aria-expanded',String(!f.hidden));
    if(!f.hidden){document.getElementById('f-name').focus();if(window.dbhTracking)window.dbhTracking.open(f,'BUY');}
  });
  f.addEventListener('submit',async function(e){
    e.preventDefault();
    if(!f.checkValidity()){f.reportValidity();return;}
    var btn=f.querySelector('.sub'),label=btn.querySelector('span');
    var d=new FormData(f);
    var payload={
      type:'BUY',
      fullName:d.get('fullName'),email:d.get('email'),phone:d.get('phone')||null,
      location:d.get('location')||null,watchDetails:(d.get('watchDetails')||'').trim()||'Source page inquiry',
      watchName:null,watchRef:null,budget:null,preferred:'Email',okToText:true,
      website:d.get('website')||'',
      attribution:window.dbhTracking?window.dbhTracking.context(f):null
    };
    label.textContent='Sending';btn.disabled=true;msg.hidden=true;
    if(window.dbhTracking)window.dbhTracking.attempt(f);
    try{
      var r=await fetch('/api/submit-form',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!r.ok){var err=await r.json().catch(function(){return {};});throw new Error(err.error||'Something went wrong');}
      msg.textContent='Got it. I will be in touch within a few hours.';msg.hidden=false;
      label.textContent='Sent';
      if(typeof fbq==='function')fbq('track','Lead',{content_name:'SOURCE'});
    }catch(e2){
      if(window.dbhTracking)window.dbhTracking.error(f);
      msg.textContent=e2.message+'. You can also message me on WhatsApp above.';msg.hidden=false;
      label.textContent='Send';btn.disabled=false;
    }
  });
})();
</script>
